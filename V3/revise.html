mic sphere",[]],["Hoebel has stated that the village and its hamlets represented \"India in microcosm\".",[]]]],["Importance of Village Studies in India",[["ANDRE BETTEILE: Village reflected the basic values of Indian civilisation.",[]],["A more realistic picture",[]],["the book view gave way for field work for a more realistic assessment of villages.",[]],["studied in terms of their economic basis.",[]],["Cropping patterns were studied and the agrarian structures were analyzed.",[]],["Evils prevailing in the Indian villages were also realistically assessed",[]],["S.C. DUBE after caste gender was the most important factor that governed division of labour in village.",[]]]],["According to A. Beteille : THE VILLAGE WAS NOT ONLY CASTE CONSCIOUS BUT GENDER CONSCIOUS ALSO",[]],["S.C. Dube was critical of village studies:These are not often representative in nature. Village studies exaggerate the unity self-sufficiency of the village. and",[]],["Village studies are influenced by alien concepts. Those who undertake village studies imitate western methods.",[]]]},{"id":"S2|12","s":"S2","g":"Sociology Paper 2","t":"Evolution of land tenure system","p":10,"ch":"","items":[["Commarswamy: historical land was not private properties, but matter of traditional right, community owned.",[]],["Majumdar: land belonged to king",[]],["A.R. Desai - king partial owner and right were also given to priest and official",[]],["Sultanate period- no big change",[]],["Mughal period- o considerable change and traditional right still accepted but tax imposed, monetary tax introduced o Systematic division- pargana, taluk, o Officers zamindars, Talukdar o Aurangzeb- land leased to highest bidder.",[]],["British - Land linked to market 1st time o Permanent Settlement o Ryotwari o Mahalwari",[]],["Post independence land reform by state",[]]]},{"id":"S2|13","s":"S2","g":"Sociology Paper 2","t":"Impact of Land Reforms","p":10,"ch":"","items":[["Prasad Rao – Land Reform had big impact on Telangana region hies, o Gupta argues that different origin sales of Jati puranas of different castes justify different hierarchies o Brahmins are not always at the top",[]],["The existence of various models of Sanskritisation for upward mobility also strongly indicates the presence of multiple caste hierarchies.",[]]]]]},{"id":"S2|15","s":"S2","g":"Sociology Paper 2","t":"Features of caste system","p":11,"ch":"","items":[["Hierarchy",[]],["Caste based occupation",[]],["Endogamy",[]],["Feeding and social intercourse restriction",[]],["Civil and religious disabilities",[]],["Social mobility",[]],["Segmental organisation",[]],["Common name and common decent",[]],["Ascriptive",[]]]},{"id":"S2|16","s":"S2","g":"Sociology Paper 2","t":"Untouchability- Forms","p":11,"ch":"","items":[["Untouchability refers not just to the avoidance or prohibition of physical contact but to a much broader set of social sanctions and social disabilities which are ascriptive in nature within the ritual framework of the caste system.",[]],["Restrictions imposed on Avarna by all other higher castes",[]],["An integral aspect of caste system - While Shudra consider Dalits as untouchables, they themselves are untouchable to the other upper castes in the hierarchy.",[]],["Ghanshyam Shah, Harsh Mander and Sukhdev Thorat: have, in their Untouchability in Rural India, 2006, concluded that untouchability is still practiced in various forms in around 80 per cent of the villages.",[]],["Violence is the extreme manifestation of untouchability.",[]],["Common forms of untouchability that exits are",[["Habitation segregation",[]]]],["Occupational segregation and manual scavenging",[]],["Civil segregation",[]],["Ritual segregation",[]],["Inter caste marriages",[]],["Cultural segregation",[]],["Political segregation",[]],["Economic exportation",[]],["Violence",[]],["Other forms and practices",[]],["Gandhi on caste",[["Gandhi challenged the caste system from above.",[]],["Varna Vyavastha was integral to the Hindu social organisation, though it needed reforms.",[]],["Sought social change within Hinduism.",[]],["Solution to untouchability in terms of gradual change of hearts of Hindus.",[]],["Gave untouchables a new name-Harijan-to denote that they are equal children of god.",[]],["Every work was sacred",[]],["Reformation of caste and Hindu society.",[]]]],["Ambedkar on Caste",[["He deemed it as a product of Brahminical distortions",[]],["Gave the Theory of Broken Men to explain the subjugation of untouchables.",[]],["Untouchables were the people who lost the wars and were merely Broken Men in the beginning.",[]],["Radical views on caste",[]],["Using state as an instrument for establishing forward-thinking social policies.",[]],["Envisaged a political economic solution in terms of change of the structure itself.",[]],["Gandhian notion of Harijan as a device to disguise the hard reality of caste.",[]],["Work assigned to untouchables was not held in similar respect as of other caste's work and it was the most dehumanising.",[]],["Ambedkar wanted annihilation of caste.",[]]]]]},{"id":"S2|17","s":"S2","g":"Sociology Paper 2","t":"Mobility in caste system","p":12,"ch":"","items":[["KL SHARMA ON MOBILITY IN CASTE SYSTEM",[]],["He defines three levels of mobility in caste system-",[["Mobility of Individual - Some individuals, even of low caste, may have a better status",[]],["Scriptures also have accounts of a Brahmin liable to lose his status",[]],["Mobility of a minority of families - could be a result of acquisition of land and education",[]],["Mobility of majority of groups of families- Sanskritisation was the chief process which helped such castes to move up in hierarchy",[]],["Various contemporary and historical avenues of mobility in caste system are-",[]],["1. Political power and mobility – Srinivas says major sources of mobility: Fluidity of the political system .",[]],["2. Land ownership change -",[]]]],["3. Matrimonial alliances - Marriage is also one of the oldest vehicles of mobility within the hierarchy, Anuloma or hypergamous marriages even had the sanction of scriptures.",[]],["4. Cultural mobility-Sanskritisation and Westernisation",[]],["5. Wars and mobility- All the invaders were given the status of Kshatriyas for their warrior nature.",[]],["6. Social movements and mobility- Those castes, temple Entry Satyagraha, SNDP movement etc.",[]],["7. Caste and occupation discrepancy",[]],["8. Policy measures",[]],["9. Census and mobility",[]],["10. Geographic migration and mobility- where their identity is not known, they are free to adopt new identities.",[]],["11. Education, secularisation, democracy, industrialisation and urbanisation.",[]]]},{"id":"S2|18","s":"S2","g":"Sociology Paper 2","t":"Class – caste nexus","p":13,"ch":"","items":[["Edmund leach – caste -cooperation",[]],["Class – competition",[]],["Weber – caste highest form of status based stratification",[]],["Dumont – caste and class different hierarchy and opposition of purl and impure",[]],["A R Desai – caste inheres underdeveloped but potentially explosive class character",[]],["Andare Beteille – hierarchies of caste and power overlap in village but also cut across. Harold Gould– (study of rikshawallas in Lucknow) Workplace secular, private life still religious",[]],["M.N Srinivas – caste as a pressure group in political sphere.",[]],["Andre Betielle- caste in politics",[]],["Ghurye – attack on hierarchy are likely to lead to horizontal consolidation of caste groups, (seen now as caste associations)",[]],["Rudolph - caste in its transformed state help Indian (70% in village) to make a success of representative democracy",[]],["Hira Singh – Indian outside country almost lost their caste identities and even some dropped caste name in “recasting caste”.",[]]]},{"id":"S2|19","s":"S2","g":"Sociology Paper 2","t":"Tribes","p":13,"ch":"","items":[["West",[["Who lived in geographical isolation",[]],["Practiced primitive religion",[]],["Devoid of technology (primitive)",[]],["Chiefdoms",[ ntire Indian economy is non capitalist, but there are some islands of pre capitalism",[]]]],["Gail Omvedt – Multiple modes of production:",[["1. Capilalist mode- Haryana, Punjab",[]],["2. Semi capitalists – Andhra, Rajasthan, Gujrat",[]],["3. Feudal mode- Bihar",[]],["4. Semi feudal – West Bengal , Assam",[]]]],["Dhanagre gives feature of feudal mode and capitalists mode",[]],["Feudal",[["1. Indebtness",[]],["2. Low use of tech",[]],["3. Emotional attitude to land",[]],["4. Low productivity",[]],["5. Lack of developed market",[]]]],["Capitalist",[["1. Investment, profit",[]],["2. High tech",[]],["3. Commercialization of land",[]],["4. High productivity well developed market",[]]]]]},{"id":"S2|21","s":"S2","g":"Sociology Paper 2","t":"Feminisation of agriculture:","p":17,"ch":"","items":[["Contradictory situation :",[]],["o rural rich doing contract farming employing new tech",[]],["o Rural poor migrating",[]],["Positive:",[["Women independent to take decision",[]],["Responsible enough to go to block affairs and the panchayat executive for grievance redressed",[]],["Learned alternative skills of employment",[]],["Uravashi Jain: Kasaba area Bihar women engaged in money types of activity rearing goats, chicken selling vegetable.",[]]]],["Negative:",[["Social cleavage gender discrimination comes in way of entrepreneurship",[]],["Low level skilling know how and absence of social capital – low level of production",[]],["Gender wage gap-paid less",[]],["Informal sector- agrarian suffer from lacuna of informal sector.",[]]]]]},{"id":"S2|22","s":"S2","g":"Sociology Paper 2","t":"Indian middle class","p":18,"ch":"","items":[["Evolution of Indian middle class",[]],["Conceptualizations of middle-class in India is complex because of caste and",[]],["hierarchies of caste and economic status, do not necessarily necessarily",[]],["coincide, there can be challenges in determining the status",[["D L Seth traces evolution of middle class in three phases in India",[]],["Colonial phase due to primary westernisation and secondary westernization (Srinivas)",[]],["Indian renaissance: during this phase due to social reforms and nationalistic movement, rise of education and secular occupations provided avenue for growth of middle class.",[]],["Post independence: green revolution, L.P.G. Reforms, salaried middle class saw rise.",[]]]],["Features of middle class:",[["B.B. MISHRA:",[]]]],["o Western middle class had its origin in economic technological changes",[]],["o Was engaged in trade and industry Whereas Indian middle-class saw its rise",[]],["due to change in law and political administration system.",[]],["o It mainly comprised learned professionals.",[["focused on secular mobility",[]],["focus towards achieving education.",[]],["Middle class women: o working women modern in professional outlook o traditional in private space",[]],["Orientation toward nuclear family, but strong kinship ties.",[]],["The value attached to children has changed, (earlier god gift), now middle class focus on small families and believe in family planning.",[]],["The rise of double income no kid families is manifestation of same.",[]],["Amartya Sen, Indian middle class scrutinize public policies leads to public debates and discourse and act as public think tanks.",[]],["Yogendra Singh : o Urban middle class and rural middle class are similar of logical level (For example, both rural and urban middle class or conservative. Narrow and follow utilitarian ethos), o but antagonistic at another as they have different interest o Rural middle classes is interested in agriculture and power bound, o post Green Revolution, rural middle class is seen declining, o Urban middle class is market oriented and it is expanding.",[]],["Gurucharan Das: o Indian middle class follow multiple occupations and is open, dynamic, liberated o de ritualized o It is outgoing, risk-taking, and innovative.",[]]]],["T.K. OOMMEN: harbinger of silent revolution as it has via NGOs and PIL has raised voice of "3. Consanguity is the main consideration.",[]],["4. Among some castes, exogamous clans are arranged in hypergamous hierarchy.",[]],["5. Relations between kin are governed by ‘neota gifts i.e. cash gift given is equivalent to ‘cash gift received",[]],["6. In Gujrat marriage with mamera type of cousin and levirate is practised.",[]]]],["Features of South Indian kinship",[["1. There is a system of caste endogamy and clan exogamy",[]],["2. Marriage of maternal parallel cousins is not permitted",[]],["3. There is practice of sororate, but levirate is a taboo",[]],["4. Preferential mating in south o first preference: elder sister’s daughter, o second preference: father’s sister’s daughter, o third preference: mother’s brother’s daughter",[]],["5. Idea of marriage is to strengthen existing kinship bonds instead of extending kinship",[]]]]]},{"id":"S2|25","s":"S2","g":"Sociology Paper 2","t":"RELIGION AND SOCIETY","p":20,"ch":"","items":[["Minorties: Muslim, Parsi, Jain, sikh, Christians, Buddhism",[]],["Problems of minorities:",[]],["o Social relations between minorities and majority is defined by suspicion, less harmonious , perceived threat to identity",[]],["o Low representation in public jobs armed forces",[]],["o Test to Indian secularism lies in not what majority thought, but minority feels.",[]],["Specific problems of some minorities",[["Muslims:",[]]]],["o Lacking in human development",[]],["o Sacchar Committee: Muslim in India three fold problem",[["Problem of identity",[]],["Problem of security",[]],["Equity",[]]]],["Christian minority: face identity problem as well missionaries are alleged of forced conversions. Schedule caste status demand for Dalit Christian minorities.",[]],["Sikhs: poor sex ratio , extremism (khalistan ), substance abuse",[]],["Parsis: declining population , childlessness , migration",[]]]},{"id":"S2|26","s":"S2","g":"Sociology Paper 2","t":"Great Tradition and Little Tradition","p":20,"ch":"","items":[["Milton Singer and by McKim Marriott",[["The social structure of civilisations operates at two levels; first is that of folks or unlettered peasants which is called Little Tradition; elite or reflexive few called Great Tradition.",[]],["While the Little Tradition is often localised, Great Tradition has a tendency to spread out.",[]],["It is based on an evolutionary-dialectic perspective",[]],["Little and Great traditions in India not only interact, but are also interdependent and modernizing forces are not only accepted, but they get absorbed in tradition.",[]]]],["McKim Marriott- Some elements of the Little Tradition are sent upward which he terms as universalisation and some elements of the Great Tradition are passed downwards which he terms as parochialisation.",[]]]},{"id":"S2|27","s":"S2","g":"Sociology Paper 2","t":"Community Development Planning","p":21,"ch":"","items":[["CDP 1952 – It was important because it seemed to build up community as well as individual, making them builder of their own life.",[]],["Planning commission – CDP is method through which FYP seeks to initiate a process of transformation of social and economic life of village.",[]],["Emphasis",[]],["1. Achievement of Self Reliance among people",[]],["2. Ending dependency on others by lowering down the interference of external agency",[]],["S C Dube- Fundamentals for removal of discrepancy between the mentality of planners and people",[]],["Positive aspect of community development programme: o Strengthened village solidarity o Build infrastructure at village level o Made government visible",[]],["Negative aspects of community development : o S.C. DUBE: faulty implementation, attitude of bureaucrats more towards the pleasing official superiors rather than being oriented towards village people. o A.R. DESAI: Caste hierarchies were not taken into consideration. o Oscar Lewis : bureaucracy lacked service mentality",[]],["S C Dube- fundamental for removal of discrepancy between the mentality of",[]],["planners and people",[["1. Develo ing areas, wells, and sewage systems.",[["Example: Citadel area of Mohenjo-daro, with its well-designed houses reflecting the lifestyle of inhabitants.",[]]]]]],["Public Structures and Granaries",[["Architecture: Public structures such as the Great Bath, granaries, and assembly halls were part of urban centers.",[["Features: Great Bath at Mohenjo-daro served as a communal area for ritualistic bathing, possibly a symbol of social unity.",[]],["Example: Granary at Harappa, showcasing the importance of efficient storage in an agrarian society.",[]]]]]],["Drainage Systems",[["Architecture: Advanced drainage systems with covered drains and soakage pits were integral to the cities.",[]],["Features: Demonstrated engineering skills in water management and hygiene.",[["Example: Complex drainage network at Mohenjo-daro, ensuring efficient disposal of wastewater.",[]]]]]],["Seal Carvings and Artifacts",[["Architecture: Artifacts like seals with intricate carvings provide insights into their art and culture.",[["Features: Seals with script and animal motifs offer glimpses into trade, religion, and society.",[]],["Example: Pashupati seal, depicting a horned deity, reflects their religious beliefs.",[]]]]]],["Trade and Dockyards",[["Architecture: Lothal had an advanced dockyard and warehouse system, indicating maritime trade.",[]],["Features: Well-organized dockyards, drainage systems, and storage facilities.",[["Example: Lothal's dockyard, with its well-structured berths, showcases maritime connectivity.",[]]]]]],["Symbolism in Architecture",[["Architecture: Some structures might have held symbolic significance, like the Great Bath.",[["Features: Great Bath's pool and steps, possibly used for rituals or purification ceremonies.",[]],["Example: Great Bath's unique design, highlighting cultural and religious practices.",[]],["The architecture of the Indus Valley Civilization reveals their advanced urban planning, engineering skills, and cultural expressions. Despite the enigmatic nature of the civilization's script, their architectural legacy stands as a testament to their achievements and societal organization.",[]]]]]]]},{"id":"G2|1","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"2. Mauryan Architecture","p":4,"ch":"","items":[["Overview",[["The Mauryan period marked a significant phase in ancient Indian architecture, characterized by architectural innovations and the establishment of monumental structures that reflected the socio-political and cultural ethos of the era.",[]]]],["Pillars and Rock-Cut Architecture",[["Architecture: Pillars with distinctive lion capital and rock-cut chambers were prominent architectural forms.",[]],["Features: Mauryan pillars served as monumental markers, while rock-cut chambers provided functional spaces.",[]],["Example: The Ashoka Pillar at Sarnath, crowned by a lion capital, symbolized Ashoka's Dhamma and imperial reach.",[]]]],["Stupas",[["Architecture: Stupas were essential Buddhist structures for religious and commemorative purposes.",[]],["Features: Circular mounds with circumambulatory paths, often containing relics.",[["Example: Sanchi Stupa, adorned with elaborate carvings depicting scenes from Buddha's life.",[]]]]]],["Palace Architecture",[["Architecture: Palaces were significant administrative and residential structures.",[]],["Features: Raised platforms, pillared halls, and intricate carvings on railings.",[]],["Example: The Pataliputra Palace, showcasing architectural elegance and administrative significance.",[]]]],["Pillar Edicts and Inscriptions",[["Architecture: Pillar edicts served as inscribed proclamations to communicate imperial policies.",[]],["Features: Emphasis on spreading moral values, justice, and social welfare.",[]],["Example: The Sarnath Pillar Edict, conveying Ashoka's message of ethical governance.",[]]]],["Urban Planning",[["Architecture: Cities like Pataliputra exhibited organized layouts and advanced planning.",[]],["Features: Roads, markets, and structures for governance and trade.",[]],["Example: The ancient city of Pataliputra, reflecting urban design and administrative efficiency.",[]]]],["Architecture and Buddhist Patronage",[["Architecture: Buddhist monasteries and religious sites flourished during this period.",[]],["Features: Monastic complexes, meditation halls, and intricate sculptures.",[]],["Example: The Barabar Caves, showcasing rock-cut architecture for religious practices.",[["The Mauryan era showcased remarkable architectural innovations. Pillars, stupas, and palaces symbolized imperial might. Today, India preserves this legacy, a testament to the nation's cultural continuity and architectural brilliance.",[]]]]]]]},{"id":"G2|2","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"3. Gupta Period","p":5,"ch":"","items":[["Overview",[["The Gupta Period, a pinnacle of Indian history, encompassed a rich tapestry of achievements that shape diverse aspects of contemporary India.",[]]]],["Literary and Artistic Renaissance",[]],["Literature",[["Kalidasa's literary masterpieces like 'Shakuntala' showcased Gupta literary refinement.",[]]]],["Artistry",[["Gupta sculptures embodied classical aesthetics, as seen in the Sarnath Lion Capital.",[]]]],["Economical and Administrative Brilliance",[]],["Economic Prosperity",[["Flourishing trade, agrarian expansion underpinned Gupta economic stability.",[]]]],["Administrative Excellence",[["Efficient governance facilitated cultural and economic growth.",[]]]],["Scientific and Intellectual Advancements",[]],["Mathematics and Astronomy",[["Aryabhata's contributions laid the foundation for modern mathematics and astronomy.",[]]]],["Medicine",[["'Charaka Samhita' and 'Sushruta Samhita' advanced medical knowledge.",[]]]],["Temple Architecture and Cultural Flourish",[]],["Architectural Marvels",[["Gupta temple architecture flourished, with Dasavatara Temple exemplifying Gupta prowess.",[]]]],["Cultural Synthesis",[["Gupta period marked harmonious blend of diverse artistic and cultural traditions.",[]]]],["Socio-Religious Harmony and Legacy",[]],["Religious Pluralism",[["Gupta rulers patronized Hinduism, Buddhism, and Jainism, fostering harmony.",[]]]],["Legacy",[["Gupta achievements left indelible marks on subsequent dynasties and cultural ethos.",[]],["Example: Cave temples at Ajanta depicting diverse religious themes.",[]]]],["Gupta Coinage and Symbolism",[]],["Coinage Aesthetics",[["Gupta coinage portrayed rulers' images and symbols, reflecting authority and cultural expression.",[]]]],["Symbolic Value",[["Coins symbolized political stability and economic vitality.",[]],["Example: Gupta gold coins, featuring rulers in various poses.",[]]]],["Cultural Continuity and Modern Impact",[]],["Heritage Resonance",[["Gupta-era achievements are touchstones of India's heritage and cultural continuity.",[]]]],["Modern Influence",[["The Gupta legacy inspires contemporary pursuits in arts, sciences, and governance.",[]],["Example: Gupta architectural features evident in later temple styles.",[]]]],["Socio-Economic Progress and Governance",[]],["Socio-Economic Vibrancy",[["Flourishing economy, trade, and agriculture contributed to societal well-being.",[]]]],["Effective Governance",[["Organized administration facilitated cultural flourishing and socio-economic progress.",[]]]],["Conclusion",[["The Gupta Period's multifaceted legacy, spanning literature, art, science, economics, governance, and cultural syncretism, reverberates through time. It",[]],["underlines the rich tapestry of India's past, illuminating the path of progress and inspiration for present-day endeavors.",[]]]]]},{"id":"G2|3","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"1. Delhi Sultanate","p":7,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["The Delhi Sultanate era marked a dynamic blend of architectural styles, painting, music, and cultural influences, shaping a unique Indo-Islamic identity.",[]]]],["Indo-Islamic Architecture Synthesis",[["Architecture: The Sultanate period fused Indian and Islamic architectural elements.",[]],["Features: Arches, domes, minarets, and calligraphy combined with Indian motifs.",[["Example: Qutub Minar, with its Indo-Islamic architectural fusion.",[]]]]]],["Mosque Architecture",[["Architecture: Mosques like Quwwat-ul-Islam Mosque showcased distinctive designs.",[]],["Features: Hypostyle prayer halls, ornate domes, and decorative elements.",[["Example: Jama Masjid in Delhi, reflecting Sultanate mosque architecture.",[]]]]]],["Forts and Citadels",[["Architecture: Forts, citadels fortified urban centers and symbolized authority.",[]],["Features: Bastions, gates, and strategic layouts.",[["Example: Tughlaqabad Fort, an imposing citadel of Sultanate architecture.",[]]]]]],["Tomb Architecture",[["Architecture: Tombs with unique styles, reflecting rulers' personalities.",[]],["Features: Dome structures, calligraphy, and ornate embellishments.",[["Example: Sultan Ghari Tomb, showcasing early tomb architecture.",[]]]]]],["Madrasas and Educational Institutions",[["Architecture: Madrasas for religious and educational purposes.",[]],["Features: Central courtyards, arches, and lecture halls.",[["Example: Madrasa of Alauddin Khalji, highlighting educational aspects.",[]]]]]],["Palace Architecture and Urban Planning",[["Architecture: Palaces integrated Persian and Indian design elements.",[]],["Features: Ornate chambers, courtyards, and intricate embellishments.",[["Example: Feroz Shah Kotla, representing Sultanate palace architecture.",[]]]]]],["Minars and Urban Landmarks",[["Architecture: Minarets like Alai Minar and Qutub Minar acted as urban landmarks.",[]],["Features: Tall structures with balconies, demonstrating architectural innovation.",[["Example: Alai Minar, an ambitious project of Alauddin Khalji.",[]]]]]],["Painting and Music",[]],["Painting",[["Sultanate period witnessed Persian and indigenous painting styles.",[]],["Features: Miniatures depicted court life, religious themes, and royal portraits.",[]]]],["Music",[["Sultanate era embraced various musical forms, fostering cultural diversity.",[]]]],["Conclusion",[["Delhi Sultanate's multidimensional legacy, spanning architecture, painting, music, and cultural syncretism, enriches India's historical narrative. These expressions reflect the era's vibrant cultural milieu, contributing to the diverse tapestry of the nation's heritage.",[]]]]]},{"id":"G2|4","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"2. Mughal Empire","p":8,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["The Mughal Empire's reign witnessed an artistic renaissance, shaping India's cultural landscape through magnificent architecture, intricate sculptures, vibrant paintings, and melodious music.",[]]]],["Architectural Marvels",[["Architecture: Mughal architecture blended Persian, Islamic, and Indian elements.",[]],["Features: Grand domes, delicate minarets, ornate carvings, and bulbous cupolas.",[["Example: Taj Mahal, epitome of Mughal architecture's splendor.",[]]]]]],["Sculptural Flourish",[]],["Sculpture",[["Intricate stone carvings adorned Mughal structures and monuments.",[]],["Features: Depictions of flora, fauna, and mythological themes.",[]],["Example: Stone carvings at Fatehpur Sikri, showcasing Mughal artistic finesse.",[]]]],["Pictorial Narratives",[]],["Painting",[["Mughal paintings were rich in detail, reflecting life, religion, and culture.",[]],["Features: Miniatures portrayed court scenes, historical events, and intricate designs.",[["Example: Akbar's court paintings, depicting diverse subjects with finesse.",[]]]]]],["Melodies of the Empire",[]],["Music",[["Mughal courts fostered a cultural blend of Persian and Indian music.",[]],["Features: Sufi poetry, Qawwali, and classical compositions flourished.",[["Example: Tansen, a legendary musician in Akbar's court.",[]]]]]],["Cultural Synthesis",[]],["Diversity Uniting",[["Mughal rule brought together various artistic styles and cultures.",[]],["Example: The fusion of Persian, Indian, and Central Asian artistry.",[]]]],["Patronage of the Arts",[]],["Royal Support",[["Mughal emperors patronized artists, musicians, and architects.",[]],["Example: Emperor Akbar's cultural encouragement fostered creative brilliance.",[]]]],["Architectural Legacy",[]],["Enduring Influence",[["Mughal architecture's elegance resonates in India's heritage.",[]],["Example: Influence of Mughal architectural features in modern structures.",[]]]],["Historical Continuity",[]],["Timeless Impact",[["Mughal art's legacy endures, influencing contemporary cultural expressions.",[]],["Example: Mughal motifs in modern textile and design.",[]]]],["Conclusion",[["The Mughal Empire's artistic legacy, reflected in awe-inspiring architecture, intricate sculptures, vibrant paintings, and melodious music, continues to captivate hearts and minds. These cultural treasures remind us of the rich artistic heritage that enriches India's identity.",[]]]],["Buddhism: Rise, Philosophy, Expansion, Decline, Architecture &",[]],["Patronage",[["The journey of Buddhism encompasses its inception, profound philosophy, geographical expansion, architectural marvels, and royal patronage, shaping a profound cultural and spiritual legacy.",[]]]],["Rise and Core Philosophy",[]],["Inception",[["Siddhartha Gautama founded Buddhism in 6th century BCE.",[]]]],["Philosophy",[["Four Noble Truths and Eightfold Path offer guidance.",[]],["Example: Buddha's first sermon at Sarnath, preaching these fundamental truths.",[]]]],["Expansion and Spread",[]],["Geographical Reach",[["Spread to Sri Lanka, Southeast Asia, China, and beyond.",[]]]],["Silk Road Influence",[["Buddhism traveled along trade routes, mingling with various cultures.",[]],["Example: Bodhisattva Avalokiteshvara worship in Tibet and East Asia.",[]]]],["Architectural Marvels",[]],["Stupas and Viharas",[["Stupas like Sanchi Stupa enshrined relics.",[]]]],["Chaityas and Viharas",[["Rock-cut chaityas at Ellora display architectural prowess.",[]],["Example: The Great Stupa of Sanchi, an enduring symbol of Buddhist architecture.",[]]]],["Royal Patronage and Monastic Support",[]],["Emperor Ashoka",[["Ashoka's inscriptions and pillars propagated Buddhism.",[]]]],["Sponsorship",[["King Harsha supported Nalanda University.",[]],["Example: Ajanta Caves, sponsored by local rulers, depict Buddhist narratives.",[]]]],["Buddhist Artistic Expressions",[]],["Gandhara School",[["Greco-Indian sculptures at Taxila reveal cross-cultural influences.",[]]]],["Mathura School",[["Mathura sculptures like the Sarnath Buddha portray serene expressions.",[]],["Example: Gandhara Buddha statues, fusing Hellenistic and Indian styles.",[]],["",[]]]],["Philosophy's Depth",[]],["Nirvana and Enlightenment",[["Buddha's attainment at Bodh Gaya exemplifies liberation.",[]]]],["Compassion and Ahimsa",[["Acts of kindness and non-violence resonate in Buddhist teachings.",[]],["Example: Bodh Gaya, where Siddhartha realized enlightenment.",[]]]],["Decline and Revival",[]],["Factors",[["Fragmentation, foreign invasions led to Buddhism's decline in India.",[]]]],["Revival",[["19th-20th century rekindling, seen in Dalai Lama's global influence.",[]],["Example: Buddhist revival through the Theosophical Society and modern institutions.",[]]]],["Cultural and Philosophical Impact",[]],["Cultural Integration",[["Zen Buddhism's Koan practice influenced modern psychology.",[]]]],["Philosophical Influence",[["Buddhist values influenced Gandhi's non-violence philosophy.",[]],["Example: Incorporation of Buddhist ideals in modern mindfulness practices.",[]]]],["Conclusion",[["Buddhism's voyage through philosophy, architecture, art, and patronage resonates through time. Its teachings, reflected in diverse cultures, illuminate the path to inner awakening and global harmony.",[]]]]]},{"id":"G2|5","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"4. Jainism: Rise, Philosophy, Spread, Architecture & Patronage","p":11,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["The journey of Jainism spans its genesis, profound philosophy, widespread dissemination, architectural splendors, royal support, and lasting cultural impact, enriched by various examples.",[]]]],["Rise and Core Philosophy",[]],["Inception",[["Founded by Mahavira in 6th century BCE.",[]]]],["Philosophy",[["Central principles include non-violence (ahimsa) and non-possession (aparigraha).",[]],["Example: Jain Tirthankara images, embodying spiritual purity.",[]]]],["Spread and Influence",[]],["Geographical Reach",[["Jainism's reach extended to India and beyond.",[]]]],["Cultural Influence",[["Jain merchants propagated teachings through trade routes.",[]],["Example: Shravanabelagola's Gommateshwara Statue, a Jain pilgrimage site.",[]]]],["Architectural Marvels",[]],["Temples and Monasteries",[["Elaborate Dilwara Temples in Mount Abu showcase intricate architecture.",[]]]],["Tirthankara Images",[["Highly detailed sculptures, emphasizing spiritual serenity.",[]],["Example: Ranakpur Temple, a marvel of Jain architecture.",[]]]],["Royal Patronage and Monastic Support",[]],["Patronage",[["Jainism received support from rulers like Chandragupta Maurya.",[]]]],["Monastic Order",[["Monks and nuns propagated teachings, supported by the community.",[]],["Example: Gomateshwara Statue, patronized by different dynasties.",[]]]],["Philosophical Depth",[]],["Ahimsa and Karma",[["Jain philosophy emphasizes non-violence and karma theory.",[]]]],["Spiritual Asceticism",[["Ascetic practices for self-purification and liberation.",[]],["Example: Jain monks practicing Santhara (voluntary fast unto death).",[]]]],["Cultural Influence and Continuity",[]],["Literary Contributions",[["Jain texts enriched literature and philosophy.",[]]]],["Cultural Integration",[["Jain traditions influenced art, literature, and ethical values.",[]],["Example: Jain manuscripts containing illustrations and teachings.",[]]]],["Decline and Revival",[]],["Factors",[["Internal divisions and historical shifts impacted Jainism's prominence.",[]]]],["Revival",[["19th-20th century efforts rekindled Jain teachings and practices.",[]],["Example: Efforts by Jain reformers like Acharya Rajendrasuri.",[]]]],["Enduring Impact",[]],["Philosophical Influence",[["Jain non-violence echoed in Mahatma Gandhi's teachings.",[]]]],["Modern Relevance",[["Jain principles inspire environmental and ethical movements.",[]],["Example: Jain Agamas providing insights into ethical and sustainable living.",[]]]],["Conclusion",[["Jainism's voyage through philosophy, architecture, patronage, and influence resonates across time. Its timeless values of non-violence, self-discipline, and spiritual enlightenment continue to guide ethical and sustainable practices for a harmonious world.",[]]]]]},{"id":"G2|6","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"5. Bhakti and Sufi Movement: Spiritual Renaissance & Social Impact","p":13,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["The Bhakti and Sufi movements emerged as transformative socio-religious forces, bridging divides and nurturing spiritual devotion, leaving profound impacts on Indian society.",[]]]],["Bhakti Movement",[]],["Devotion over Rituals",[["Emphasized personal connection with the divine rather than rituals.",[]]]],["Sant Tradition",[["Saints like Kabir, Tulsidas, and Meera Bai inspired devotion in regional languages.",[]],["Example: Saint Tukaram of Maharashtra, whose Abhanga compositions spread bhakti ideals.",[]]]],["Sufi Movement",[]],["Mystical Islam",[["Sufis sought closeness to God through mysticism and inward spirituality.",[]]]],["Sufi Orders",[["Chishti, Suhrawardi, and Qadiri orders spread teachings and values.",[]],["Example: Hazrat Nizamuddin Auliya, whose teachings attracted diverse devotees.",[]]]],["Social Impact - Bhakti",[]],["Caste Eradication",[["Bhakti challenged caste hierarchy, providing solace to the oppressed.",[]]]],["Social Inclusivity",[["Bhakti saints welcomed people from all castes and backgrounds.",[]],["Example: Ravidas, a Dalit saint, advocated equality and inclusivity.",[]]]],["Social Impact - Sufi",[]],["Religious Harmony",[["Sufi saints emphasized universal love, transcending religious barriers.",[]]]],["Message of Unity",[["Sufi poetry and music conveyed messages of oneness.",[]],["Example: Bulleh Shah, a Sufi poet who promoted religious tolerance.",[]]]],["Influence on Literature and Arts",[]],["Bhakti Poetry",[["Inspiring compositions in regional languages enriched Indian literature.",[]]]],["Sufi Poetry and Music",[["Ghazals and Qawwalis conveyed deep spiritual truths.",[]],["Example: Kabir's Dohas and Sufi Qawwalis promoting divine connection.",[]]]],["Gender and Empowerment",[]],["Bhakti",[["Female saints like Meera Bai challenged traditional gender roles.",[]]]],["Sufi",[["Female Sufi saints like Rabia Basri broke gender norms, focusing on spirituality.",[]],["Example: Lal Ded, a Kashmiri mystic who defied societal norms.",[]]]],["Spread and Regional Variations",[]],["Bhakti",[["Flourished in different regions, taking unique forms.",[]]]],["Sufi",[["Spread through trade routes, adapted to regional cultures.",[]],["Example: Bhakti in Tamil Nadu and Sufism in Punjab, reflecting local flavors.",[]]]],["Legacy and Modern Relevance",[]],["Harmonizing Influence",[["Both movements fostered communal harmony and peaceful coexistence.",[]]]],["Modern Inclusion",[["Bhakti and Sufi ideals inspire India's cultural diversity and unity.",[]],["Example: Continuation of Bhakti and Sufi music festivals and gatherings.",[]]]],["Conclusion",[["The Bhakti and Sufi movements transcended religious boundaries, fostering unity, inclusivity, and spiritual awakening. Their messages of love, devotion, and oneness remain an enduring source of inspiration, shaping India's cultural and social fabric.",[]]]]]},{"id":"G2|7","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"6. Travellers and their writings","p":15,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Explorers and travellers, through their captivating writings, documented India's diverse landscapes, cultures, and histories, illuminating the nation's past from various perspectives.",[]]]],["Megasthenes - Indika",[]],["Origin",[["Greek ambassador to the Mauryan court in the 4th century BCE.",[]]]],["Writings",[["\"Indika\" provided insights into Mauryan administration, society, and geography.",[]],["Example: Described Chandragupta Maurya's palace in Pataliputra.",[]]]],["Fa-Hien - Record of Buddhistic Kingdoms",[]],["Origin",[["Chinese Buddhist monk in the 4th-5th century CE.",[]]]],["Writings",[["Chronicled Buddhist sites, monasteries, and practices in India.",[]],["Example: Detailed his visit to the Bodh Gaya pilgrimage site.",[]]]],["Al-Biruni - Kitab al-Hind",[]],["Origin",[["Persian scholar and polymath in the 11th century CE.",[]]]],["Writings",[["\"Kitab al-Hind\" encompassed India's culture, religions, and scientific achievements.",[]],["Example: Explored Hindu philosophy and astronomy in his writings.",[]]]],["Ibn Battuta - Travels in Asia and Africa",[]],["Origin",[["Moroccan explorer in the 14th century CE.",[]]]],["Writings",[["Described his journey across India, including Delhi, Calicut, and the Maldives.",[]],["Example: Documented his interaction with the Delhi Sultan Muhammad bin Tughlaq.",[]]]],["Jean-Baptiste Tavernier - Travels in India",[]],["Origin",[["French gem merchant in the 17th century CE.",[]]]],["Writings",[["Detailed gem trade, politics, and society during Mughal rule.",[]],["Example: His account of his visit to the Mughal court and his interactions with Emperor Shah Jahan.",[]]]],["Thomas Roe - Embassy to the Mughal Court",[]],["Origin",[["English ambassador in the early 17th century CE.",[]]]],["Writings",[["Presented insights into Mughal court, commerce, and diplomacy.",[]],["Example: His observations on Emperor Jahangir's court and diplomatic negotiations.",[]]]],["Marco Polo - The Travels",[]],["Origin",[["Venetian merchant in the 13th century CE.",[]]]],["Writings",[["His accounts included observations on Indian trade and culture.",[]],["Example: His description of the port city of Quilon (modern-day Kollam) in Kerala.",[]]]],["William Dalrymple - City of Djinns: A Year in Delhi",[]],["Origin",[["Scottish historian and writer in the modern era.",[]]]],["Writings",[["Explored historical and contemporary Delhi, intertwining narratives.",[]],["Example: His exploration of the Red Fort and its historical significance.",[]]]],["Pico Iyer - The Open Road: The Global Journey of the Fourteenth Dalai Lama",[]],["Origin",[["British-born American essayist and travel writer.",[]]]],["Writings",[["Examined the life and global impact of the Dalai Lama.",[]],["Example: His reflections on the Dalai Lama's teachings and impact on the world.",[]]]],["Paul Theroux - The Great Railway Bazaar",[]],["Origin",[["American travel writer.",[]]]],["Writings",[["Captured his journey through India by rail, reflecting on its landscapes and people.",[]],["Example: His observations on the diverse cultures and scenery along the Indian railway.",[]]]],["Conclusion",[["Travellers' writings serve as windows to India's past, presenting vivid accounts of its societies, cultures, and histories. These chronicles provide valuable perspectives for understanding the diverse tapestry of India's rich and dynamic heritage.",[]]]]]},{"id":"G2|8","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"7. Greek Invasion and Their Impact on India","p":16,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["The Greek invasion, led by Alexander the Great, left an indelible mark on India's history, influencing its culture, art, and interactions with the wider world.",[]]]],["Alexander's Conquests",[]],["Invasion",[["Alexander invaded India in 326 BCE, reaching the banks of the Indus River.",[]]]],["Battle of Hydaspes",[["His encounter with King Porus marked a significant engagement.",[]]]],["Cultural Exchange",[]],["Art and Architecture",[["Greek styles merged with Indian aesthetics, seen in Gandhara art.",[]]]],["Sculptures",[["Sculptures of Greek deities and Indian motifs blended in harmony.",[]],["Example: Gandhara Buddha statues with Greek-inspired drapery.",[]]]],["Spread of Hellenistic Influence",[]],["Greco-Bactrian Kingdom",[["Greek successors established a Hellenistic realm in northwestern India.",[]]]],["Cultural Synthesis",[["Interaction between Greeks and local cultures led to mutual influence.",[]],["Example: Coins of Greco-Bactrian rulers with Greek and Indian symbols.",[]]]],["Indo-Greek Kingdoms",[]],["Bactrian Rule",[["Greek rulers established several Indo-Greek kingdoms.",[]]]],["Cultural Fusion",[["Greek rulers adopted Indian customs, depicted on their coins.",[]],["Example: Coins with Greek inscriptions and Indian deities like Athena and Vishnu.",[]]]],["Literary and Historical Accounts",[]],["Megasthenes",[["Greek ambassador's accounts offered insights into Indian society.",[]]]],["Indika",[["Megasthenes' work provided valuable information on Mauryan India.",[]]]],["Trade and Commerce",[]],["Trade Routes",[["Greek presence fostered trade between India and the West.",[]]]],["Sea Routes",[["Maritime routes connected Greek colonies with Indian ports.",[]],["Example: Movement of spices, textiles, and gems.",[]]]],["Scientific and Mathematical Impact",[]],["Mathematics",[["Greek influence enhanced Indian mathematical knowledge.",[]]]],["Astronomy",[["Greek astronomical concepts influenced Indian studies.",[]],["Example: Greek influence in Aryabhata's work on trigonometry.",[]]]],["Intellectual Exchange",[]],["Philosophical Discourse",[["Greek philosophy mingled with Indian thought.",[]]]],["Confluence of Ideas",[["Interaction led to philosophical debates and discussions.",[]],["Example: Buddhist schools incorporating Greek philosophical ideas.",[]]]],["Legacy and Cross-Cultural Ties",[]],["Syncretism",[["Greek impact persisted in Gandhara art, Kushan culture, and beyond.",[]]]],["Interactions with East and West",[["Greek influence remained in India's cultural memory.",[]],["Example: Influence of Greek terminology in Indian art and astronomy.",[]]]],["Conclusion",[["The Greek invasion was a pivotal chapter in India's history, fostering a cross-cultural exchange that left an enduring imprint on its art, philosophy, and cultural interactions. The confluence of Greek and Indian ideas exemplifies the richness of India's historical tapestry.",[]]]]]},{"id":"G2|9","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"8. Indian Religion and Philosophy","p":18,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Indian Religion and Philosophy: Diversity and Spiritual Depth",[["India's profound religious and philosophical landscape encompasses a multitude of belief systems, each offering unique perspectives on existence, morality, and the divine.",[]]]],["Hinduism",[]],["Diverse Beliefs",[["Encompasses polytheism, monotheism, and pantheism.",[]]]],["Vedas and Upanishads",[["Central texts discussing rituals and spiritual knowledge.",[]],["Example: Bhagavad Gita, a philosophical dialogue within the Mahabharata.",[]]]],["Buddhism",[]],["Four Noble Truths",[["Foundation of Buddha's teachings on suffering and liberation.",[]]]],["Ahimsa and Compassion",[["Ethical principles central to Buddhist practice.",[]],["Example: Dhammapada, a collection of Buddha's sayings.",[]]]],["Jainism",[]],["Ahimsa and Aparigraha",[["Non-violence and non-possession as core virtues.",[]]]],["Tirthankaras",[["Spiritual leaders who guide followers toward liberation.",[]],["Example: Tattvartha Sutra, a Jain text on fundamental truths.",[]]]],["Sikhism",[]],["Guru Nanak Dev",[["Founder, emphasized monotheism and equality.",[]]]],["Guru Granth Sahib",[["Holy scripture, considered a living Guru.",[]],["Example: Japji Sahib, a composition by Guru Nanak.",[]]]],["Islam",[]],["Five Pillars",[["Shahada, Salat, Zakat, Sawm, Hajj constitute core practices.",[]]]],["Sufism",[["Mystical dimension emphasizing spiritual closeness to God.",[]],["Example: Quran, the holy book guiding Muslims.",[]]]],["Christianity",[]],["Teachings of Jesus",[["Emphasizes love, forgiveness, and salvation.",[]]]],["Bible",[["Divided into Old and New Testaments, central to Christian beliefs.",[]],["Example: Sermon on the Mount, reflecting Jesus' ethical teachings.",[]]]],["Zoroastrianism",[]],["Dualistic Belief",[["Good versus evil in cosmic struggle.",[]]]],["Zoroastrian Scriptures",[["Avesta, containing hymns and teachings.",[]],["Example: Yasna, a core ritual from the Avesta.",[]]]],["Syncretic Traditions",[]],["Sufi-Bhakti Movement",[["Fusion of Islamic mysticism and devotional Hinduism.",[]]]],["Kabir and Sufi Saints",[["Bridged religious divides through their teachings.",[]],["Example: Bhakti saint Namdev and his interaction with Sufis.",[]]]],["Philosophical Schools",[["Nyaya, Vaisheshika, Samkhya, Yoga, Mimamsa, Vedanta represent diverse schools of Indian philosophy. Each school engaged in profound inquiries, addressing metaphysical, epistemological, and ethical questions.",[]]]],["Nyaya",[["Analyzed logic and reasoning, providing a systematic framework for debate and knowledge.",[]]]],["Vaisheshika",[["Explored the nature of reality through atomism and categorization of substances.",[]]]],["Samkhya",[["Investigated the dualistic nature of reality, distinguishing between purusha (consciousness) and prakriti (matter).",[]]]],["Yoga",[["Explored spiritual practices and self-discipline as means to attain union with the divine.",[]]]],["Mimamsa",[["Focused on rituals and interpretation of sacred texts, shaping Vedic traditions.",[]]]],["Vedanta",[["Encompassed diverse interpretations of the Upanishads, delving into the nature of reality and the self.",[]],["Example: Advaita Vedanta's concept of non-dual reality.",[]]]],["Conclusion",[["India's religious and philosophical traditions constitute a vast tapestry of thought, encompassing diverse beliefs and practices that explore the nature of existence, the universe, and human life. These teachings continue to inspire seekers, shaping both individual lives and India's cultural identity.",[]]]]]},{"id":"G2|10","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"9. Temple Architecture","p":20,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Indian temple architecture embodies intricate craftsmanship, spiritual symbolism, and cultural aesthetics, representing devotion, philosophy, and artistic brilliance.",[]]]],["Nagara Style",[]],["Region",[["Predominant in northern India.",[]],["Features: Curvilinear spires (shikharas), multiple entrance porches (mandapas), intricate sculptures.",[["Example: Khajuraho Temples showcase Nagara architecture's ornate details.",[]]]]]],["Dravidian Style",[]],["Region",[["Prominent in southern India.",[]],["Features: Towering pyramidal vimanas, hallways with massive pillars (mandapas), richly decorated gopurams.",[["Example: Brihadeeswarar Temple in Thanjavur, exemplifying Dravidian grandeur.",[]]]]]],["Vesara Style",[]],["Blend",[["Merged Nagara and Dravidian features.",[]],["Features: Square sanctums, multiple shrines within a single complex, ornate decorations.",[["Example: Hoysaleswara Temple in Halebidu, a remarkable Vesara-style temple.",[]]]]]],["Kalinga Style",[]],["Region",[["Prominent in Odisha.",[]],["Features: Circular sanctums (vimanas), pyramid-shaped roofs, intricate carvings depicting local deities.",[["Example: Jagannath Temple in Puri, showcasing Kalinga architectural nuances.",[]]]]]],["Chalukyan Style",[]],["Region",[["Flourished in Deccan region.",[]],["Features: Elaborate carvings, intricate sculptures, towered entrance gateways.",[["Example: Virupaksha Temple in Pattadakal, an iconic Chalukyan monument.",[]]]]]],["Maru-Gurjara Style",[]],["Region",[["Prominent in western India.",[]],["Features: Elaborate ornamentation, intricate stone carvings, stepped wells (vav).",[["Example: Rani Ki Vav in Patan, a UNESCO World Heritage Site.",[]]]]]],["Temple Elements",[]],["Garbhagriha",[["Innermost sanctum housing the main deity.",[]]]],["Mandapa",[["Hall for devotees and rituals.",[]]]],["Shikhar/Vimana",[["Tower above sanctum, symbolizing connection with divine realms.",[]]]],["Gopuram",[["Elaborate gateway at entrance, often adorned with sculptures.",[]]]],["Spiritual Symbolism",[]],["Mandala",[["Design based on cosmic harmony and geometry.",[]]]],["Iconography",[["Sculptures depict deities, stories from scriptures, and celestial beings.",[]],["Example: Kailash Temple in Ellora, a monolithic marvel depicting Mount Kailash.",[]]]],["Influence on Vernacular Architecture",[]],["Temple Complexes",[["Inspired the layout and design of palaces and forts.",[]],["Example: Chittorgarh Fort in Rajasthan, incorporating temple-like elements.",[]]]],["Modern Revival and Preservation",[["- Restoration Efforts: Organizations and government initiatives preserving ancient temples. - Example: Konark Sun Temple restoration project by Archaeological Survey of India.",[]]]],["Conclusion",[["Indian temple architecture encapsulates devotion, cultural heritage, and architectural prowess. The various styles reflect regional nuances while celebrating the profound connection between the earthly and the divine, inspiring awe and reverence across time.",[]]]]]},{"id":"G2|11","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"10. Rock Cut Architecture","p":22,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Rock-cut architecture in India transcends mere construction, providing remarkable windows into the past by offering insights into daily life, societal dynamics, economic activities, and religious fervor of ancient civilizations.",[]]]],["Ajanta Caves",[]],["Location",[["Maharashtra.",[]]]],["Society & Religion",[["Elaborate murals depict royal life, trade scenes, and Buddha's life.",[]]]],["Economy",[["Carvings of trade caravans portray bustling commerce.",[]]]],["Ellora Caves",[]],["Location",[["Maharashtra.",[]]]],["Diverse Beliefs",[["Coexistence of Hindu, Buddhist, and Jain caves reflects inclusivity.",[]]]],["Society & Economy",[["Carvings depict socio-economic strata and trade routes.",[]]]],["Elephanta Caves",[]],["Location",[["Mumbai, Maharashtra.",[]]]],["Religious Allegory",[["Sculptures narrate Hindu myths and cosmic allegories.",[]]]],["Society & Lifestyle",[["Carvings offer glimpses into daily existence and artistic pursuits.",[]]]],["Udayagiri and Khandagiri Caves",[]],["Location",[["Odisha.",[]]]],["Jain Teachings",[["Inscriptions and sculptures propagate Jain principles.",[]]]],["Societal Roles",[["Depictions reveal rulers, artisans, monks, and social norms.",[]]]],["Badami Caves",[]],["Location",[["Karnataka.",[]]]],["Episodic Narratives",[["Carvings tell tales from epics and display pantheon.",[]]]],["Economic Reflections",[["Sculptures hint at trade networks and agrarian life.",[]]]],["Karla and Bhaja Caves",[]],["Location",[["Maharashtra.",[]]]],["Monastic Insight",[["Chaityas and viharas mirror Buddhist monastic life.",[]]]],["Society & Beliefs",[["Carvings provide a window into social mores and Buddhist doctrines.",[]]]],["Masroor Rock Cut Temples",[]],["Location",[["Himachal Pradesh.",[]]]],["Religious Diversity",[["Temples signify diverse Hindu-Shaiva beliefs.",[]]]],["Society & Deities",[["Carvings showcase deities and celestial beings.",[]]]],["Spiritual and Cultural Manifestation",[]],["Society & Devotion",[["Sculptures portray devotion and rituals.",[]]]],["Cultural Heritage",[["Reflects the aesthetic preferences of the times.",[]],["Example: Ellora's Kailash Temple, an architectural marvel dedicated to Lord Shiva.",[]]]],["Fusion with Nature's Canvas",[]],["Environmental Harmony",[["Architecture blends seamlessly with nature.",[]]]],["Life & Beliefs",[["Natural elements merge with divine motifs.",[]],["Example: Ajanta's Cave 16, harmoniously carved within the rock face.",[]]]],["Testimonies to Civilizational Brilliance",[["-",[]]]],["Architectural Chronicle",[["Carvings document societal structures, norms, and urban life. –",[]]]],["Economic Vignettes",[["Depictions of markets and artisans showcase economic dynamism. –",[]],["Example: Badami's Sculpture of Dancing Shiva, an embodiment of cosmic",[]]]],["energy.",[]],["Conclusion",[["Rock-cut architecture not only honors the craftsmanship of the past but also offers a panoramic glimpse into the multitudes of life, society, and beliefs that",[]],["thrived within the carved walls. These timeless marvels beckon us to traverse history, connecting our present to a rich and textured heritage.",[]]]]]},{"id":"G2|12","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"11. Literary Sources","p":24,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["India's rich literary heritage comprises a tapestry of texts that provide profound insights into its history, culture, society, and philosophy, bridging the gap between bygone eras and the present.",[]]]],["Vedas",[]],["Rigveda",[["Oldest known Vedic text, hymns devoted to deities and cosmic order.",[]],["Example: \"Hymn of Creation\" (Nasadiya Sukta) contemplates the origins of the universe.",[]]]],["Upanishads",[]],["Philosophical Dialogues",[["Explore the nature of reality, self, and ultimate truth.",[]],["Example: \"Tat Tvam Asi\" asserts the identity of the individual soul with the universal consciousness.",[]]]],["Mahabharata",[]],["Epic Narrative",[["Chronicles the Kurukshetra war and teachings of Lord Krishna.",[]],["Example: Bhagavad Gita, a dialogue on duty and righteousness amidst moral dilemmas.",[]]]],["Ramayana",[]],["Epic Saga",[["Narrates the journey of Prince Rama, his virtues, and battles.",[]],["Example: Hanuman's devotion and selfless service symbolize loyalty and courage.",[]]]],["Arthashastra",[]],["Political Treatise",[["Kautilya's text on governance, economics, and statecraft.",[]],["Example: Provides insights into administration, espionage, and diplomacy.",[]]]],["Manusmriti",[]],["Legal Code",[["Offers social norms, laws, and ethical guidelines.",[]],["Example: Outlines varna (caste) system and duties of different social classes.",[]]]],["Panchatantra",[]],["Fables",[["Collection of moral stories with animal characters.",[]],["Example: The story of \"The Lion and the Hare\" imparts strategic wisdom.",[]]]],["Bhakti Poetry",[]],["Devotional Verses",[["Expressed deep love for deities and advocated a personal connection.",[]],["Example: Kabir's Dohas, emphasizing devotion beyond rituals.",[]]]],["Sufi Literature",[]],["Mystical Verses",[["Explored divine love, unity, and spiritual experiences.",[]],["Example: Rumi's Mathnawi, delving into the soul's journey towards God.",[]]]],["Jataka Tales",[["- Buddhist Narratives: Depict previous lives of the Buddha, conveying moral lessons.",[]],["- Example: \"The Monkey King's Sacrifice\" exemplifies selfless deeds.",[]]]],["Conclusion",[["India's literary treasures offer timeless wisdom, ethical principles, and glimpses into cultural evolution. These texts remain guiding lights, illuminating the past and guiding contemporary explorations of identity, philosophy, and human experience.",[]]]]]},{"id":"G2|13","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"12. Coins","p":25,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Coins, fashioned from diverse materials, transcend time as tangible links to history, economics, culture, and governance, each type revealing its era's tales through its distinctive marks.",[]]]],["Punch-Marked Coins",[]],["Period",[["6th century BCE onwards.",[]]]],["Material",[["Silver and copper.",[]],["Features: Punched symbols and marks.",[]],["Example: Magadha Janapada's Karshapana coins.",[]]]],["Indo-Greek Coins",[]],["Period",[["2nd century BCE.",[]]]],["Material changing metal values and economic trends.",[]]]],["Conclusion",[["Coins, adorned with symbols and imprinted in metal, chronicle the diverse facets of human history. These minted marvels transcend their material forms, preserving legacies, and inviting us to traverse time, interpreting the past through their silent narratives.",[]]]]]},{"id":"G2|14","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"13. Paintings","p":27,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Indian paintings, spanning from the ancient Indus Valley to contemporary times, offer an artistic journey reflecting the nation's history, cultural diversity, and evolving expressions.",[]]]],["Indus Valley Paintings",[]],["Period",[["3300-1300 BCE.",[]]]],["Themes",[["Animals, symbols, daily life.",[]]]],["Medium",[["Cave walls and pottery.",[]],["Example: Harappan seals depicting animals and motifs.",[]]]],["Ajanta Murals",[]],["Period",[["2nd-7th centuries CE.",[]]]],["Themes",[["Buddhist narratives, royalty, daily life.",[]]]],["Medium",[["Frescoes.",[]],["Example: Buddha's \"Parinirvana\" in Cave 26.",[]]]],["Mughal Miniatures",[]],["Period",[["16th-18th centuries CE.",[]]]],["Themes",[["Portraits, court life, Persian influence.",[]]]],["Medium",[["Watercolors on paper.",[]],["Example: Mughal Emperor Akbar's \"Akbar Nama.\"",[]]]],["Rajput Paintings",[]],["Period",[["17th-19th centuries CE.",[]]]],["Themes",[["Mythology, romance, nature.",[]]]],["Medium",[["Watercolors on paper.",[]],["Example: Radha and Krishna in Kangra style.",[]]]],["Bengal School Paintings",[]],["Period",[["19th-20th centuries CE.",[]]]],["Themes",[["Nationalism, Indian subjects.",[]]]],["Medium",[["Oil and watercolors.",[]],["Example: Nandalal Bose's \"Bapu.\"",[]]]],["Tanjore Paintings",[]],["Period",[["17th century onwards.",[]]]],["Themes",[["Hindu deities, royal courts.",[]]]],["Medium",[["Gesso on wood with gold leaf.",[]],["Example: Devi Durga adorned with gold.",[]]]],["Modern Indian Art",[]],["Period",[["20th century onwards.",[]]]],["Themes",[["Abstract, socio-political, global influences.",[]]]],["Medium",[["Various including oil, acrylic, mixed media.",[]],["Example: Raja Ravi Varma's \"Hamsa Damayanti.\"",[]]]],["Folk Paintings",[]],["Period",[["Varied across regions.",[]]]],["Themes",[["Regional folklore, rituals, nature.",[]]]],["Medium",[["Natural pigments, dyes.",[]],["Example: Patachitra of Odisha narrating stories.",[]]]],["Contemporary Art",[]],["Period",[["20th century onwards.",[]]]],["Themes",[["Globalization, digital media, socio-political.",[]]]],["Medium",[["Mixed media, installations, digital.",[]],["Example: Bharti Kher's \"The Skin Speaks a Language Not its Own.\"",[]]]],["Diversity and Cultural Continuum",[["- Narrative Archives: Artworks capture historical and mythological tales. –",[]]]],["Cultural Palette",[["Paintings mirror regional cultures and traditions. –",[]]]],["Artistic Evolution",[["Styles evolve, showcasing societal shifts.",[]]]],["Conclusion",[["Indian paintings, a kaleidoscope of creativity, transcend epochs and boundaries. From the earliest echoes in Indus Valley to the contemporary canvas, they unite the threads of India's diverse heritage, inviting us to witness history through the eyes of its artists.",[]]]]]},{"id":"G2|15","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"14. Inscription","p":29,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Inscriptions, etched in stone, metal, and other materials, serve as invaluable historical testimonies, unveiling the tales of rulers, societies, languages, and cultures that have shaped India's narrative across the ages.",[]]]],["Ashokan Inscriptions",[]],["Period",[["3rd century BCE.",[]]]],["Medium",[["Edicts on pillars, rocks.",[]]]],["Languages",[["Prakrit, Greek, Aramaic.",[]],["Example: Kalinga Edicts reflect Ashoka's conversion to Buddhism.",[]]]],["Gupta Inscriptions",[]],["Period",[["4th-6th centuries CE.",[]]]],["Medium and cultural reflections. They are vital in piecing together the mosaic of India's past, narrating stories etched not just in material, but also in the tapestry of time.",[]]]]]},{"id":"G2|16","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"15. Literary Sources (Wide coverage)","p":31,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Indian literary sources, from ancient scrolls to 20th-century manuscripts, are the time-traveling vessels that unfurl the captivating saga of India's history, offering insights into its culture, society, and evolution.",[]]]],["Vedas",[]],["Period",[["1500-500 BCE.",[]]]],["Medium",[["Sanskrit hymns.",[]],["Example: Rigveda's hymns embody early beliefs and rituals.",[]]]],["Buddhist Jataka Tales",[]],["Period",[["4th century BCE onwards.",[]]]],["Medium",[["Pali narratives.",[]],["Example: Vessantara Jataka reveals Buddhist virtues.",[]]]],["Mahabharata & Ramayana",[]],["Period",[["400 BCE - 400 CE.",[]]]],["Medium",[["Epic poetry.",[]],["Example: Bhagavad Gita in Mahabharata imparts moral philosophy.",[]]]],["Ashoka's Edicts",[]],["Period",[["3rd century BCE.",[]]]],["Medium",[["Pillar inscriptions.",[]],["Example: Minor Rock Edict reveals Ashoka's ethical principles.",[]]]],["Periplus of the Erythraean Sea",[]],["Period",[["1st century CE.",[]]]],["Medium",[["Greco-Roman travelogue.",[]],["Example: Describes trade routes and India's maritime influence.",[]]]],["Rajatarangini by Kalhana",[]],["Period",[["12th century CE.",[]]]],["Medium",[["Sanskrit chronicle.",[]],["Example: Chronicles Kashmir's history through dynasties.",[]]]],["Ain-i-Akbari",[]],["Period",[["16th century CE.",[]]]],["Medium",[["Persian administrative record.",[]],["Example: Provides insights into Akbar's rule and society.",[]]]],["Baburnama",[]],["Period",[["16th century CE.",[]]]],["Medium",[["Autobiographical account.",[]],["Example: Babur's memoir offers cultural observations.",[]]]],["Travels of Ibn Battuta",[]],["Period",[["1 re unites past and present.",[]]]],["Conclusion",[["Indian literary sources, spanning millennia, illuminate the historical fabric. These texts, narratives, and reflections collectively chronicle India's evolution, embodying the wisdom, aspirations, and stories that continue to resonate through time.",[]]]]]},{"id":"G2|17","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"16. Archaeological Sources","p":34,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["Archaeological sources, meticulously uncovered and preserved, act as time machines, transporting us to ancient India. From the grandeur of empires to the daily lives of ordinary people, these artifacts and structures offer a tangible connection to India's rich historical tapestry.",[]]]],["Indus Valley Civilization Sites",[]],["Period",[["Around 3300-1400 BCE.",[]]]],["Discoveries",[["Mohenjo-daro, Harappa, Kalibangan.",[]]]],["Artifacts",[["Seals, pottery, streets.",[]]]],["Insights",[["Urban planning, trade routes.",[]]]],["Megalithic Burials",[]],["Period",[["3000 BCE - 300 CE.",[]]]],["Sites",[["Burzahom, Brahmagiri, Maski.",[]]]],["Artifacts",[["Stone circles, pottery, tools.",[]]]],["Insights",[["Funeral practices, social structure.",[]]]],["Mauryan Pillars",[]],["Period",[["3rd century BCE.",[]],["Examples: Sarnath, Sanchi.",[]]]],["Artifacts",[["Pillars with edicts, animal motifs.",[]]]],["Insights",[["Ashoka's principles, state administration.",[]]]],["Buddhist Stupas",[]],["Period",[["3rd century BCE - 12th century CE.",[]]]],["Sites",[["Sanchi, Amaravati, Ratnagiri.",[]]]],["Artifacts",[["Stupa structures, sculptures, relics.",[]]]],["Insights",[["Buddhist art, religious practices.",[]]]],["Gupta Temples",[]],["Period",[["4th-6th centuries CE.",[]],["Examples: Dashavatara Temple, Deogarh.",[]]]],["Artifacts",[["Intricate sculptures, temple architecture.",[]]]],["Insights",[["Cultural flourishing, artistic finesse.",[]]]],["Chola Bronzes",[]],["Period",[["9th-13th centuries - 12th century CE)",[]],["Region",[["Kerala.",[]]]],["Trade Hub",[["Thriving commercial center for spices and textiles.",[]]]],["Silk and Spice Route",[["Integral to global trade networks.",[]]]],["Cultural Legacy",[["Contribution to Tamil Sangam literature.",[]],["Example: Muziris Port, Kodungallur.",[]]]],["Pandyas (3rd century BCE - 17th century CE)",[]],["Region",[["Tamil Nadu.",[]]]],["Pearl Fisheries",[["Rich marine resources, including pearls.",[]]]],["Sangam Literature",[["Cultural prominence, Tamil literary heritage.",[]]]],["Trade Links",[["Connected to Rome and Southeast Asia.",[]],["Example: Meenakshi Temple, Madurai.",[]]]],["Vijayanagara Empire (14th-16th century CE)",[]],["Region",[["Karnataka, Andhra Pradesh.",[]]]],["Architectural Marvels",[["Magnificent temples adorned with intricate sculptures.",[]]]],["Militant Might",[["Military prowess that withstood invasions.",[]]]],["Cultural Synthesis",[["Fusion of Dravidian and Indo-Islamic styles.",[]],["Example: Vittala Temple, Hampi.",[]]]],["Pallavas (3rd-9th century CE)",[]],["Region",[["Tamil Nadu.",[]]]],["Rock-Cut Wonders",[["Remarkable sculptures and cave temples.",[]]]],["Artistic Legacy",[["Influence on architecture, sculpture, and dance.",[]]]],["Cave Temples",[["Mahabalipuram's monolithic architectural marvels.",[]],["Example: Shore Temple, Mamallapuram.",[]]]],["Rashtrakutas (8th-10th century CE)",[]],["Region",[["Deccan.",[]]]],["Ellora Caves",[["Astonishing rock-cut monuments showcasing rich artistry.",[]]]],["Dynastic Power",[["Dominance over Deccan and parts of South India.",[]]]],["Cultural Patronage",[["Encouraged literature, art, and science.",[]],["Example: Kailasa Temple, Ellora.",[]]]],["Hoysalas (10th-14th century CE)",[]],["Region",[["Karnataka.",[]]]],["Sculptural Elegance",[["Exquisite sculptures embellishing temples.",[]]]],["Unique Architecture",[["Intricate lathe-turned pillars and sculptures.",[]]]],["Artistic Fusion",[["Integration of sculpture into architectural design.",[]],["Example: Belur Chennakesava Temple, Halebid Hoysaleswara Temple.",[]]]],["Kakatiyas (12th-14th century CE)",[]],["Region",[["Telangana.",[]]]],["Impenetrable Fort",[["Formidable Warangal Fort reflecting defensive might.",[]]]],["Cultural Patronage",[["Support for literature, art, and architecture.",[]]]],["Ganapatideva's Reign",[["Renowned king fostering cultural advancement.",[]],["Example: Ramappa Temple, Warangal Fort.",[]]]],["Threads of Endurance",[]],["Cultural Diversity",[["Richness brought by various kingdoms.",[]]]],["Maritime Dominance",[["Prosperity through ancient trade routes.",[]]]],["Spiritual Magnificence",[["Temples as spiritual and architectural landmarks.",[]]]],["Intellectual Legacy",[["Advancements in literature, arts, and sciences.",[]]]],["Conclusion",[["The kingdoms of South India, with their myriad features, created a vibrant tapestry of history and culture that still resonates today. Their contributions continue to inspire and guide us, connecting the past and present in a profound journey of discovery.",[]]]]]},{"id":"G2|19","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"18. Ancient Civilizations in Comparison: IVC, Egypt, Mesopotamia, and Greece","p":38,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Overview",[["The cradle of civilization has nurtured diverse cultures across different geographies. Examining the Indus Valley Civilization, ancient Egypt, Mesopotamia, and Greece offers insights into their distinct characteristics and contributions to human history.",[]]]],["Indus Valley Civilization (3300-1300 BCE)",[]],["Urban Planning",[["Planned cities like Mohenjo-daro, Harappa.",[]]]],["Trade Networks",[["Links with Mesopotamia, Arabian Peninsula.",[]]]],["Script",[["Undeciphered, pictographic symbols.",[]]]],["Artifacts",[["Beads, seals, pottery.",[]]]],["Comparative Example",[["Harappan seals, Mesopotamian cuneiform.",[]]]],["Ancient Egypt (3100-332 BCE)",[]],["Nile Civilization",[["Flourished along the Nile River.",[]]]],["Monuments",[["Pyramids, Sphinx, temples.",[]]]],["Hieroglyphics",[["Complex writing system.",[]]]],["Social Hierarchy",[["Pharaohs, priests, farmers.",[]]]],["Comparative Example",[["Egyptian pyramids, Indus Valley architecture.",[]]]],["Mesopotamian Civilizations (3500-300 BCE)",[]],["Tigris and Euphrates",[["Cradle of Mesopotamian civilizations.",[]]]],["City-States",[["Sumerians, Babylonians, Assyrians.",[]]]],["Cuneiform Script",[["World's oldest writing system.",[]]]],["Code of Hammurabi",[["Early legal code.",[]]]],["Comparative Example",[["Cuneiform script, Harappan seals.",[]]]],["Ancient Greece (8th-4th century BCE)",[]],["Polis System",[["Independent city-states, Athens, Sparta.",[]]]],["Democracy",[["Athenian democratic governance.",[]]]],["Philosophy",[["Socrates, Plato, Aristotle.",[]]]],["Arts and Literature",[["Drama, epics, sculptures.",[]]]],["Comparative Example",[["Greek city-states, Mesopotamian city-states.",[]]]],["Threads of Commonality",[]],["Agriculture",[["Dependence on rivers for sustenance.",[]]]],["Trade",[["Interaction through trade routes.",[]]]],["Artistic Expression",[["Pottery, sculptures, hieroglyphs.",[]]]],["Writing Systems",[["Diverse scripts for communication.",[]]]],["Distinct Features",[]],["IVC",[["Advanced urban planning, mysterious script.",[]]]],["Egypt",[["Iconic pyramids, hieroglyphics.",[]]]],["Mesopotamia",[["City-states, cuneiform writing.",[]]]],["Greece",[["Democratic governance, philosophical inquiry.",[]]]],["Conclusion",[["These ancient civilizations, though separated by geography and time, shared threads of commonality in their dependence on rivers, trade, and artistic expression. Their unique features contributed to the rich tapestry of human history, revealing a spectrum of human achievements and innovations.",[]]]]]},{"id":"G2|20","s":"G2","g":"GS-1 · Block-1 (Art and Culture)","t":"19. Important rulers on which Question has been asked and can be asked.","p":39,"ch":"Medieval Architecture: Indo-Islamic architecture","items":[["Ashoka (Mauryan Empire)",[["Conversion to Buddhism: After the Kalinga War, he embraced Buddhism and propagated dhamma.",[]],["Rock Edicts: Inscriptions on pillars and rocks promoting ethical governance and moral conduct.",[]],["Spread of Buddhism: Sent missionaries to various regions, fostering the religion's growth.",[]],["Policy of Non-violence: Embraced ahimsa and advocated for peaceful coexistence.",[]],["Legacy: His contributions to the spread of Buddhism and moral governance.",[]]]],["Akbar (Mughal Empire)",[["Din-i Ilahi: Attempted syncretism by blending elements from various religions into a composite faith.",[]],["Ibadat Khana: Platform for scholars of different faiths to engage in religious discussions.",[]],["Mansabdari System: Military and administrative ranking for efficient governance.",[]],["Administrative Reforms: Introduced the Dahsala system for land revenue collection.",[]],["Legacy: His policy of religious tolerance, administrative reforms, and cultural legacy.",[]]]],["Raja Raja Chola (Chola Empire)",[["Maritime Expeditions: Naval conquests to Southeast Asia, expanding Chola influence.",[]],["Example: Chola expeditions to Srivijaya (Southeast Asia) brought immense wealth and strengthened maritime connections.",[]],["Architectural Marvels: Commissioned the Brihadeeswarar Temple, showcasing Chola grandeur.",[]],["Example: Brihadeeswarar Temple in Thanjavur, a UNESCO World Heritage site, symbolizes Chola architecture's magnificence.",[]],["Centralized Administration: Efficient governance with a strong centralized bureaucracy.",[]],["Example: Well-organized revenue collection and trade administration facilitated Chola prosperity.",[]],["Patronage of Arts: Encouraged literature, music, dance, and sculpture.",[]],["Example: Inscriptions promoting arts and cultural activities, showcasing royal patronage.",[]],["Trade Networks: Flourishing urban centers and trade connections.",[]],["Example: Chola ports like Nagapattinam played a pivotal role in Indian Ocean trade.",[]],["Legacy: Contributions to art, culture, maritime dominance, and temple architecture.",[]]]],["Shivaji (Maratha Empire)",[["Guerrilla Warfare: Employed hit-and-run tactics against the Mughal forces.",[]],["Example: Shivaji's tactics in the Battle of Pratapgad displayed his military prowess.",[]],["Swarajya Movement: Established a sovereign Maratha state, resisting Mughal rule.",[]],["Example: Shivaji's coronation as \"Chhatrapati\" showcased his aspiration for an independent Maratha kingdom.",[]],["Naval Power: Created a robust navy to control the Konkan coast.",[]],["Example: Construction of forts like Sindhudurg fort and naval fleet expansion for coastal defense.",[]],["Administrative Reforms: Introduced local self-governance and efficient administration.",[]],["Example: Shivaji's \"Ashta Pradhan\" council system ensured effective governance.",[]],["Military Forts: Built an extensive network of strategically positioned forts.",[]],["Example: Raigad Fort served as a strategic stronghold and symbol of Maratha independence.",[]],["Legacy: His role in establishing Maratha sovereignty and resistance.",[]]]],["Ranjit Singh (Sikh Empire)",[["Khalsa Administration: Embraced Sikh principles in governance.",[]],["Example: Integration of Sikh values in administration, emphasizing justice and equality.",[]],["Socio-religious Reforms: Supported Sikh institutions and propagated Sikhism.",[]],["Example: Reconstruction of the Golden Temple (Harmandir Sahib) showcased his patronage of Sikhism.",[]],["Modernization Efforts: Strengthened the army and established efficient administration.",[]],["Example: Establishment of a disciplined army equipped with modern weaponry.",[]],["Interfaith Relations: Displayed tolerance towards different religious communities.",[]],["Example: Ranjit Singh's support for Hindu, Muslim, and Sikh religious places.",[]],["Lahore Darbar: Created a multicultural Sikh state in the Punjab region.",[]],["Example: The Lahore Durbar became a symbol of Sikh sovereignty and power.",[]],["Legacy: Contributions to Sikh sovereignty, administrative reforms, and cultural harmony.",[]]]],["Krishnadevaraya (Vijayanagara Empire)",[["Patronage of Literature: Promoted Telugu and Kannada literature, fostering cultural growth.",[]],["Example: His court poet, Tenali Ramakrishna, produced literary gems.",[]],["Diplomatic Relations: Formed alliances to strengthen the empire.",[]],["Example: Friendly relations with the Gajapatis of Orissa and the Portuguese for trade.",[]],["Architectural Achievements: Built remarkable temples and monuments.",[]],["Example: The Virupaksha Temple in Hampi reflects his architectural patronage.",[]],["Economic Prosperity: Flourishing trade and commerce during his rule.",[]],["Example: Hampi's bustling markets and trade routes contributed to economic growth.",[]],["Encouragement of Arts: Supported music, dance, and other cultural endeavors.",[]],["Example: His court was a hub of cultural activities, fostering artistic expression.",[]],["Legacy: Contributions to literature, architecture, and cultural vibrancy.",[]]]]]},{"id":"G2|21","s":"G2","g":"GS-2 · Block-3 (RPA)","t":"Salient Features of the Representation of People's Act (RPA) and Its Impact on Indian Elections","p":42,"ch":"","items":[["Introduction",[["The Representation of People's Act (RPA) empowers Parliament to enact laws related to elections to Parliament and State",[]],["Legislatures. The two key acts under RPA are the RPA Act of 1950 and the RPA Act of 1951.",[]]]],["Representation of The People Act, 1950",[["This Act focuses on allocation of seats, delimitation of constituencies, voter qualifications, electoral rolls, and more.",[]],["Key Provisions",[]],["Delimiting Constituencies",[["President's power to amend delimitation orders with Election Commission consultation.",[]],["Reserved seats for Scheduled Castes and Scheduled Tribes in Lok Sabha.",[]],["Election Commission's control over reserved seats for scheduled tribes in certain states.",[]]]],["Allocation of Seats",[["States' representation in Lok Sabha proportional to population.",[]]]],["Electoral Rolls",[["Eligibility criteria for registration, including service qualifications.",[]],["Registration of wives of certain categories of personnel.",[]]]],["Electoral Officers",[["Chief Electoral Officer (CEO) supervising elections in states/UTs.",[]],["District Election Officer (DEO) nominated by Election Commission.",[]],["Electoral Registration Officer (ERO) responsible for electoral roll preparation.",[]],["Returning Officer (RO) overseeing election conduct in constituencies.",[]]]],["Power to Make Rules",[["Central government empowered to make rules in consultation with Election Commission.",[]]]],["Voting Rights",[["Voting rights extended to Indian citizens living abroad in 2010.",[]]]]]],["Representation of The People Act, 1951",[["This Act deals with conduct of elections, qualifications for membership, corrupt practices, and more.",[]],["Key Provisions",[]],["Qualification for Membership of Lok Sabha",[["Qualifications for candidates from reserved and non-reserved seats.",[]]]],["Qualification for Membership of Rajya Sabha",[["Qualifications for candidates representing States or Union territories.",[]]]],["Disqualifications",[["Disqualification on grounds of criminal conviction, disloyalty, corrupt practices, and more.",[]]]],["Election Offences",[["Corrupt practices, appeal based on religion, caste, enmity, false statements, etc.",[]]]],["Election Expenses",[["Candidates' obligation to maintain election expense accounts.",[]]]],["Provisions Related to Political Parties",[["Registration and recognition of political parties, state and national party status.",[]]]],["Section 126",[["Election Silence and Exit Poll Ban:",[]],["Ban on displaying election matter before polling ends.",[]],["Ban on exit polls dissemination during elections.",[]]]],["Voluntary Contributions",[["Regulation of voluntary
