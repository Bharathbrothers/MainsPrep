]]},{"s":"GS3 · Disaster Management","n":"Vulnerability and Risk As- sessment","i":[[2019,"10","Vulnerability is an essential element for defining disaster impacts and its threat to people. How and in what ways can vulnerability to disasters be characterized? Dis- cuss different types of vulnerability with reference to disasters."],[2013,"10","How important are vulnerability and risk assessment for pre-disaster management. As an administrator ,what are key areas that you would focus in a disaster manage- ment"]]},{"s":"GS3 · Disaster Management","n":"Drought","i":[[2014,"12.5","Drought has been recognised as a disaster in view of its party expense, temporal duration, slow onset and lasting effect on various vulnerable sections. With a focus on the September 2010 guidelines from the National disaster management author- ity, discuss the mechanism for preparedness to deal with the El Nino and La Nina fallouts in India."]]},{"s":"GS3 · Disaster Management","n":"Earthquake","i":[[2021,"10","Discuss about the vulnerability of India to earthquake related hazards. Give ex- amples including the salient features of major disasters caused by earthquakes in different parts of India during the last three decades."],[2015,"12.5","The frequency of earthquakes appears to have increased in the Indian subconti- nent. However, India’s preparedness for mitigating their impact has significant gaps. Discuss various aspects."]]},{"s":"GS3 · Disaster Management","n":"Landslide","i":[[2021,"15","Describe the various causes and effects of landslides. Mention the important com- ponents of the National Landslide Risk Management Strategy."]]},{"s":"GS3 · Disaster Management","n":"Dam failures","i":[[2023,"10","Dam failures are always catastrophic, especially on the downstream side, resulting in a colossal loss of life and property. Analyze the various causes of dam failures. Give two examples of large dam failures."]]},{"s":"GS3 · Disaster Management","n":"Tsunami","i":[[2017,"15","On December 2004, tsumani brought havoc on 14 countries including India. Discuss the factors responsible for occurrence of Tsunami and its effects on life and econo- my. In the light of guidelines of NDMA (2010) describe the mechanisms for pre- paredness to reduce the risk during such events."]]},{"s":"GS3 · Disaster Management","n":"Urban floods","i":[[2024,"15","Flooding in urban areas is an emerging climate-induced disaster. Discuss the causes of this disaster. Mention the features of two such major floods in the last two decades in India. Describe the policies and frameworks in India that aim at tackling such floods."],[2016,"12.5","The frequency of urban floods due to high intensity rainfall is increasing over the years. Discussing the reasons for urban floods. highlight the mechanisms for pre- paredness to reduce the risk during such events."]]},{"s":"GS3 · Internal Security","n":"Left-Wing Extremism","i":[[2025,"10","The Government of India recently stated that Left Wing Extremism (LWE) will be eliminated by 2026. What do you understand by LWE and how are the people af- fected by it? What measures have been taken by the government to eliminate LWE?"],[2022,"15","Naxalism is a social, economic and developmental issue manifesting as a violent internal security threat. In this context, discuss the emerging issues gest a multilay- ered strategy to tackle the menace of Naxalism."],[2020,"15","What are the sound determinants of left-wing extremism in Eastern part of India? What strategy should Government of India, civil administration and security forces adopt to counter the threat in the affected areas?"],[2018,"10","Left Wing Extremism (LWE) is showing a downward trend, but still affects many parts of the country. Briefly explain the Government of India’s approach to counter the challenges posed by LWE."],[2015,"12.5","The persisting drives of the government for development of large industries in back- ward areas have resulted in isolating the tribal population and the farmers who face multiple displacements with Malkangiri and naxalbari foci, discuss the corrective strategies needed to win the left wing extremism (LWE) doctrine affected citizens back into the mainstream of social and economic growth."],[2013,"10","Article 244 of Indian Constitution relates to Administration of Scheduled areas and tribal areas. Analyze the impact of non-implementation of the provisions of fifth schedule on the growth of Left Wing Extremism."]]},{"s":"GS3 · Internal Security","n":"N-E Insurgency","i":[[2025,"15","What are the major challenges to internal security and peace process in the North-Eastern States? Map the various peace accords and agreements initiated by the government in the past decade."],[2017,"10","The north-eastern region of India has been infested with insurgency for a very long time. Analyze the major reasons for the survival of armed insurgency in this region."]]},{"s":"GS3 · Internal Security","n":"Threat from External state and Non-state actors","i":[[2021,"15","Analyse the multidimensional challenges posed by external state and non-state actors, to the internal security of India. Also discuss measures required to take to be taken to combat the threats."],[2018,"10","The China-Pakistan Economic Corridor (CPEC) is viewed as a cardinal subset of China’s larger ‘One Belt One Road’ initiative. Give a brief description of CPEC and enumerate the reasons why India has distanced itself from the same."],[2016,"12.5","Use of Internet and social media by non-state actors for subversive activities is a major concern. How have these have misused in the recent past? Suggest effective guidelines to curb the above threat."],[2014,"12.5","The diverse nature of India as a multi-religious and multi-ethnic society is not immune to the impact of radicalism which has been in her neighbourhood. Discuss along with the strategies to be adopted to counter this environment."],[2014,"12.5","China and Pakistan have entered into an agreement for development of an econom- ic corridor. What thread does it dispose for India’s security? Critically examine."]]},{"s":"GS3 · Internal Security","n":"Act based","i":[[2024,"10","Describe the context and salient features of the Digital Personal Data Protection Act, 2023."]]},{"s":"GS3 · Internal Security","n":"Cyber security","i":[[2022,"15","What are the different elements of cyber security ? Keeping in view the challenges in cyber security, examine the extent to which India has successfully developed a comprehensive National Cyber Security Strategy."],[2021,"10","Keeping in view India’s internal security, analyse the impact of cross-border cyber attacks. Also discuss defensive measures against these sophisticated attacks."],[2020,"10","Discuss different types of cyber crimes and measures required to be taken to fight the menace."],[2019,"10","What is the CyberDome Project? Explain how it can be useful in controlling internet crimes in India."],[2018,"15","Data security has assumed significant importance in the digitized world due to rising cyber crimes. The Justice B. N. Srikrishna Committee Report addresses issues related to data security. What, in your view, are the strengths and weakness of the Report relating to protection of personal data in cyber space?"],[2017,"10","Discuss the potential threats of Cyber attack and the security framework to prevent it."],[2015,"12.5","Considering the threats cyberspace poses for the country, India needs a “Digital Armed Force” to prevent crimes. Critically evaluate the National Cyber Security Poli- cy, 2013 outlining the challenges perceived in its effective implementation."],[2013,"10","Cyber warfare is considered by some defense analysts to be a larger threat than even Al Qaeda or terrorism. What do you understand by Cyber warfare? Outline the cyber threats which India is vulnerable to and bring out the state of the country’s preparedness to deal with the same."]]},{"s":"GS3 · Internal Security","n":"Drug trafficking","i":[[2018,"15","India’s proximity to two of the world’s biggest illicit opium-growing states has en- hanced her internal security concerns. Explain the linkages between drug trafficking and other illicit activities such as gunrunning, money laundering and human traffick- ing. What counter-measures should be taken to prevent the same?"]]},{"s":"GS3 · Internal Security","n":"Mob Violence","i":[[2017,"15","Mob violence is emerging as a serious law and order problem in India. By giving suitable examples, analyze the causes and consequences of such violence."]]},{"s":"GS3 · Internal Security","n":"Money-laundering and Prevention","i":[[2021,"10","Discuss how emerging technologies and globalisation contribute to money launder- ing. Elaborate measures to tackle the problem of money laundering both at national and international levels."],[2013,"10","Money laundering poses a serious threat to country’s economic sovereignty. What is its significance for India and what steps are required to be taken to control this menace?"]]},{"s":"GS3 · Internal Security","n":"Digital Media and Security Threats","i":[[2024,"15","Social media and encrypting messaging services pose a serious security challenge. What measures have been adopted at various levels to address the security implica- tions of social media? Also suggest any other remedies to address the problem."],[2015,"12.5","Religious indoctrination via digital media has resulted in Indian youth joining the ISIS. What is ISIS and its mission? How can ISIS be dangerous for the internal security of our country?"],[2013,"10","What are social networking site and what security implications do these sites pres- ent?"]]},{"s":"GS3 · Internal Security","n":"Border Area Management","i":[[2024,"15","India has a long and troubled border with China and Pakistan fraught with conten- tious issues. Examine the conflicting issues and security challenges along the border. Also give out the development being undertaken in these areas under the Border Area Development Programme (BADP) and Border Infrastructure and Management (BIM) Scheme."],[2023,"10","The use of unmanned aerial vehicles(UAVs) by our adversaries across the borders to ferry arms/ammunitions, drugs, etc., is a serious threat to the internal security. Comment on the measures being taken to tackle this threat."],[2020,"10","For effective border area management, discuss the steps required to be taken to deny local support to militants and also suggest ways to manage favourable percep- tion among locals."],[2019,"15","Cross-border movement of insurgents is only one of the several security challenges facing the policing of the border in North-East India. Examine the various challenges currently emanating across the India-Myanmar border. Also, discuss the steps to counter the challenges."],[2016,"12.5","Border management is a complex task due to difficult terrain and hostile relations with some countries. Elucidate the challenges and strategies for effective border management."],[2014,"12.5","How illegal transborder migration does pose a threat to India’s security? Discuss the strategies to curb this, bring out the factors which give impetus to such migration."],[2013,"10","How far are India’s internal security challenges linked with border management, par- ticularly in view of the long porous borders with most countries of South Asia and Myanmar?"]]},{"s":"GS3 · Internal Security","n":"Maritime Security challenges","i":[[2025,"15","Why is maritime security vital to protect India’s sea trade? Discuss maritime and coastal security challenges and the way forward."],[2022,"10","What are the maritime security challenges in India ? Discuss the organisational, technical and procedural initiatives taken to improve the maritime security."],[2014,"12.5","In 2012, the longitudinal marking of the high-risk areas for piracy was moved from 65° East to 78° east in the Arabian Sea by International Maritime organisation. What impact does this have on India’s maritime security concerns?"]]},{"s":"GS3 · Internal Security","n":"Organized Crime and Ter- rorism","i":[[2025,"10","Terrorism is a global scourge. How has it manifested in India? Elaborate with contemporary examples. What are the counter measures adopted by the State? Explain."],[2024,"10","Explain how narco-terrorism has emerged as a serious threat across the country. Suggest suitable measures to counter narco-terrorism."],[2023,"15","Give out the major sources of terror funding in India and efforts being made to curtail these sources. In the light of this, also discuss the aim and objective of the ‘ No Money for Terror [NMFT]’ Conference recently held at New Delhi in November 2022."],[2023,"10","Winning of ‘Hearts and Minds’ in terrorism affected areas is an essential step in restoring the trust of the population. Discuss the measures adopted by the Govern- ment in this respect as part of the conflict resolution in Jammu and Kashmir."],[2022,"10","Discuss the types of organised crimes. Describe the linkages between terrorists and organised crime that exist at the national and transnational levels."],[2021,"15","Analyse the complexity and intensity of terrorism, its causes, linkages and obnox- ious nexus. Also suggest measures required to be taken to eradicate the menace of terrorism."],[2019,"10","The banning of ‘Jamaat-e – islaami’ in Jammu and Kashmir brought into focus the role of over-ground workers (OGWs) in assisting terrorist organizations. Examine the role played by OGWs in assisting terrorist organizations in insurgency affected areas. Discuss measures to neutralize the influence of OGWs."],[2017,"15","The scourge of terrorism is a grave challenge to national security. What solutions do you suggest to curb this growing menace? What are the major sources of terrorist funding?"],[2016,"12.5","Terrorism is emerging as a competitive industry over the last few decades. Analyse the above statement."],[2016,"12.5","The terms ‘Hot Pursuit’ and ‘Surgical Strikes’ are often used in connection with armed action against terrorist attacks. Discuss the strategic impact of such actions."]]},{"s":"GS3 · Internal Security","n":"Act based","i":[[2019,"15","The Indian government has recently strengthened the anti-terrorism laws by amending the Unlawful activities (Prevention) Act (UAPA), 1967 and the NIA Act. An- alyze the changes in the context of prevailing security environment while discussing the scope and reasons for opposing the UAPA by human rights organizations."],[2015,"12.5","Human rights activists constantly highlight the view that the Armed Forces (Special Powers) Act, 1958 (AFSPA) is a draconian act leading to cases of human rights abuses by the security forces. What sections of AFSPA are opposed by the activists? Critical- ly evaluate the requirement with reference to the view held by the Apex Court."]]},{"s":"GS3 · Internal Security","n":"Mandates of Security forces","i":[[2023,"15","What are the internal security challenges being faced by India? Give out the role of Central Intelligence and Investigative Agencies tasked to counter such threats."],[2020,"15","Analyze internal security threats and transborder crimes along Myanmar, Bangla- desh and Pakistan borders including Line of Control (LoC). Also discuss the role played by various security forces in this regard."]]},{"s":"GS4 · Ethics","n":"Applied Ethics x Environ- ment","i":[[2025,"10","Keeping the national security in mind, examine the ethical dilemmas related to controversies over environmental clearance of development projects in ecologically sensitive border areas in the country."],[2024,"10","Gobal warming and climate change are the outcomes of human greed in the name of development, indicating the direction in which extinction of organisms including human beings is heading towards loss of life on Earth. How do you put an end to this to protect life and bring equilibrium between the society and the environment ?"],[2018,"10","Suppose the Government of India is thinking of constructing a dam in a mountain valley bound by forests and inhabited by ethnic communities. What rational policy should it resort to in dealing with unforeseen contingencies?"],[2015,"10","What is meant by ‘environmental ethics’? Why is it important to study? Discuss any one environmental issue from the viewpoint of environmental ethics."]]},{"s":"GS4 · Ethics","n":"Applied Ethics x Technology","i":[[2025,"10","In the present digital age, social media has revolutionised our way of communica- tion and interaction. However, it has raised several ethical issues and challenges. Describe the key ethical dilemmas in this regard."],[2024,"10","The application of Artificial Intelligence as a dependable source of input for adminis- trative rational decision-making is a debatable issue. Critically examine the state- ment from the ethical point of view."],[2022,"10","Online methodology is being used for day-to-day meetings, institutional approv- als in the administration and for teaching and learning in education sector to the extent telemedicine in the health sector is getting popular with the approvals of the competent authority. No doubt it has advantages and disadvantages for both the beneficiaries and system at large. Describe and discuss the ethical issues involved in the use of online method particularly to vulnerable section of society."],[2021,"10","Impact of digital technology as a reliable source of input for rational decision making is a debatable issue. Critically evaluate with a suitable example."],[2020,"10","The current internet expansion has instilled a different set of cultural values which are in conflict with traditional values. Discuss."]]},{"s":"GS4 · Ethics","n":"Consequences of Ethics","i":[[2022,"10","It is believed that adherence to ethics in human actions would ensure in smooth functioning of an organization/system. If so, what does ethics seek to promote in human life? How do ethical values assist in the resolution of conflicts faced by him in his day-to-day functioning?"],[2020,"10","Discuss the role of ethics and values in enhancing the following three major com- ponents of Comprehensive National Power (CNP) viz. human capital, soft power (culture and policies), and social harmony."],[2017,"10","Increased national wealth did not result in equitable distribution of its benefits. It has created only some “enclaves of modernity and prosperity for a small minority at the cost of the majority.” Justify."],[2016,"10","Explain how ethics contributes to social and human well-being."],[2014,"10","The current society is plagued with widespread trust-deficit. What are the conse- quences of this situation for personal well-being and for societal well-being? What can you do at the personal level to make yourself trustworthy?"]]},{"s":"GS4 · Ethics","n":"Normative Ethics (Deontology vs Teleology)","i":[[2018,"10","With regard to morality of actions, one view is that means are of paramount im- portance and the other view is that the ends justify the means. Which view do you think is more appropriate? Justify your answer."],[2014,"10","Human beings should always be treated as ‘ends’ in themselves and never as merely ‘means’. Explain the meaning and significance of this statement, giving its implica- tions in the modern techno-economic society."]]},{"s":"GS4 · Ethics","n":"Determinants of Ethics","i":[[2024,"10","“The concept of Just and Unjust is contextual. What was just a year back, may turn out to be unjust in today’s context. Changing context should be constantly under scrutiny to prevent miscarriage of justice.” Examine the above statement with suit- able examples."],[2024,"10","“Ethics encompasses several key dimensions that are crucial in guiding individuals and organizations towards morally responsible behaviour.” Explain the key dimen- sions of ethics that influence human actions Discuss how these dimensions shape ethical decision-making in the professional context."],[2017,"10","Without commonly shared and widely entrenched moral values and obligations, neither the law, nor democratic government, nor even the market economy will function properly. What do you understand by this statement? Explain with illustra- tion in the contemporary times."],[2013,"10","Some people feel that values keep changing with time and situation, while others strongly believe that there are certain universal and eternal human values. Give your perception in this regard with due justification."]]},{"s":"GS4 · Ethics","n":"Essence of Ethics","i":[[2020,"10","Distinguish between laws and rules. Discuss the role of ethics in formulating them."],[2013,"10","It is often said that ‘politics’ and ‘ethics’ do not go together. What is your opinion in this regard? Justify your answer with illustrations."]]},{"s":"GS4 · Ethics","n":"Ethics in Private and Public sphere","i":[[2014,"10","In the context of defence services, ‘patriotism’ demands readiness to even lay down one’s life in protecting the nation. According to you, what does patriotism imply in everyday civil life? Explain with illustrations and justify your answer."],[2014,"10","What does ethics seek to promote in human life? Why is it all the more important in public administration?"],[2013,"10","The good of an individual is contained in the good of all. What do you understand by this statement? How can this principle be implemented in public life?"],[2013,"10","What do you understand by ‘values’ and ‘ethics’? In what way is it important to be ethical along with being professionally competent?"]]},{"s":"GS4 · Ethics","n":"Term Based","i":[[2023,"10","Differentiate ‘moral intuition’ from ‘moral reasoning’ with suitable examples."],[2022,"10","Write short notes on the following in 30 words each : (i) Constitutional morality (ii) Conflict of interest (iii) Probity in public life (iv) Challenges of digitalization (v) Devo- tion to duty"],[2017,"10","Examine the relevance of the following in the context of civil service: (a) Transpar- ency (b) Accountability (c) Fairness and justice (d) Courage of conviction (e) Spirit of service."],[2015,"10","Differentiate between the following (200 words); a) Law and Ethics; b) Ethical man- agement and Management of ethics; c) Discrimination and Preferential treatment; d) Personal ethics and Professional ethics"],[2013,"15","What do you understand by the following terms in the context of public service? (5 terms x 3 marks each: a) Integrity b) Perseverance c) Spirit of service d) Commit- ment e) Courage of conviction f) Personal opinion"]]},{"s":"GS4 · Ethics","n":"Crisis of Ethical Values","i":[[2023,"10","“Corruption is the manifestation of the failure of core values in the society.” In your opinion, what measures can be adopted to uplift the core values in the society?"],[2017,"10","The crisis of ethical values in modern times is traced to a narrow perception of the good life. Discuss."],[2014,"10","We are witnessing increasing instances of sexual violence against women in the country. Despite existing legal provisions against it, the number of such incidences is on the rise. Suggest some innovative measures to tackle this menace."]]},{"s":"GS4 · Ethics","n":"Role of Educational institu- tions","i":[[2020,"10","“Education is not an injunction, it is an effective and pervasive tool for all-round de- velopment of an individual and social transformation”.Examine the New Education Policy,2020 (NEP,2020) in light of the above statement."]]},{"s":"GS4 · Ethics","n":"Teachings of Great Leaders","i":[[2025,"10","What are the major teachings of Mahavir? Explain their relevance in the contempo- rary world."],[2023,"10","What were the major teachings of Guru Nanak? Explain their relevance in the con- temporary world."],[2020,"10","What are the main factors responsible for gender inequality in India ? Discuss the contribution of Savitribai Phule in this regard."],[2020,"10","What teachings of Buddha are most relevant today and why? Discuss."],[2017,"10","“Great ambition is the passion of a great character. Those endowed with it may per- form very good or very bad acts. All depends on the principles which direct them.” – Napoleon Bonaparte. Stating examples mention the rulers (i) who have harmed society and country, (ii) who worked for the development of society and country."],[2016,"10","Discuss Mahatma Gandhi’s concept of seven sins."],[2014,"10","Which eminent personality has inspired you the most in the context of ethical con- duct in life? Give the gist of his/her teachings giving specific examples, describe how you have been able to apply these teachings for your own ethical development."]]},{"s":"GS4 · Ethics","n":"Value Based Questions","i":[[2015,"10","Social values are more important than economic values. Discuss the above state- ment with examples in the context of inclusive growth of a nation."],[2014,"10","All human beings aspire for happiness. Do you agree? What does happiness mean to you? Explain with examples."]]},{"s":"GS4 · Ethics","n":"Attitude for Civil Servants","i":[[2025,"10","To achieve holistic development goal, a civil servant acts as an enabler and active facilitator of growth rather than a regulator. What specific measures would you suggest to achieve this goal?"],[2024,"10","Mindless addiction to Form, ignoring the Substance of the matter, results in render- ing of injustice. A perceptive civil servant is one who ignores such literalness and carries out true intent. Examine the above statement with suitable illustrations."],[2022,"10","The Rules and Regulations provided to all the civil servants are same, yet there is dif- ference in the performance. Positive minded officers are able to interpret the Rules and Regulations in favour of the case and achieve success, whereas negative minded officers are unable to achieve goals by interpreting the same Rules and Regulations against the case. Discuss with illustrations."],[2021,"10","Attitude is an important component that goes as input in the development of hu- man beings. How to build a suitable attitude needed for a public servant?"],[2020,"10","A positive attitude is considered to be an essential characteristic of a civil servant who is often required to function under extreme stress. What contributes a positive attitude in person.?"],[2016,"10","Our attitudes towards life, work, other people and society are generally shaped unconsciously by the family and social surroundings in which we grow up. Some of these unconsciously acquired attitudes and values are often undesirable in the citizens of modern democratic and egalitarian society. (a) Discuss such undesirable values prevalent in today’s educated Indians. (b) How can such undesirable attitudes be changed and socio-ethical values be cultivated in the aspiring and serving civil servants?"],[2015,"10","Two different kinds of attitudes exhibited by public servants towards their work have been identified as the bureaucratic attitude and the democratic attitude. A) Distin- guish between these two terms and write their merits and demerits. B) Is it possible to balance the two to create a better administration for the faster development of our country?"]]},{"s":"GS4 · Ethics","n":"Attitude for Individuals","i":[[2020,"10","‘Hatred is destructive of a person‘s wisdom and conscience that can poison a na- tion’s spirit. Do you agree with this view? Justify your answer."],[2016,"10","Anger is a harmful negative emotion. It is injurious to both personal life and work life. (a) Discuss how it leads to negative emotions and undesirable behaviours. (b) How can it be managed and controlled?"],[2014,"10","What factors affect the formation of a person’s attitude towards social problems? In our society, contrasting attitudes are prevalent about many social problems. What contrasting attitudes do you notice about the caste system in our society? How do you explain the existence of these contrasting attitudes?"]]},{"s":"GS4 · Ethics","n":"Moral and Political Attitude","i":[[2017,"10","Young people with ethical conduct are not willing to come forward to join active politics. Suggest steps to motivate them to come forward."]]},{"s":"GS4 · Ethics","n":"Organisational Attitude","i":[[2023,"10","In the context of work environment, differentiate between ‘coercion’ and ‘undue influence’ with suitable examples."],[2017,"10","Discipline generally implies following the order and subordination. However, it may be counter-productive for the organisation. Discuss."]]},{"s":"GS4 · Ethics","n":"Social influence and persua- sion","i":[[2025,"10","“For any kind of social re-engineering by successfully implementing welfare schemes, a civil servant must use reason and critical thinking in an ethical frame- work.” Justify this statement with suitable examples."],[2016,"10","How could social influence and persuasion contribute to the success of Swatchh Bharat Abhiyan?"]]},{"s":"GS4 · Ethics","n":"EI in Administration","i":[[2017,"10","How will you apply emotional intelligence in administrative practices?"]]},{"s":"GS4 · Ethics","n":"EI X Crisis of Conscience","i":[[2021,"10","In case of a crisis of conscience does emotional intelligence help to overcome the same without compromising the ethical and moral stand that you are likely to fol- low? Critically examine."]]},{"s":"GS4 · Ethics","n":"EI: Concept and utility","i":[[2020,"10","What are the main components of emotional intelligence (EI) ? Can they be learned? discuss."],[2019,"10","“Emotional Intelligence is the ability to make your emotions work for you instead of against you.” Do you agree with this view? Discuss."],[2013,"10","What is ‘emotional intelligence’ and how can it be developed in people? How does it help an individual in taking ethical decisions?"]]},{"s":"GS4 · Ethics","n":"EQ vs IQ","i":[[2023,"10","What really matters for success, character, happiness and lifelong achievements is a definite set of emotional skills – your EQ- not just purely cognitive abilities that are measured by conventional IQ tests.” Do you agree with this view ? Give reasons in support of your answer."]]},{"s":"GS4 · Ethics","n":"A.P.J. Abdul Kalam","i":[[2022,"10","“If a country is to be corruption free and become a nation of beautiful minds, I strongly feel there are three key societal members who can make a difference. They are the father, the mother and the teacher.” – Abdul Kalam."],[2019,"10","“Where there is righteousness in the heart, there is beauty in the character. When there is beauty in the character, there is harmony in the home. When there is har- mony in the home, there is order in the nation. When there is order in the nation, there is peace in the world.”"],[2017,"10","“If a country is to be corruption free and become a nation of beautiful minds, I strongly feel there are three key societal members who can make a difference. they are father, the mother and the teacher.” – A. P. J. Abdul Kalam. Analyse."]]},{"s":"GS4 · Ethics","n":"Abraham Lincoln","i":[[2018,"10","The true rule, in determining to embrace, or reject any thing, is not whether it has any evil in it; but whether it has more evil than good. There are few things wholly evil or wholly good. Almost every thing, especially of governmental policy, is an in- seprarable compound of the two; so that our best judgement of the preponderance between them is continually demand. - Abraham Lincoln."],[2013,"10","Nearly all men can withstand adversity, but if you want to test a man’s character, give him power.—Abraham Lincoln"]]},{"s":"GS4 · Ethics","n":"Aristotle","i":[[2013,"10","I count him braver who overcomes his desires than him who overcomes his ene- mies.—Aristotle"]]},{"s":"GS4 · Ethics","n":"Dalai Lama","i":[[2022,"10","“Judge your success by what you had to give up in order to get it.” Dalai Lama."],[2021,"10","“We can never obtain peace in the outer world until and unless we obtain peace within ourselves”"]]},{"s":"GS4 · Ethics","n":"Erik Erikson","i":[[2021,"10","“Life doesn’t make any sense without interdependence. We need each other, and the sooner we learn that it is better for us all” – Erik Erikson"]]},{"s":"GS4 · Ethics","n":"Immanuel Kant","i":[[2024,"10","“In law, a man is guilty when he violates the rights of others. In ethics, he is guilty if he only thinks of doing so.” — Immanuel Kant"]]},{"s":"GS4 · Ethics","n":"Jawaharlal Nehru","i":[[2023,"10","“To awaken the people, it is the women who must be awakened. Ones she is on the move, the family moves, the village moves, the nation moves.” – Jawaharlal Nehru"]]},{"s":"GS4 · Ethics","n":"John Rawls’s concept of social Justice","i":[[2016,"10","Analyse John Rawls’s concept of social justice in the Indian context."]]},{"s":"GS4 · Ethics","n":"Kautilya","i":[[2016,"10","Corruption causes misuse of government treasury, Administrative inefficiency and obstruction in the path of national Development. Discuss Kautilya’s views."]]},{"s":"GS4 · Ethics","n":"Mahatma Gandhi","i":[[2023,"10","“The simplest acts of kindness are by far more powerful than a thousand heads bowing in prayer.” – Mahatma Gandhi"],[2020,"10","“The best way to find yourself is to lose yourself in service of others .” Mahatma Gandhi"],[2019,"10","“A man is but the product of his thoughts. What he thinks, he becomes.” – M.K.Gandhi"],[2018,"10","Anger and intolerance are the enemies of correct understanding. -Mahatma Gandhi"],[2015,"10","“The weak can never forgive; forgiveness is the attribute of the strong.”"],[2013,"10","There is enough on this earth for every one’s need but for no one’s greed. Mahatma Gandhi."]]},{"s":"GS4 · Ethics","n":"Plato","i":[[2015,"10","We can easily forgive a child who is afraid of the dark; the real tragedy of life is when men are afraid of the light."]]},{"s":"GS4 · Ethics","n":"Potter Stewart","i":[[2022,"10","Ethics is knowing the difference between what you have the right to do and what is right to do.’-Potter Stewart ."]]},{"s":"GS4 · Ethics","n":"Sardar Patel","i":[[2024,"10","“Faith is of no avail in the absence of strength. Faith and strength, both are essential to accomplish any great work.” — Sardar Patel"]]},{"s":"GS4 · Ethics","n":"Socrates","i":[[2020,"10","”A system of morality which is based on relative emotional values is a mere illusion, a thoroughly vulgar conception which has nothing sound in it and nothing true.” – Socrates."],[2019,"10","“An unexamined life is not worth living.” – Socrates"]]},{"s":"GS4 · Ethics","n":"Swami Vivekananda","i":[[2025,"10","“The strength of a society is not in its laws, but in the morality of its people.” – Swa- mi Vivekananda"],[2024,"10","“Learn everything that is good from others, but bring it in, and in your own way absorb it, do not become others.” — Swami Vivekananda"],[2023,"10","Do not hate anybody, because that hatred that comes out from you must, in the long run, come back to you. If you love, that love will come back to you, completing the circle.” – Swami Vivekanand."],[2021,"10","“Every work has got to pass through hundreds of difficulties before succeeding. Those that persevere will see the light, sooner or later” – Swami Vivekananda"],[2020,"10","”Condemn none: if you can stretch out a helping hand do so. If not fold your hands, bless your brothers and let them go their own way.” – Swami Vivekanand"]]},{"s":"GS4 · Ethics","n":"Tirukkural","i":[[2025,"10","“Those who in trouble untroubled are, Will trouble trouble itself.” – Thiruvalluvar"],[2018,"10","Falsehood takes the place of truth when it results in unblemished common good. -Tirukkural"]]},{"s":"GS4 · Ethics","n":"William James","i":[[2025,"10","“The greatest discovery of my generation is that a human being can alter his life by altering his attitudes.” – William James"]]},{"s":"GS4 · Ethics","n":"Empathy and Compassion","i":[[2022,"10","Apart from intellectual competency and moral qualities, empathy and compassion are some of the other vital attributes that facilitate the civil servants to be more competent in tackling the crucial issues or taking critical decisions. Explain with suitable illustrations."]]},{"s":"GS4 · Ethics","n":"Foundational values","i":[[2021,"10","Identify five ethical traits on which one can plot the performance of a civil servant. Justify their inclusion in the matrix."],[2021,"10","Identify ten essential values that are needed to be an effective public servant. De- scribe the ways and means to prevent non-ethical behaviour in public servants."],[2019,"10","What do you understand by the term ‘public servant’? Reflect on the expected role of a public servant."],[2019,"10","What are the basic principles of public life? Illustrate any three of these with suitable examples."],[2018,"10","State the three basic values, universal in nature, in the context of civil services and bring out their importance."],[2013,"10","Indicate two more attributes which you consider important for public service. Justify your answer."]]},{"s":"GS4 · Ethics","n":"Impartiality and Non-Parti- sanship","i":[[2021,"10","Should impartial and being non-partisan be considered indispensable qualities to make a successful civil servant? Discuss with illustrations."],[2016,"10","Why should impartiality and non-partisanship be considered as foundational values in public services, especially in the present day socio-political context ? Illustrate your answer with examples."]]},{"s":"GS4 · Ethics","n":"Integrity","i":[[2021,"10","“Integrity is a value that empowers the human being’’. Justify with suitable illustra- tion."],[2017,"10","One of the tests of integrity is complete refusal to be compromised. Explain with reference to a real life example."],[2014,"10","Integrity without knowledge is weak and useless, but knowledge without integrity is dangerous and dreadful. What do you understand by this statement? Explain your stand with illustrations from the modern context."]]},{"s":"GS4 · Ethics","n":"Integrity X Intelligence X Energy","i":[[2018,"10","In looking for people to hire, you look for three qualities: integrity, intelligence and energy. And if they do not have the first, the other two will you. - Warren Buffett. What do you understand by this statement in the present-day scenario? Explain."]]},{"s":"GS4 · Ethics","n":"Trustworthiness and Forti- tude","i":[[2015,"10","How do the virtues of trustworthiness and fortitude get manifested in public ser- vice? Explain with examples."]]},{"s":"GS4 · Ethics","n":"Accountability and Ethical Governance","i":[[2025,"10","“Constitutional morality is not a natural sentiment but a product of civil educa- tion and adherence of the rule of law.” Examine the significance of constitutional morality for public servant highlighting the role in promoting good governance and ensuring accountability in public administration."],[2023,"10","Explain the term social capital. How does it enhance good governance?"],[2022,"10","What do you understand by term ‘good governance’? How far recent initiatives in terms of e-Governance steps taken by the State have helped the beneficiaries? Discuss with suitable examples."],[2021,"10","An independent and empowered social audit mechanism is an absolute must in every sphere of public service, including the judiciary, to ensure performance, ac- countability and ethical conduct. Elaborate."],[2016,"10","What do you understand by the terms ‘governance’, ‘good governance’ and ‘ethical governance’?"],[2014,"10","What does ‘accountability’ mean in the context of public service? What measures can be adopted to ensure individual and collective accountability of public servants?"]]},{"s":"GS4 · Ethics","n":"Public/Civil Service Values","i":[[2025,"10","“One who is devoted to one’s duty attains highest perfection in life.” Analyse this statement with reference to sense of responsibility and personal fulfilment as a civil servant."],[2019,"10","“Non-performance of duty by a public servant is a form of corruption” Do you agree with this view? Justify your answer (150 words, 10m)"],[2018,"10","In doing a good thing, everything is permitted which is not prohibited expressly or by clear implication. Examine the statement with suitable examples in the context of a public servant discharging his/her duties."],[2018,"10","What is meant by public interest? What are the principles and procedures to be followed by the civil servants in public interest?"],[2016,"10","Max Weber said that it is not wise to apply to public administration the sort of moral and ethical norms we apply to matters of personal conscience. It is important to realise that the State bureaucracy might possess its own independent bureaucratic morality. Critically analyse this statement."]]},{"s":"GS4 · Ethics","n":"Corporate Governance","i":[[2023,"10","What do you understand by ‘moral integrity’ and ‘professional efficiency’ in the context of corporate governance in India ? Illustrate with suitable examples."],[2022,"10","In contemporary world, corporate sector’s contribution in generating wealth and employment is increasing. In doing so, they are bringing in unprecedented onslaught on the climate, environmental sustainability and living conditions of human beings. In this background, do you find that Corporate Social Responsibility (CSR) is efficient and sufficient enough to fulfill the social roles and responsibilities needed in the corporate world for which the CSR is mandated? Critically examine."],[2017,"10","Corporate social responsibility makes companies more profitable and sustainable. Analyse."]]},{"s":"GS4 · Ethics","n":"Conflict of interest","i":[[2018,"10","What is meant by conflict of interest? Illustrate with examples, the difference be- tween the actual and potential conflicts of interest."],[2017,"10","Conflict of interest in the public sector arises when (a) official duties, (b) public inter- est, and (c) personal interest are taking priority one above the other. How can this conflict in administration be resolved? Describe with an example."],[2015,"10","Public servants are likely to confront with the issues of ‘Conflict of Interest’. What do you understand by the term ‘Conflict of Interest’ and how does it manifest in the decision making by public servants? If faced with the conflict of interest situation, how would you resolve it? Explain with the help of examples."]]},{"s":"GS4 · Ethics","n":"Ethical dilemmas in Public Administration","i":[[2021,"10","Besides domain knowledge, a public official needs innovativeness and creativity of a high order as well, while resolving ethical dilemmas. Discuss with a suitable exam- ple."],[2018,"10","Explain the process of resolving ethical dilemmas in Public Administration."]]},{"s":"GS4 · Ethics","n":"Ethical Issues in Internation- al Relations and funding","i":[[2025,"10","Carl von Clausewitz once said, “War is a diplomacy by other means.” Critically analyse the above statement in the present context of contemporary geo-political conflict."],[2024,"10","“It is not enough to talk about peace, one must believe in it; and it is not enough to believe in it, one must act upon it” In the present context, the major weapon indus- tries of the developed nations are adversely influencing continuation of number of wars for their own self-interest, all around the world. What are the ethical consider- ations of the powerful nations in today’s international arena to stop continuation of ongoing conflicts?"],[2023,"10","‘International aid’ is an accepted form of helping ‘resource-challenged’ nations. Comment on ‘ethics in contemporary international aid’. Support your answer with suitable examples."],[2022,"10","Russia and Ukraine war has been going on for the last seven months. Different coun- tries have taken independent stands and actions keeping in view their own national interests. We are all aware that war has its own impact on the different aspects of society, including human tragedy. What are those ethical issues that are crucial to be considered while launching the war and its continuation so far? Illustrate with justification the ethical issues involved in the given state of affair."],[2021,"10","“Refugees should not be turned back to the country where they would face pros- ecution or human rights violation.” Examine the statement with reference to the ethical dimension being violated by the nation claiming to be democratic with an open society."],[2020,"10","‘The will to power exits, but it can be tamed and be guided by rationality and princi- ples of moral duty.’ Examine this statement in the context of international relations."],[2017,"10","Strength, peace and security are considered to be the pillars of international rela- tions. Elucidate."],[2015,"10","At the international level, the bilateral relations between most nations are governed on the policy of promoting one’s own national interest without any regard for the interest of other nations. This leads to conflicts and tensions between the nations. How can ethical consideration help resolve such tensions? Discuss with specific examples."]]},{"s":"GS4 · Ethics","n":"Laws, Rules, Regulations and Conscience as Ethical Guidance","i":[[2024,"10","The soul of the new law, Bharatiya Nyaya Sanhita (BNS) is Justice, Equality and Impartiality based on Indian culture and ethos. Discuss this in the light of major shift from a doctrine of punishment to justice in the present judicial system."],[2023,"10","Is conscience a more reliable guide when compared to laws, rules and regulations in the context of ethical decision making ? Discuss."],[2019,"10","What is meant by ‘crisis of conscience’? How does it manifest itself in the public domain?"],[2019,"10","What is meant by constitutional morality? How does one uphold constitutional morality?"],[2016,"10","Law and ethics are considered to be the two tools for controlling human conduct so as to make it conducive to civilized social existence. (a) Discuss how they achieve this objective. (b) Giving examples, show how the two differ in their approaches."],[2015,"10","A mere compliance with law is not enough, the public servant also has to have a well-developed sensibility to ethical issues for effective discharge of duties.” Do you agree? Explain with the help of two examples, where (i) an act is ethically right, but not legally and (ii) an act is legally right, but not ethically."],[2013,"10","What do you understand by the term ‘voice of conscience’? How do you prepare yourself to heed to the voice of conscience?"],[2013,"10","What is meant by ‘crisis of conscience’? Narrate one incident in your life when you were faced with such a crisis and how you resolved the same."]]},{"s":"GS4 · Ethics","n":"Challenges of Corruption","i":[[2022,"10","Whistle blower, who reports corruption and illegal activities, wrongdoing and misconduct to the concerned authorities, runs the risk of being exposed to grave danger, physical harm and victimization by the vested interests, accused persons and his team. What policy measures would you suggest to strengthen protection mechanism to safeguard the whistle blower?"],[2014,"10","It is often said that poverty leads to corruption. However, there is no dearth of instances where affluent and powerful people indulge in corruption in a big way. What are the basic causes of corruption among people? Support your answer with examples."]]},{"s":"GS4 · Ethics","n":"Citizen’s Charter","i":[[2019,"10","Explain the basic principles of citizens’ charter movement and bring out its impor- tance."]]},{"s":"GS4 · Ethics","n":"Codes of Ethics and Codes of Conduct","i":[[2024,"10","The ‘Code of Conduct and ‘Code of Ethics’ are the sources of guidance in public administration. There is code of conduct already in operation, whereas code of ethics is not yet put in place. Suggest a suitable mode. for code of ethics to maintain integrity, probity and transparency. governance."],[2018,"10","Distinguish between “Code of ethics” and “Code of conduct” with suitable exam- ples."],[2016,"10","Discuss the Public Services Code as recommended by the 2nd Administrative Re- forms Commission."]]},{"s":"GS4 · Ethics","n":"Work Culture","i":[[2025,"10","It is said that for an ethical work culture, there must be code of ethics in place in ev- ery organisation. To ensure value-based and compliance-based work culture, what suitable measures would you adopt in your work place?"]]},{"s":"GS4 · Ethics","n":"Transparency X RTI","i":[[2019,"10","There is a view that the official secrets act is an obstacle to the implementation of the Rights to Information act. Do you agree with the view? Discuss"],[2018,"10","The Right to Information Act is not all about citizens’ empowerment alone, it essen- tially redefines the concept of accountability. Discuss."],[2015,"10","Some recent developments such as introduction of RTI Act, media and judicial ac- tivism, etc., are proving helpful in bringing about greater transparency and account- ability in the functioning of the government. However, it is also being observed that at times the mechanisms are misused. Another negative effect is that the officers are now afraid to take prompt decisions. Analyze this situation in detail and suggest how this dichotomy can be resolved. Suggest how these negative impacts can be minimized."],[2015,"10","Today we find that in spite of various measures like prescribing codes of conduct, setting up vigilance cells/commissions, RTI, active media and strengthening of legal mechanisms, corrupt practices are not coming under control. A) Evaluate the effec- tiveness of these measures with justifications. B) Suggest more effective strategies to tackle this menace."]]},{"s":"GS4 · Ethics","n":"Probity in Governance","i":[[2024,"10","“In Indian culture and value system, an equal opportunity has been provided irrespective of gender identity. The number of women in public service has been steadily increasing over the years.” Examine the gender specific challenges faced by female public servants and suggest to increase their efficiency in discharging their duties and maintaining high standards of probity."],[2023,"10","‘Probity is essential for an effective system of governance and socio-economic devel- opment.’ Discuss."],[2019,"10","What do you understand by probity in governance? Based on your understanding of the term, suggest measures for ensuring probity in government."],[2014,"10","What do you understand by ‘probity’ in public life? What are the difficulties in prac- ticing it in the present times? How can these difficulties be overcome?"]]},{"s":"GS4 · Ethics","n":"Utilization of public funds","i":[[2025,"10","India is an emerging economic power of the world as it has recently secured the status of fourth largest economy of the world as per IMF projection. However, it has been observed that in some sectors, allocated funds remain either under-utilised or misutilised. What specific measures would you recommend for ensuring account- ability in this regard to stop leakages and gaining the status of third largest economy of the world in near future?"],[2019,"10","Effective utilisation of public funds is crucial to meet development goals. Critically examine the reasons for under-utilization and mis-utilisation of public funds and their implications."],[2014,"10","There is a heavy ethical responsibility on the public servants because they occupy positions of power, handle huge amounts of public funds, and their decisions have wide-ranging impact on society and environment. What steps have you taken to improve your ethical competence to handle such responsibility?"]]},{"s":"GS4 · Ethics","n":"Quality of Service Delivery","i":[[2024,"10","Mission Karmayogi is aiming for maintaining a very high standard of conduct and behaviour to ensure efficiency for serving citizens and in developing oneself. How will this scheme empower the civil servants in enhancing productive efficiency and delivering the services at the grassroots level?"],[2022,"10","Wisdom lies in knowing what to reckon with and what to overlook. An officer being engrossed with the periphery, ignoring the core issues before him, is no rare in the bureaucracy. Do you agree that such preoccupation of an administrator leads to travesty of justice to the cause of effective service delivery and good governance? Critically evaluate."]]}]},{"key":"SOC","label":"Sociology subthemes","g":[{"s":"Sociology P1 · 1. Modernity and social changes in Europe and emergence of sociology.","n":"Historical Antecedents and Emergence of Sociology","i":[[2019,"P1 Q1a","Discuss the historical antecedents of the emergence of Sociology as a discipline."]]},{"s":"Sociology P1 · 1. Modernity and social changes in Europe and emergence of sociology.","n":"Enlightenment, Renaissance and Intellectual Forces","i":[[2024,"P1 Q2a","Sociology is product of European enlightenment and renaissance. Critically examine this statement."],[2022,"P1 Q2a","What aspects of Enlightenment do you think paved way for the emergence of sociology? Elaborate."],[2020,"P1 Q1a","How did the intellectual forces lead to the emergence of sociology? Discuss."],[2015,"P1 Q3c","How had Enlightenment contributed to the emergence of Sociology?"]]},{"s":"Sociology P1 · 1. Modernity and social changes in Europe and emergence of sociology.","n":"Industrial Revolution and Social Change","i":[[2014,"P1 Q1b","How did the emergence of industrial society change the family life in Western Europe?"]]},{"s":"Sociology P1 · 1. Modernity and social changes in Europe and emergence of sociology.","n":"European Modernity and Emergence of Sociology","i":[[2021,"P1 Q1a","Europe was the first and the only place where modernity emerged. Comment."]]},{"s":"Sociology P1 · 1. Modernity and social changes in Europe and emergence of sociology.","n":"Nature and Reformist Orientation of Sociology","i":[[2013,"P1 Q1a","\"Sociology emerged in Europe and flourished to begin with on social reformist orientation in the USA\" - Comment."],[2013,"P1 Q5b","Define social movement. Elucidate the role of reformist movement in social change."]]},{"s":"Sociology P1 · 2. Scope of the subject and comparison with other social sciences.","n":"Scope and Distinctiveness of Sociology","i":[[2025,"P1 Q5a","In what way is the scope of sociology unique? Explain."]]},{"s":"Sociology P1 · 2. Scope of the subject and comparison with other social sciences.","n":"Sociology and Anthropology","i":[[2024,"P1 Q1a","Discuss the nature of sociology. Highlight its relationship with social anthropology."],[2013,"P1 Q1b","Compare and contrast Sociology with Anthropology?"]]},{"s":"Sociology P1 · 2. Scope of the subject and comparison with other social sciences.","n":"Sociology, History and Biography","i":[[2018,"P1 Q8a","“The sociological imagination enables us to grasp history and biography and the relationship between the two in a society.” – C.W.Mills . Explain."]]},{"s":"Sociology P1 · 2. Scope of the subject and comparison with other social sciences.","n":"Sociology and Psychology","i":[[2014,"P1 Q1c","How is sociological approach to human action different from that of psychological approach?"]]},{"s":"Sociology P1 · 2. Scope of the subject and comparison with other social sciences.","n":"Sociology and Political Science","i":[[2025,"P1 Q6a","What is science? Do you think that the methods used in natural sciences can be applied to sociology? Give reasons for your answer."],[2023,"P1 Q1b","Discuss the relationship between sociology and political science."]]},{"s":"Sociology P1 · 2. Scope of the subject and comparison with other social sciences.","n":"Sociology and Other Social Sciences","i":[[2022,"P1 Q1a","Delimit the scope of Sociology in relation to other social sciences."],[2021,"P1 Q2a","From the viewpoint of growing importance of multidisciplinary, how do you relate sociology to other social sciences?"],[2017,"P1 Q2a","Discuss the changing equations of discipline of sociology with other social sciences."]]},{"s":"Sociology P1 · 3. Sociology and common sense.","n":"Common Sense and Common Knowledge","i":[[2025,"P1 Q1a","1a) What is common sense? How are common knowledge and sociology related to each other? Explain."],[2023,"P1 Q4a","Do you think that common sense is the starting point of social research? What are its advantages and limitations? Explain."],[2021,"P1 Q1b","Do you think ethnomethodology helps us in getting reliable and valid data? Justify your answer."],[2021,"P1 Q2c","How is sociology related to common sense?"],[2018,"P1 Q1a","The focal point of sociology rests on interaction. How do you distinguish it from common sense?"],[2016,"P1 Q2c","Is sociology common sense? Give reasons in support of your argument."]]},{"s":"Sociology P1 · 4. Science, scientific method and critique.","n":"Scientific Method: Postulates and Characteristics","i":[[2023,"P1 Q3a","What are the characteristics of scientific method? Do you think that scientific method in conducting sociological research is foolproof? Elaborate."],[2018,"P1 Q5c","Does scientific method make Sociology a Science? Illustrate your answer with Durkheim's method."],[2016,"P1 Q3b","Describe the basic postulates of scientific method. How far are these followed in sociological research?"]]},{"s":"Sociology P1 · 5. Major theoretical strands of research methodology.","n":"Dramaturgical Perspective","i":[[2023,"P1 Q1c","How does the dramaturgical perspective enable our understanding of everyday life?"]]},{"s":"Sociology P1 · 5. Major theoretical strands of research methodology.","n":"Grounded Theory vs Theory-driven Research","i":[[2023,"P1 Q7a","Explain how economic globalization has brought changes in the patterns of employment in the 21st century."]]},{"s":"Sociology P1 · 6. Positivism and its critique.","n":"Positivism and critique","i":[[2025,"P1 Q2a","What is positivism? Critically analyze the major arguments against it."],[2017,"P1 Q1b","Examine ethnomethodological and phenomenological perspective as critique of positivism."],[2017,"P1 Q2b","Examine the basic postulates of positivism and post-positivism."]]},{"s":"Sociology P1 · 7. Fact value and objectivity.","n":"Objectivity in Sociological Research","i":[[2022,"P1 Q1b","How does a researcher achieve objectivity in interpretative research?"],[2016,"P1 Q4a","Examine Max Weber's method of maintaining objectivity in social research."]]},{"s":"Sociology P1 · 7. Fact value and objectivity.","n":"Value-free Sociology and Value Neutrality","i":[[2020,"P1 Q1b","Is sociology a value-free science? Discuss."],[2016,"P1 Q1b","What is 'value-free sociology\"? Clarify."],[2015,"P1 Q2b","Examine the problems of maintaining objectivity and value neutrality in Social Science research."],[2014,"P1 Q1a","How is objectivity different from value neutrality? Discuss with reference to Weber’s views on methodology."]]},{"s":"Sociology P1 · 7. Fact value and objectivity.","n":"Fact and Value","i":[[2024,"P1 Q5a","Describe various characteristics of a ‘social fact’. How is rate of suicide a social fact according to Durkheim?"],[2015,"P1 Q6a","“Education helps in perpetuating social and economic inequalities.” Critically examine the statement."]]},{"s":"Sociology P1 · 8. Non-positivist methodologies.","n":"Non-positivist Methodology","i":[[2024,"P1 Q2b","Do you think objectivity is an overhyped idea in sociological research? Discuss the merits and demerits of non-positivist methods."],[2022,"P1 Q3a","What are the shortfalls of positivist philosophy that gave rise to the nonpositivist methods of studying social reality?"],[2018,"P1 Q2a","Is non-positivistic methodology scientific? Illustrate."],[2015,"P1 Q4a","Non-positivistic methodology is essential for understanding human behaviour.” Discuss"]]},{"s":"Sociology P1 · 8. Non-positivist methodologies.","n":"Phenomenology","i":[[2020,"P1 Q7b","Phenomenological perspectives in sociology reject many of the assumptions of positivism. Comment."]]},{"s":"Sociology P1 · 8. Non-positivist methodologies.","n":"Positivist Approach to Social Reality","i":[[2022,"P1 Q1d","Durkheim argued that society is more than the sum of individual acts. Discuss"],[2021,"P1 Q2b","How far are sociologists justified in using positivist approach to understand social reality? Explain with suitable illustrations."],[2014,"P1 Q4b","In what way 'Interpretative' method different from 'positivist' approach in the study of social phenomena."]]},{"s":"Sociology P1 · 9. Qualitative and quantitative methods.","n":"Qualitative Methods","i":[[2023,"P1 Q6a","What are the different dimensions of qualitative method? Do you think that qualitative methods help to gain a deeper sociological insight? Give reasons for your answer."],[2018,"P1 Q5d","Distinguish between qualitative techniques of data collection with suitable examples from Indian society."],[2017,"P1 Q3c","Examine epistemological foundations of qualitative methods of social research."],[2016,"P1 Q1c","Analyze the importance of qualitative method in social research."]]},{"s":"Sociology P1 · 9. Qualitative and quantitative methods.","n":"Quantitative Methods","i":[[2021,"P1 Q3a","How do qualitative and quantitative methods supplement each other in sociological enquiry?"],[2013,"P1 Q1c","Critically examine positivistic approach in sociological studies."],[2013,"P1 Q2a","Analyse the limitations of quantitative methods in social research."]]},{"s":"Sociology P1 · 9. Qualitative and quantitative methods.","n":"Census Method","i":[[2021,"P1 Q1c","Discuss the challenges involved in collecting data through census method."]]},{"s":"Sociology P1 · 9. Qualitative and quantitative methods.","n":"Digital/Visual/Feminist Methods","i":[[2023,"P1 Q1a","What is the distinctiveness of the feminist method of Social research. Comment."]]},{"s":"Sociology P1 · 9. Qualitative and quantitative methods.","n":"Mixed Methods","i":[[2024,"P1 Q4a","What do you understand be ‘Mixed method’? Discuss its strengths and limitations in Social research."]]},{"s":"Sociology P1 · 9. Qualitative and quantitative methods.","n":"Research Design","i":[[2018,"P1 Q6c","Explain with examples, the explanatory and exploratory designs of social researc function overview(){const subs=[...new Set(SRC[scope.src].g.map(g=>g.s))],cs=cards(),n=cs.length,seen=cs.filter(c=>c.st).length,dd=cs.filter(due).length,weak=cs.filter(c=>c.st&&c.st.s!='got');
 $('app').innerHTML=`<div class="card"><h3>Active recall</h3><p class="meta">Try to recall before you look. For a <b>subject card</b> name every microtheme under it; for a <b>microtheme card</b> say which topics and question types have been asked. Then reveal, compare, and rate yourself. Cards you miss come back sooner.</p>
 <div class="fl"><select id="rs">${SRC.map((s,i)=>`<option value="${i}" ${i==scope.src?'selected':''}>${esc(s.label)}</option>`).join('')}</select>
 <select id="rsub"><option value="">All subjects</option>${subs.map(s=>`<option ${s==scope.sub?'selected':''}>${esc(s)}</option>`).join('')}</select>
 <select id="rm"><option value="micro" ${scope.mode=='micro'?'selected':''}>Microtheme cards</option><option value="subj" ${scope.mode=='subj'?'selected':''}>Subject cards (list the microthemes)</option></select>
 <label>Cards</label><input id="rn" type="number" min="1" max="100" value="10" style="width:60px"><button class="p" id="rgo">Start session</button></div>
 <div class="meta" style="margin-top:8px">${n} cards in scope · ${seen} reviewed · ${dd} due today</div><div class="bar"><i style="width:${n?seen/n*100:0}%;background:var(--g3)"></i></div></div>
 <div class="card"><h3>Needs another look (${weak.length})</h3>${weak.length?weak.slice(0,40).map(c=>`<div class="srow" style="display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--bd)"><span style="flex:1">${esc(c.title)} <span class="meta">${esc(c.sub||'')}</span></span><span class="${c.st.s=='missed'?'red':'amb'}">${c.st.s}</span><span class="meta">due ${c.st.due}</span></div>`).join(''):'<span class="meta">Nothing yet. Start a session.</span>'}</div>`;
 const q=(id,f)=>{const e=$(id);if(e)e.onchange=f};q('rs',e=>{scope.src=+e.target.value;scope.sub='';overview()});q('rsub',e=>{scope.sub=e.target.value;overview()});q('rm',e=>{scope.mode=e.target.value;overview()});
 $('rgo').onclick=()=>{const cs=cards(),n=Math.max(1,+$('rn').value||10),pri=c=>!c.st?1:due(c)?0:2;const q=cs.slice().sort(()=>Math.random()-.5).sort((a,b)=>pri(a)-pri(b)).filter(c=>!c.st||due(c)||true).slice(0,n);if(!q.length)return;SES={q,k:0,rev:false,done:0};card()}}
function items(c){const s=SRC[c.src];if(c.type=='micro')return s.g[c.gi].i.map(it=>s.key=='PRE'?`<div style="margin:8px 0"><span class="meta">${it[0]}</span> ${esc(it[1])}${it[2]?`<div class="grn">Answer: ${esc(it[2])}</div>`:''}</div>`:`<div style="margin:8px 0"><span class="meta">${it[0]} · ${esc(it[1])}</span> ${esc(it[2])}</div>`).join('')||'<span class="meta">No questions.</span>';
 const gs=s.g.filter(g=>g.s==c.sub);return gs.map(g=>{const r=RC[`RC|${s.key}|${s.g.indexOf(g)}`];return `<div>• ${esc(g.n)} <span class="meta">(${g.i.length} Q${r?' · '+r.s:''})</span></div>`}).join('')}
function card(){const S_=SES;if(S_.k>=S_.q.length){$('app').innerHTML=`<div class="card"><h3>Session complete</h3><p>${S_.done} cards reviewed.</p><button class="p" id="rback">Back</button></div>`;$('rback').onclick=()=>{SES=null;overview()};return}
 const c=S_.q[S_.k],micro=c.type=='micro';
 $('app').innerHTML=`<div class="card"><div class="meta">Card ${S_.k+1} / ${S_.q.length} · ${esc(SRC[c.src].label)} ${c.st?'· last: '+c.st.s:'· new'}</div><h3 style="font-size:20px;margin-top:6px">${esc(c.title)}</h3><div class="meta">${micro?esc(c.sub):'Subject'}</div>
 <p>${micro?'What topics and dimensions were asked here? Which kinds of questions have appeared?':'Name every microtheme under this subject.'}</p><textarea id="rt" rows="5" style="width:100%" placeholder="Write or say it aloud first…"></textarea>
 <div class="row"><button class="p" id="rv">Reveal</button><button id="rsk">Skip</button><button id="rend">End</button></div><div id="ra"></div></div>`;
 $('rv').onclick=()=>{$('ra').innerHTML=`<h3>${micro?'Questions asked':'Microthemes'}</h3>${items(c)}<div class="row"><button id="r0">✗ Missed</button><button id="r1">~ Partly</button><button id="r2" class="p">✓ Got it</button></div>`;
  [['r0','missed'],['r1','partly'],['r2','got']].forEach(([id,v])=>$(id).onclick=()=>{rate(c,v);S_.done++;S_.k++;card()})};
 $('rsk').onclick=()=>{S_.k++;card()};$('rend').onclick=()=>{SES=null;overview()}}
function apply(by){RC={};by.Recall.forEach(x=>{const m=unmeta(x.file);RC[x.id]={s:x.status,box:+m.box||0,due:m.due||'',n:+x.page||0,d:x.date||''}});ST('rc-state',RC);if(!SES)overview()}
function seed(){return Object.keys(RC).map(id=>['Recall',opOf(id)])}
$('stats').innerHTML='';overview();SYNC.init({key:'rc',tabs:['Recall'],apply,seed});
</script></body></html>
