bes & Related Issues","i":[[2025,"15","Does tribal development in India centre around two axes, those of displacement and of rehabilitation? Give your opinion."],[2022,"10","Given the diversities among tribal communities in India, in which specific contexts should they be considered as a single category ?"],[2021,"10","Examine the uniqueness of tribal knowledge system when compared with main- stream knowledge and cultural systems."],[2015,"12.5","How do you explain the statistics that show that the sex ratio in Tribes in India is more favourable to women than the sex ratio among Scheduled Castes?"]]},{"s":"GS1 · Society","n":"Family","i":[[2024,"10","Intercaste marriages between castes which have socio-economic parity have in- creased, to some extent, but this is less true of interreligious marriages. Discuss."],[2023,"10","Child cuddling is now being replaced by mobile phones. Discuss its impact on the socialization of children."],[2023,"10","Do you think marriage as a sacrament in losing its value in Modern India?"],[2022,"10","Explore and evaluate the impact of ‘Work From Home’ on family relationships."],[2014,"10","The life cycle of a joint family depends on economic factors rather than social values. Discuss."]]},{"s":"GS1 · Society","n":"Uniqueness of Indian society","i":[[2021,"15","How does Indian society maintain continuity in traditional social values? Enumerate the changes taking place in it."],[2019,"10","What makes Indian society unique in sustaining its culture? Discuss."],[2017,"15","The spirit tolerance and love is not only an interesting feature of Indian society from very early times, but it is also playing an important part at the present. Elaborate."]]},{"s":"GS1 · Society","n":"Population and associated issues","i":[[2024,"10","What is the concept of a ‘demographic winter’? Is the world moving towards such a situation? Elaborate."],[2023,"15","Why did human development fail to keep pace with economic development in India?"],[2021,"15","Discuss t duced in the domain of Centre-State relations? Suggest measures to be adopted to build the trust between the Centre and the States and for strengthening federalism."],[2023,"15","Explain the significance of the 101st Constitutional Amendment Act. To what extent does it reflect the accommodative spirit of federalism?"],[2020,"15","Indian Constitution exhibits centralising tendencies to maintain unity and integrity of the nation. Elucidate in the perspective of the Epidemic Diseases Act, 1897; The Disaster Management Act, 2005 and recently passed Farm Acts."],[2020,"10","How far do you think cooperation, competition and confrontation have shaped the nature of federation in India? Cite some recent examples to validate your answer."],[2019,"10","From the resolution of contentious issues regarding distribution of legislative pow- ers by the courts, ‘Principle of Federal Supremacy’ and ‘Harmonious Construction’ have emerged. Explain."],[2015,"12.5","The concept of cooperative federalism has been increasingly emphasized in recent years. Highlight the drawbacks in the existing structure and the extent to which cooperative federalism would answer the shortcomings."],[2014,"12.5","Though the federal principle is dominant in our Constitution and that principle is one of its basic features, but it is equally true that federalism under the Indian Constitution leans in favour of a strong Centre, a feature that militates against the concept of strong federalism. Discuss."],[2013,"10","Constitutional mechanisms to resolve the inter-state water disputes have failed to address and solve the problems. Is the failure due to structural or process inadequa- cy or both? Discuss."],[2013,"10","Many State Governments further bifurcate geographical administrative areas like Districts and Talukas for better governance. In light of the above, can it also be justified that more number of smaller States would bring in effective governance at State level? Discuss."]]},{"s":"GS2 · Polity","n":"Union Territory","i":[[2025,"10","Discuss the nature of Jammu and Kashmir Legislative Assembly after the Jammu and Kashmir Reorganization Act, 2019. Briefly describe the powers and functions of the Assembly of the Union Territory of Jammu and Kashmir."],[2016,"12.5","Discuss the essentials of the 69th Constitutional Amendment Act and anomalies, if any that have led to recent reported conflicts between the elected representatives and the institution of the Lieutenant Governor in the administration of Delhi. Do you think that this will give rise to a new trend in the functioning of Indian federal politics?"]]},{"s":"GS2 · Polity","n":"Executive Vs Judiciary","i":[[2017,"10","Critically examine the Supreme Court’s judgement on ‘National Judicial Appoint- ments Commission Act, 2014’ with reference to appointment of judges of higher judiciary in India."]]},{"s":"GS2 · Polity","n":"Judiciary Vs Legislature","i":[[2020,"15","Judicial Legislation is antithetical to the doctrine of separation of powers as envis- aged in the Indian Constitution. In this context justify the filing of large number of public interest petitions praying for issuing guidelines to executive authorities."],[2013,"10","The Supreme Court of India keeps a check on arbitrary power of the Parliament in amending the Constitution. Discuss critically."]]},{"s":"GS2 · Polity","n":"Executive Vs Legislature","i":[[2024,"10","“The growth of cabinet system has practically resulted in the marginalisation of the parliamentary supremacy.” Elucidate."],[2022,"15","Discuss the essential conditions for exercise of the legislative powers by the Gover- nor. Discuss the legality of re-promulgation of ordinances by the Governor without placing them before the Legislature."],[2021,"10","To what extent, in your view, the Parliament is able to ensure accountability of the executive in India?"],[2018,"15","Whether the Supreme Court Judgement (July 2018) can settle the political tussle between the Lt. Governor and elected government of Delhi? Examine."],[2015,"12.5","Resorting to ordinances has always raised concern on violation of the spirit of separation of powers doctrine. While noting the rationales justifying the power to promulgate ordinances, analyze whether the decisions of the Supreme Court on the issue have further facilitated resorting to this power. Should the power to promul- gate ordinances be repealed?"]]},{"s":"GS2 · Polity","n":"Separation of Powers","i":[[2023,"10","“Constitutionally guaranteed judicial independence is a prerequisite of democracy”. Comment."],[2019,"10","Do you think that constitution of India does not accept principle of strict separation of powers rather it is based on the principle of ‘checks and balance’? Explain."]]},{"s":"GS2 · Polity","n":"Local Self Government","i":[[2024,"10","Analyse the role of local bodies in providing good governance at local level and bring out the pros and cons merging the rural local bodies with the urban local bodies."],[2023,"10","“The states in India seem reluctant to empower urban local bodies both functionally as well as financially.” Comment."],[2022,"10","To what extent, in your opinion, has the decentralisation of power in India changed the governance landscape at the grassroots ?"],[2020,"15","The strength and sustenance of local institutions in India has shifted from their formative phase of ‘Functions, Functionaries and Funds’ to the contemporary stage of ‘Functionality’. Highlight the critical challenges faced by local institutions in terms of their functionality in recent times."],[2019,"15","“The reservation of seats for women in the institutions of local self- government has had a limited impact on the patriarchal character of the Indian Political Process.” Comment."],[2018,"15","Assess the importance of Panchayat system in India as a part of local government. Apart from government grants, what sources the Panchayats can look out for financ- ing developmental projects."],[2017,"10","“The local self-government system in India has not proved to be effective instru- ment of governance”. Critically examine the statement and give your views to improve the situation."],[2015,"12.5","In absence of a well-educated and organized local level government system, `Pan- chayats’ and ‘Samitis’ have remained mainly political institutions and not effective instruments of governance. Critically discuss."]]},{"s":"GS2 · Polity","n":"Constitutional Comparison","i":[[2025,"10","Compare and contrast the President’s power to pardon in India and in the USA. Are there any limits to it in both the countries? What are ‘preemptive pardons’?"],[2025,"15","Discuss the evolution of collegium system in India. Critically examine the advantag- es and disadvantages of the system on appointment of the Judges of the Supreme Court of India and that of the USA."],[2024,"15","Discuss India as a secular state and compare with the secular principles of the US constitution"],[2023,"10","Compare and contrast the British and Indian approaches to Parliamentary sover- eignty."],[2022,"15","Critically examine the procedures through which the Presidents of India and France are elected."],[2021,"15","Analyze the distinguishing features of the notion of Right to Equality in the Constitu- tions of the USA and India."],[2020,"10","The judicial systems in India and UK seem to be converging as well as diverging in recent times. Highlight the key points of convergence and divergence between the two nations in terms of their judicial practices."],[2019,"10","What can France learn from the Indian Constitution’s approach to secularism?"],[2018,"15","India and USA are two large democracies. Examine the basic tenants on which the two political systems are based."]]},{"s":"GS2 · Polity","n":"Bicameralism","i":[[2021,"15","Explain the constitutional provisions under which Legislative Councils are estab- lished. Review the working and current status of Legislative Councils with suitable illustrations."],[2021,"15","Explain the constitutional provisions under which Legislative Councils are estab- lished. Review the working and current status of Legislative Councils with suitable illustrations."],[2020,"15","Rajya Sabha has been transformed from a ‘useless stepney tyre’ to the most useful supporting organ in past few decades. Highlight the factors as well as the areas in which this transformation could be visible."],[2017,"15","The Indian Constitution has provisions for holding joint session of the two houses of the Parliament. Enumerate the occasions when this would normally happen and also the occasions when it cannot, with reasons thereof."]]},{"s":"GS2 · Polity","n":"Parliamentary Committees","i":[[2023,"15","Explain the structure of the Parliamentary Committee system. How far have the financial committees helped in the institutionalization of Indian Parliament?"],[2021,"15","Do Department-related Parliamentary Standing Committees keep the administration on its toes and inspire reverence for parliamentary control? Evaluate the working of such committees with suitable examples."],[2018,"10","Why do you think the committees are considered to be useful for parliamentary work? Discuss, in this context, the role or the Estimates Committee."],[2017,"10","Discuss the role of Public Accounts Committee in establishing accountability of the government to the people."]]},{"s":"GS2 · Polity","n":"Parliamentary Privileges","i":[[2014,"12.5","The ‘Powers, Privileges and Immunities of Parliament and its Members’ as envisaged in Article 105 of the Constitution leave room for a large number of un-codified and un-enumerated privileges to continue. Assess the reasons for the absence of legal codification of the ‘parliamentary privileges’. How can this problem be addressed?"]]},{"s":"GS2 · Polity","n":"Presiding Officers","i":[[2023,"10","Discuss the role of Presiding Officers of state legislatures in maintaining order and impartiality in conducting legislative work and in facilitating best democratic practic- es."],[2022,"10","Discuss the role of the Vice-President of India as the Chairman of the Rajya Sabha."],[2020,"10","‘Once a Speaker, Always a Speaker’! Do you think this practice should be adopted to impart objectivity to the office of the Speaker of Lok Sabha? What could be its implications for the robust functioning of parliamentary business in India?"]]},{"s":"GS2 · Polity","n":"Role of MPs","i":[[2019,"15","Individual Parliamentarian’s role as the national lawmaker is on a decline, which in turn, has adversely impacted the quality of debates and their outcome. Discuss."],[2013,"10","The role of individual MPs (Members of Parliament) has diminished over the years and as a result healthy constructive debates on policy issues are not usually wit- nessed. How far can this be attributed to the anti-defection law, which was legislat- ed but with a different intention?"]]},{"s":"GS2 · Polity","n":"Alternate Dispute Resolution","i":[[2024,"10","Explain and distinguish between Lok Adalats and Arbitration Tribunals. Whether they entertain civil as well as criminal cases ?"],[2023,"10","Who are entitled to receive free legal aid? Assess the role of the National Legal Services Authority(NALSA) in rendering free legal aid in India."],[2015,"12.5","What are the major changes brought in the Arbitration and Conciliation Act, 1996 through the recent Ordinance promulgated by the President? How far will it im- prove India’s dispute resolution mechanism? Discuss."]]},{"s":"GS2 · Polity","n":"Informal associations and their role in polity","i":[[2015,"12.5","Khap Panchayats have been in the news for functioning as extra-constitutional authorities, often delivering pronouncements amounting to human rights violations. Discuss critically the actions taken by the legislative, executive and the judiciary to set the things right in this regard."]]},{"s":"GS2 · Polity","n":"Judiciary","i":[[2024,"15","Explain the reasons for the growth of public interest litigation in India. As a result of it, has the Indian Supreme Court emerged as the world’s most powerful judiciary?"],[2021,"10","Discuss the desirability of greater representation to women in the higher judiciary to ensure diversity, equity and inclusiveness."],[2014,"12.5","Starting from inventing the ‘basic structure’ doctrine, the judiciary has played a high- ly proactive role in ensuring that India develops into a thriving democracy. In light of the statement, evaluate the role played by judicial activism in achieving the ideals of democracy."]]},{"s":"GS2 · Polity","n":"Pressure Groups","i":[[2025,"15","What are environmental pressure groups? Discuss their role in raising awareness, influencing policies and advocating for environmental protection in India."],[2021,"10","“Pressure groups play a vital role in influencing public policy making in India.” Explain how the business associations contribute to public policies."],[2019,"10","What are the methods used by the Farmers organizations to influence the policy- makers in India and how effective are these methods?"],[2017,"10","How do pressure groups influence Indian political process? Do you agree with this view that informal pressure groups have emerged as powerful than formal pressure groups in recent years?"],[2013,"10","Pressure group politics is sometimes seen as the informal face of politics. With re- gards to the above, assess the structure and functioning of pressure groups in India."]]},{"s":"GS2 · Polity","n":"Tribunal","i":[[2025,"10","Comment on the need of administrative tribunals as compared to the court system. Assess the impact of the recent tribal reforms through rationalization of tribunals made in 2021."]]},{"s":"GS2 · Polity","n":"Union Executive","i":[[2025,"10","The Attorney General of India plays a crucial role in guiding the legal framework of the Union Government and ensuring sound governance through legal counsel.” Discuss his responsibilities, rights and limitations in this regard."],[2019,"15","“The Attorney-General is the chief legal adviser and lawyer of the Government of India.” Discuss."],[2014,"12.5","Instances of President’s delay in commuting death sentences has come under public debate as denial of justice. Should there be a time limit specified for the President to accept/reject such petitions? Analyse."],[2014,"12.5","The size of the cabinet should be as big as governmental work justifies and as big as the Prime Minister can manage as a team. How far the efficacy of a government then is inversely related to the size of the cabinet? Discuss."]]},{"s":"GS2 · Polity","n":"Election Dispute and Dis- qualification","i":[[2025,"10","Discuss the ‘corrupt practices’ for the purpose of the Representation of the People Act, 1951. Analyze whether the increase in the assets of the legislators and/or their associates, disproportionate to their known sources of income, would constitute ‘undue influence’ and consequently a corrupt practice."],[2022,"15","Discuss the procedures to decide the disputes arising out of the election of a Mem- ber of the Parliament or State Legislature under The Representation of the People Act, 1951. What are the grounds on which the election of any returned candidate may be declared void? What remedy is available to the aggrieved party against the decision? Refer to the case laws."],[2020,"10","“There is a need for simplification of procedure for disqualification of persons found guilty of corrupt practices under the Representation of Peoples Act”. Comment."],[2019,"15","On what grounds a people’s representative can be disqualified under the Repre- sentation of People Act, 1951? Also mention the remedies available to such person against his disqualification."]]},{"s":"GS2 · Polity","n":"Electoral reforms","i":[[2024,"10","Examine the need for electoral reforms as suggested by various committees with particular reference to “one nation-one election” principle."],[2018,"10","In the light of recent controversy regarding the use of Electronic Voting Machines (EVM), what are the challenges before the Election Commission of India to ensure the trustworthiness of elections in India?"],[2017,"15","To enhance the quality of democracy in India the Election Commission of India has proposed electoral reforms in 2016. What are the suggested reforms and how far are they significant to make democracy successful?"],[2017,"10","‘Simultaneous election to the Lok Sabha and the State Assemblies will limit the amount of time and money spent in electioneering but it will reduce the govern- ment’s accountability to the people’ Discuss."]]},{"s":"GS2 · Polity","n":"MCC","i":[[2022,"15","Discuss the role of the Election Commission of India in the light of the evolution of the Model Code of Conduct."]]},{"s":"GS2 · Polity","n":"Political Parties","i":[[2022,"15","While the national political parties in India favour centralisation, the regional parties are in favour of State autonomy. Comment."],[2016,"12.5","The Indian party system is passing through a phase of transition which looks to be full of contradictions and paradoxes.” Discuss."]]},{"s":"GS2 · Governance","n":"Constitutional Bodies","i":[[2024,"10","“The duty of the Comptroller and Auditor General is not merely to ensure the legali- ty of expenditure but also its propriety.” Comment."],[2022,"10","Discuss the role of the National Commission for Backward Classes in the wake of its transformation from a statutory body to a constitutional body."],[2021,"10","How have the recommendations of the 14th Finance Commission of India enabled the States to improve their fiscal position?"],[2018,"15","How is the Finance Commission of India constituted? What do you about the terms of reference of the recently constituted Finance Commission? Discuss."],[2018,"10","The Comptroller and Auditor General (CAG) has a very vital role to play. Explain how this is reflected in the method and terms of his appointment as well as the range of powers he can exercise."],[2018,"10","Whether National Commission for Scheduled Castes (NCSC) can enforce the imple- mentation of constitutional reservation for the Scheduled Castes in the religious minority institutions? Examine."],[2016,"12.5","Exercise of CAG’s powers in relation to the accounts of the Union and the States is derived from Article 149 of the Indian Constitution. Discuss whether audit of the Government’s Policy implementation could amount to overstepping its own (CAG) jurisdiction."],[2013,"10","Discuss the recommendations of the 13th Finance Commission which have been a departure from the previous commissions for strengthening the local government finances."]]},{"s":"GS2 · Governance","n":"Enforcement Agencies","i":[[2021,"15","The jurisdiction of the Central Bureau of Investigation (CBI) regarding lodging an FIR and conducting probe within a particular State is being questioned by various States. However, the power of the States to withhold consent to the CBI is not absolute. Explain with special reference to the federal character of India."]]},{"s":"GS2 · Governance","n":"Quasi judicial Bodies","i":[[2019,"10","“The Central Administration Tribunal which was established for redressal of griev- ances and complaints by or against central government employees, nowadays is exercising its powers as an independent judicial authority.” Explain."],[2018,"15","How far do you agree with the view that tribunals curtail the jurisdiction of ordinary courts? In view of the above, discuss the constitutional validity and competency of the tribunals in India."],[2016,"12.5","What is a quasi-judicial body? Explain with the help of concrete examples."]]},{"s":"GS2 · Governance","n":"Sectoral Regulatory Bodies","i":[[2015,"12.5","For achieving the desired objectives, it is necessary to ensure that the regulatory institutions remain independent and autonomous. Discuss in the light of the experi- ences in recent past."],[2014,"12.5","The setting up of a Rail Tariff Authority to regulate fares will subject the cash strapped Indian Railways to demand subsidy for obligation to operate non-profitable routes and services. Taking into account the experience in the power sector, discuss if the proposed reform is expected to benefit the consumers, the Indian Railways or the private container operators."],[2013,"10","The product diversification of financial institutions and insurance companies, result- ing in overlapping of products and services strengthens the case for the merger of the two regulatory agencies, namely SEBI and IRDA. Justify."]]},{"s":"GS2 · Governance","n":"Statutory Bodies","i":[[2025,"15","The National Commission for Protection of Child Rights has to address the chal- lenges faced by children in the digital era. Examine the existing policies and suggest measures the Commission can initiate to tackle the issue."],[2023,"10","Discuss the role of the Competition Commission of India in containing the abuse of dominant position by the Multi-National Corporations in India. Refer to the recent decisions."],[2021,"15","Though the Human Rights Commissions have contributed immensely to the protec- tion of human rights in India, yet they have failed to assert themselves against the mighty and powerful. Analyzing their structural and practical limitations, suggest remedial measures."],[2020,"15","Which steps are required for constitutionalization of a Commission? Do you think imparting constitutionality to the National Commission for Women would ensure greater gender justice and empowerment in India? Give reasons."],[2018,"15","Multiplicity of various commissions for the vulnerable sections or the society leads to problems or overlapping jurisdiction and duplication of functions. Is it better to merge all commissions into an umbrella Human Rights Commission? Argue your case."],[2017,"15","Is the National Commission for Women able to strategize and tackle the problems that women face at both public and private spheres? Give reasons in support of your answer."],[2014,"12.5","National Human Rights Commission (NHRC) in India can be most effective when its tasks are adequately supported by other mechanisms that ensure the accountabil- ity of a government. In light of the above observation assess the role of NHRC as an effective complement to the judiciary and other institutions in promoting and protecting human rights standards."],[2013,"10","‘A national Lokpal, however strong it may be, cannot resolve the problems of immo- rality in public affairs’. Discuss."]]},{"s":"GS2 · Governance","n":"Government Schemes and Policies","i":[[2022,"10","The Gati-Shakti Yojana needs meticulous coordination between the government and the private sector to achieve the goal of connectivity. Discuss."],[2014,"12.5","Two parallel run schemes of the Government viz. the Adhaar Card and NPR, one as voluntary and the other as compulsory, have led to debates at national levels and also litigations. On merits, discuss whether or not both schemes need run concur- rently. Analyse the potential of the schemes to achieve developmental benefits and equitable growth."],[2013,"10","The basis of providing urban amenities in rural areas (PURA) is rooted in establishing connectivity. Comment."]]},{"s":"GS2 · Governance","n":"Structural reforms and Actions","i":[[2025,"15","“In contemporary development models, decision-making and problem-solving responsibilities are not located close to the source of information and execution, defeating the objectives of development.” Critically evaluate."],[2019,"15","‘In the context of neo-liberal paradigm of development planning, multi-level plan- ning is expected to make operations cost effective and remove many implementa- tion blockages.’-Discuss."],[2019,"15","The need for cooperation among various service sector has been an inherent component of development discourse. Partnership bridges bring the gap among the sectors. It also sets in motion a culture of ‘Collaboration’ and ‘team spirit’. In the light of statements above examine India’s Development process."],[2018,"10","Policy contradictions among various competing sectors and stakeholders have resulted in inadequate ‘protection and prevention of degradation’ to environment. “ Comment with relevant illustration."],[2016,"12.5","Has the Indian governmental system responded adequately to the demands of Liberalization, Privatization and Globalization started in 1991? What can the govern- ment do to be responsive to this important change?"],[2014,"12.5","Though 100 percent FDI is already allowed in non-news media like a trade publica- tion and general entertainment channel, the Government is mulling over the pro- posal for increased FDI in news media for quite some time. What difference would an increase in FDI make? Critically evaluate the pros and cons."]]},{"s":"GS2 · Governance","n":"Civil Society","i":[[2025,"10","Civil Society Organizations are often perceived as being anti-State actors rather than non-State actors. Do you agree? Justify."],[2023,"15","Discuss the contribution of civil society groups for women’s effective and meaningful participation and representation in state legislatures in India."],[2021,"15","Can Civil Society and Non-Governmental Organizations present an alternative model of public service delivery to benefit the common citizen? Discuss the challenges of this alternative model."],[2016,"12.5","In the Indian governance system, the role of non-state actors has been only margin- al. Critically examine this statement."],[2015,"12.5","Examine critically the recent changes in the rules governing foreign funding of NGOs under the Foreign Contribution (Regulation) Act (FCRA), 1976."],[2015,"12.5","How can the role of NGOs be strengthened in India for development works relating to protection of the environment? Discuss throwing light on the major constraints."]]},{"s":"GS2 · Governance","n":"Donor Agencies","i":[[2024,"10","Public charitable trusts have the potential to make India’s development more inclu- sive as they relate to certain vital public issues. Comment."],[2022,"15","Do you agree with the view that increasing dependence on donor agencies for de- velopment reduces the importance of community participation in the development process ? Justify your answer."]]},{"s":"GS2 · Governance","n":"SHGs","i":[[2021,"10","Can the vicious cycle of gender inequality, poverty and malnutrition be broken through microfinancing of women SHGs? Explain with examples."],[2020,"15","“Micro-Finance as an anti-poverty vaccine, is aimed at asset creation and income security of the rural poor in India”. Evaluate the role of Self Help Groups in achieving the twin objectives along with empowering women in rural India."],[2017,"15","‘The emergence of Self Help Groups(SHGs) in contemporary times points to the slow but steady withdrawal of the state from developmental activities’. Examine the role of the SHGs in developmental activities and the measures taken by the Govern- ment of India to promote the SHGs."],[2015,"12.5","The Self-Help Group (SHG) Bank Linkage Programme (SBLP), which is India’s own in- novation, has proved to be one of the most effective poverty alleviation and women empowerment programmes. Elucidate."],[2014,"12.5","The penetration of Self Help Groups (SHGs) in rural areas in promoting participation in development programmes is facing socio-cultural hurdles. Examine."],[2013,"10","The legitimacy and accountability of Self Help Groups (SHGs) and their patrons, the micro-finance outfits, need systematic assessment and scrutiny for the sustained success of the concept. Discuss."]]},{"s":"GS2 · Governance","n":"Citizens Charter","i":[[2024,"15","The Citizens’charter has been a land mark initiative in ensuring citizen-centric ad- ministration. But it is yet to reach its full potential. Identify the factors hindering the realisation of its promise and suggest measures to overcome them."],[2018,"15","Citizens’ Charter is an ideal instrument of organizational transparency and account- ability, but it has its own limitations. Identify the limitations and suggest measures for greater effectiveness or the Citizens Charter."],[2013,"10","Though Citizen’s charters have been formulated by many public service delivery organizations, there is no corresponding improvement in the level of citizens’ satis- faction and quality of services being provided. Analyze."]]},{"s":"GS2 · Governance","n":"Transaparency and Account- ability","i":[[2024,"15","What are the aims and objects of the recently passed and enforced, The Public Examination (Prevention of Unfair Means) Act, 2024? Whether University/State Education Board examinations, too, are covered under the Act ?"],[2022,"10","Reforming the government delivery system through the Direct Benefit Transfer Scheme is a progressive step, but it has its limitations too. Comment."],[2020,"10","“Recent amendments to the Right to Information Act will have profound impact on the autonomy and independence of the Information Commission”. Discuss."],[2016,"12.5","Effectiveness of the goverment system at various levels and people’s participation in the governance system are inter-dependent. Discuss their relationship with each other in context of India."],[2016,"12.5","In the integrity index of Transparency International, India stands very low. Discuss briefly the legal, political, economic, social and cultural factors that have caused the decline of public morality in India."],[2015,"12.5","If amendment bill to the Whistleblowers Act, 2011 tabled in the Parliament is passed, there may be no one left to protect. Critically evaluate."],[2015,"12.5","In the light of the Satyam Scandal (2009), discuss the changes brought in corporate governance to ensure transparency, accountability."]]},{"s":"GS2 · Governance","n":"E-governance","i":[[2025,"10","E-governance projects have a built-in bias towards technology and back-end integra- tion than user-centric designs. Examine."],[2024,"15","e-governance is not just about the routine application of digital technology in service delivery process. It is as much about multifarious interactions for ensuring transparency and accountability. In this context evaluate the role of the ‘Interactive Service Model’ of e-governance."],[2023,"10","e-governance, as a critical tool of governance, has ushered in effectiveness, transparency and accountability in governments. What inadequacies hamper the enhancement of these features?"],[2021,"15","Has digital illiteracy, particularly in rural areas, coupled with lack of Information and Communication Technology (ICT) accessibility hindered socio-economic develop- ment? Examine with justification."],[2020,"10","“The emergence of Fourth Industrial Revolution (Digital Revolution) has initiated e-Governance as an integral part of government”. Discuss."],[2019,"10","Implementation of information and Communication Technology (ICT) based Projects / Programmes usually suffers in terms of certain vital factors. Identify these factors, and suggest measures for their effective implementation."],[2018,"10","E-Governance is not only about utilization of the power of new technology, but also much about critical importance of the ‘use value’ of information Explain."],[2013,"10","Electronic cash transfer system for the welfare schemes is an ambitious project to minimize corruption, eliminate wastage and facilitate reforms. Comment."]]},{"s":"GS2 · Governance","n":"Civil Services","i":[[2024,"10","The Doctrine of Democratic Governance makes it necessary that the public percep- tion of the integrity and commitment of civil servants becomes absolutely positive. Discuss."],[2020,"10","“Institutional quality is a crucial driver of economic performance”. In this context suggest reforms in Civil Service for strengthening democracy."],[2017,"15","Initially Civil Services in India were designed to achieve the goals of neutrality and effectiveness, which seems to be lacking in the present context. Do you agree with the view that drastic reforms are required in Civil Services. Comment"],[2016,"12.5","Traditional bureaucratic structure and culture have hampered the process of so- cio-economic development in India. Comment."],[2014,"12.5","Has the Cadre based Civil Services Organisation been the cause of slow change in India? Critically examine."]]},{"s":"GS2 · Social Justice","n":"Children","i":[[2016,"12.5","Examine the main provisions of the National Child Policy and throw light on the status of its implementation."]]},{"s":"GS2 · Social Justice","n":"Disables","i":[[2022,"10","The Rights of Persons with Disabilities Act, 2016 remains only a legal document without intense sensitisation of government functionaries and citizens regarding disability. Comment."],[2017,"10","Does the Rights of Persons with Disabilities Act, 2016 ensure effective mechanism for empowerment and inclusion of the intended beneficiaries in the society? Discuss"]]},{"s":"GS2 · Social Justice","n":"Efficacy of Welfare and De- velopment Schemes","i":[[2023,"15","“Development and welfare schemes for the vulnerable, by its nature, are discrimina- tory in approach.” Do you agree? Give reasons for your answer."],[2019,"15","Performance of welfare schemes that are implemented for vulnerable sections is not so effective due to absence of their awareness and active involvement at all stages of policy process – Discuss."],[2014,"12.5","Do government’s schemes for up-lifting vulnerable and backward communities by protecting required social resources for them, lead to their exclusion in establishing businesses in urban economics?"],[2013,"10","The Central Government frequently complains on the poor performance of the State Governments in eradicating suffering of the vulnerable sections of the society. Restructuring of Centrally sponsored schemes across the sectors for ameliorating the cause of vulnerable sections of population aims at providing flexibility to the States in better implementation. Critically evaluate."]]},{"s":"GS2 · Social Justice","n":"Women","i":[[2025,"10","Women’s social capital complements in advancing empowerment and gender equi- ty. Explain."],[2021,"15","“Though women in post-Independent India have excelled in various fields, the social attitude towards women and feminist movement has been patriarchial.” Apart from women education and women empowerment schemes, what interventions can help change this milieu?"]]},{"s":"GS2 · Social Justice","n":"Education","i":[[2022,"15","The Right of Children to Free and Compulsory Education Act, 2009 remains inade- quate in promoting incentive-based system for children’s education without gener- ating awareness about the importance of schooling. Analyse."],[2021,"10","“Earn while you learn’ scheme needs to be strengthened to make vocational educa- tion and skill training meaningful.” Comment. (150 words)"],[2020,"15","National Education Policy 2020 is in conformity with the Sustainable Development Goal-4 (2030). It intends to restructure and reorient education system in India. Criti- cally examine the statement."],[2015,"12.5","The quality of higher education in India requires major improvements to make it internationally competitive. Do you think that the entry of foreign educational institutions would help improve the quality of higher and technical education in the country? Discuss."],[2014,"12.5","Should the premier institutes like IITs/IIMs be allowed to retain premier status, allowed more academic independence in designing courses and also decide mode/ criteria of selection of students. Discuss in light of the growing challenges."]]},{"s":"GS2 · Social Justice","n":"Health","i":[[2024,"15","In a crucial domain like the public healthcare system, the Indian State should play a vital role to contain the adverse impact of marketisation of the system. Suggest some measures through which the State can enhance the reach of public healthcare at the grassroots level."],[2021,"10","“Besides being a moral imperative of a Welfare State, primary health structure is a necessary precondition for sustainable development.” Analyse.(150 words)"],[2020,"10","In order to enhance the prospects of social development, sound and adequate health care policies are needed particularly in the fields of geriatric and maternal health care. Discuss."],[2018,"10","Appropriate local community-level healthcare intervention is a prerequisite to achieve ‘Health for All ‘ in India. Explain."],[2017,"10","‘To ensure effective implementation of policies addressing water, sanitation and hygiene needs, the identification of beneficiary segments is to be synchronized with the anticipated outcomes’ Examine the statement in the context of the WASH scheme."],[2015,"12.5","Public health system has limitations in providing universal health coverage. Do you think that the private sector could help in bridging the gap? What other viable alter- natives would you suggest?"],[2013,"10","Identify the Millennium Development Goals (MDGs) that are related to health. Dis- cuss the success of the actions taken by the Government for achieving the same."]]},{"s":"GS2 · Social Justice","n":"Human Resources","i":[[2023,"15","Skill development programs have succeed in increasing human resources supply to various sectors. In the context of the statement analyze the linkages between educa- tion, skill and employment."],[2023,"10","The crucial aspect of development process has been the inadequate attention paid to Human Resource Development in India. Suggest measures that can address this adequacy."],[2019,"10","Despite Consistent experience of High growth, India still goes with the lowest indi- cators of human development. Examine the issues that make balanced and inclusive development elusive."],[2016,"12.5","Demographic Dividend in India will remain only theoretical unless our manpower becomes more educated, aware, skilled and creative. What measures have been taken by the government to enhance the capacity of our population to be more productive and employable?"],[2014,"12.5","An athlete participates in Olympics for personal triumph and nation’s glory; victors are showered with cash incentives by various agencies, on their return. Discuss the merit of state sponsored talent hunt and its cultivation as against the rationale of a reward mechanism as encouragement."]]},{"s":"GS2 · Social Justice","n":"Miscellenous","i":[[2016,"12.5","Professor Amartya Sen has advocated important reforms in the realms of primary education and primary health care. What are your suggestions to improve their status and performance?"]]},{"s":"GS2 · Social Justice","n":"Hunger","i":[[2019,"10","There is a growing divergence in the relationship between poverty and hunger in India. The shrinking of social expenditure by the government is forcing the poor to spend more on Non- Food essential items squeezing their food – budget.- Elucidate."],[2018,"15","How far do you agree with the view that the focus on lack of availability of food as the main cause of hunger takes the attention away from ineffective human develop- ment policies in India?"],[2013,"10","The concept of Mid Day Meal (MDM) scheme is almost a century old in India with early beginnings in Madras Presidency in pre-independent India. The scheme has again been given impetus in most states in the last two decades. Critically examine its twin objectives, latest mandates and success."]]},{"s":"GS2 · Social Justice","n":"Poverty","i":[[2025,"15","Inequality in the ownership pattern of resources is one of the major causes of pover- ty. Discuss in the context of ‘paradox of poverty’."],[2024,"10","Poverty and malnutrition create a vicious cycle, adversely affecting human capital formation. What steps can be taken to break the cycle?"],[2022,"15","Besides the welfare schemes, India needs deft management of inflation and unem- ployment to serve the poor and the underprivileged sections of the society. Discuss."],[2020,"15","“The incidence and intensity of poverty are more important in determining poverty based on income alone”. In this context analyse the latest United Nations Multidi- mensional Poverty Index Report."],[2017,"15","‘Poverty Alleviation Programmes in India remain mere show pieces until and unless they are backed by political will’. Discuss with reference to the performance of the major poverty alleviation programmes in India."],[2015,"12.5","Though there have been several different estimates of poverty in India, all indicate reduction in poverty levels over time. Do you agree? Critically examine with refer- ence to urban and rural poverty indicators."]]},{"s":"GS2 · Social Justice","n":"Miscellenous","i":[[2017,"10","Hunger and Poverty are the biggest challenges for good governance in India still to- day. Evaluate how far successive governments have progressed in dealing with these humongous problems. Suggest measures for improvement."]]},{"s":"GS2 · International Relations","n":"Neighbourhood","i":[[2022,"10","India is an age-old friend of Sri Lanka.’ Discuss India’s role in the recent crisis in Sri Lanka the light of the preceding statement."],[2015,"12.5","Project `Mausam’ is considered a unique foreign policy initiative of the Indian Government to improve relationship with its neighbors. Does the project have a strategic dimension? Discuss."],[2015,"12.5","Terrorist activities and mutual distrust have clouded India-Pakistan relations. To what extent the use of soft power like sports and cultural exchanges could help gen- erate goodwill between the two countries? Discuss with suitable examples."],[2013,"10","Discuss the political developments in Maldives in the last two years. Should they be of any cause of concern to India?"],[2013,"10","In respect of India-Sri Lanka relations, discuss how domestic factors influence for- eign policy."],[2013,"10","The protests in Shahbag Square in Dhaka in Bangladesh reveal a fundamental split in society between the nationalists and Islamic forces. What is its significance for India?"],[2013,"10","What is meant by Gujral doctrine? Does it have any relevance today? Discuss."]]},{"s":"GS2 · International Relations","n":"Bilateral Relations","i":[[2025,"10","India–Africa digital partnership is achieving mutual respect, co-development and long-term institutional partnerships. Elaborate."],[2024,"10","Discuss the geopolitical and geostrategic importance of Maldives for India with a focus on global trade and energy flows. Further also discuss how this relationship affects India’s maritime security and regional stability amidst international competi- tion?"],[2020,"15","What is the significance of Indo-US defence deals over Indo-Russian defence deals? Discuss with reference to stability in the Indo-Pacific region."],[2019,"10","‘The time has come for India and Japan to build a strong contemporary relationship, one involving global and strategic partnership that will have a great significance for Asia and the world as a whole.’ Comment."],[2019,"15","“What introduces friction into the ties between India and the United States is that Washington is still unable to find for India a position in its global strategy, which would satisfy India’s National self-esteem and ambitions” Explain with suitable examples."],[2018,"10","India’s relations with Israel have, of late, acquired a depth and diversity, which can- not be rolled back.” Discuss."],[2015,"12.5","Increasing interest of India in Africa has its pros and cons. Critically examine."],[2014,"12.5","With respect to the South China sea, maritime territorial disputes and rising tension affirm the need for safeguarding maritime security to ensure freedom of navigation and over flight throughout the region. In this context, discuss the bilateral issues between India and China."],[2013,"10","Economic ties between India and Japan, while growing in recent years, are still far below their potential. Elucidate the policy constraints which are inhibiting this growth."]]},{"s":"GS2 · International Relations","n":"Groupings beyond South Asia","i":[[2022,"15","How will I2U2 (India, Israel, UAE and USA) grouping transform India’s position in global politics ?"],[2021,"10","“If the last few decades were of Asia’s growth story, the next few are expected to be of Africa’s.” In the light of this statement, examine India’s influence in Africa in recent years."],[2021,"15","The newly tri-nation partnership AUKUS is aimed at countering China’s ambitions in the Indo-Pacific region. Is it going to supersede the existing partnerships in the region? Discuss the strength and impact of AUKUS in the present scenario."],[2020,"15","‘Quadrilateral Security Dialogue (Quad)’ is transforming itself into a trade bloc from a military alliance, in present times - Discuss."]]},{"s":"GS2 · International Relations","n":"Groupings involving Imme- diate and Extended neigh- bours","i":[[2024,"10","Critically analyse India’s evolving diplomatic, economic and strategic relations with the Central Asian Republics (CARs) highlighting their increasing significance in re- gional and global geopolitics."],[2023,"10","‘Virus of Conflict is affecting the functioning of the SCO’. In the light of the above statement point out the role of India in mitigating problems."],[2022,"10","Do you think that BIMSTEC is a parallel organisation like the SAARC? What are the similarities and dissimilarities between the two? How are Indian foreign policy ob- jectives realized by forming this new organisation?"],[2021,"15","Critically examine the aims and objectives of SCO. What importance does it hold for India?"],[2016,"12.5","Increasing cross-border terrorist attacks in India and growing interference in the in- ternal affairs of several member-states by Pakistan are not conducive for the future of SAARC (South Asian Association for Regional Cooperation). Explain with suitable examples."],[2016,"12.5","Evaluate the economic and strategic dimensions of India’s Look East Policy in the context of the post-Cold War international scenario."]]},{"s":"GS2 · International Relations","n":"Energy X Foreign Policy","i":[[2025,"15","“Energy security constitutes the dominant kingpin of India’s foreign policy, and is linked with India’s overarching influence in Middle Eastern countries.” How would you integrate energy security with India’s foreign policy trajectories in the coming years?"],[2022,"15","Clean energy is the order of the day. Describe briefly India’s changing policy towards climate change in various international fora in the context of geopolitics."],[2017,"15","The question of India’s Energy Security constitutes the most important part of In- dia’s economic progress. Analyze India’s energy policy cooperation with West Asian Countries."]]},{"s":"GS2 · International Relations","n":"Geo-politics affecting India’s Interest","i":[[2025,"10","With the waning of globalization, post-Cold War world is becoming a site of sover- eign nationalism. Elucidate."],[2024,"10","The West is fostering India as an alternative to reduce dependence on China’s supply chain and as a strategic ally to counter China’s political and economic dominance.’ Explain this statement with examples."],[2023,"15","‘The expansion and strengthening of NATO and a stronger US-Europe strategic partnership works well in India.’ What is your opinion about this statement? Give reasons and examples to support your answer."],[2019,"15","“The long-sustained image of India as a leader of the oppressed and marginalised Nations has disappeared on account of its new found role in the emerging global order”. Elaborate."],[2018,"10","A number of outside powers have entrenched themselves in Central Asia, which is a zone of interest to India. Discuss the implications, in this context, of India’s joining the Ashgabat Agreement, 2018."],[2018,"15","In what ways would the ongoing US-Iran Nuclear Pact Controversy affect the nation- al interest of India? How should India respond to this situation?"],[2017,"10","‘China is using its economic relations and positive trade surplus as tools to develop potential military power status in Asia’, In the light of this statement, discuss its impact on India as her neighbor."],[2013,"10","The proposed withdrawal of International Security Assistance Force (ISAF) from Af- ghanistan in 2014 is fraught with major security implications for the countries of the region. Examine in light of the fact that India is faced with a plethora of challenges and needs to safeguard its own strategic interests."],[2013,"10","What do you understand by ‘The String of Pearls’? How does it impact India? Briefly outline the steps taken by India to counter this."]]},{"s":"GS2 · International Relations","n":"Indian Diaspora","i":[[2023,"10","Indian diaspora has scaled new heights in the West. Describe its economic and political benefits for India."],[2020,"10","‘Indian diaspora has a decisive role to play in the politics and economy of America and European Countries’. Comment with examples."],[2017,"15","Indian Diaspora has an important role to play in South-East Asian countries’ econ- omy and society. Appraise the role of Indian Diaspora in South- East Asia in this context"]]},{"s":"GS2 · International Relations","n":"Miscelleneous","i":[[2021,"10","“The USA is facing an existential threat in the form of a China, that is much more challenging than the erstwhile Soviet Union.” Explain."]]},{"s":"GS2 · International Relations","n":"International Funding Agencies","i":[[2014,"12.5","Some of the International funding agencies have special terms for economic participation stipulating a substantial component of the aid to be used for sourcing equipment from the leading countries. Discuss on merits of such terms and if, there exists a strong case not to accept such conditions in the Indian context."],[2014,"12.5","Some of the International funding agencies have special terms for economic participation stipulating a substantial component of the aid to be used for sourcing equipment from the leading countries. Discuss on merits of such terms and if, there exists a strong case not to accept such conditions in the Indian context."],[2014,"12.5","India has recently signed to become founding a New Development Bank (NDB) and also the Asian Infrastructure Investment Bank (AIIB) .How will the role of the two Banks be different? Discuss the significance of these two Banks for India."],[2013,"10","The World Bank and the IMF, collectively known as the Bretton Woods Institutions, are the two inter-governmental pillars supporting the structure of the world’s economic and financial order. Superficially, the World Bank and the IMF exhibit many common characteristics, yet their role, functions and mandate are distinctly different. Elucidate."]]},{"s":"GS2 · International Relations","n":"United Nations and its Agencies","i":[[2025,"15","“The reform process in the United Nations remains unresolved, because of the delicate imbalance of East and West and entanglement of the USA vs. Russo-Chinese alliance.” Examine and critically evaluate the East-West policy confrontations in this regard."],[2024,"15","Terrorism has become a significant threat to global peace and security’. Evaluate the effectiveness of the United Nations Security Council’s Counter-Terrorism Commit- tee (CTC) and its associated bodies in addressing and mitigating this threat at the international level."],[2023,"15","‘Sea is an important Component of the Cosmos’. Discuss in the light of the above statement the role of the IMO(International Maritime Organisation) in protecting environment and enhancing maritime safety and security."],[2020,"10","Critically examine the role of WHO in providing global health security during the Covid-19 pandemic."],[2019,"10","‘Too little cash, too much politics, leaves UNESCO fighting for life.’ Discuss the state- ment in the light of US’ withdrawal and its accusation of the cultural body as being ‘anti-Israel bias’."],[2017,"10","What are the main functions of the United Nations Economic and Social Council (ECOSOC)? Explain different functional commissions attached to it."],[2016,"12.5","What are the aims and objectives of the McBride Commission of the UNESCO? What is India’s position on these?"],[2015,"12.5","Discuss the impediments India is facing in its pursuit of a permanent seat in UN Security Council."]]},{"s":"GS2 · International Relations","n":"WTO","i":[[2018,"15","What are the key areas of reform if the WTO has to survive in the present context of ‘Trade War’, especially keeping in mind the interest of India?"],[2016,"12.5","The broader aims and objectives of WTO are to manage and promote international trade in the era of globalization. But the Doha round of negotiations seem doomed due to differences between the developed and the developing countries. Discuss in the Indian perspective."],[2014,"12.5","The aim of Information Technology Agreements (ITAs) is to lower all taxes and tariffs on information technology products by signatories to zero. What impact should such agreements have on India’s interests?"],[2014,"12.5","WTO is an important international institution where decisions taken affect countries in profound manner. What is the mandate of WTO and how binding are their deci- sions? Critically analyse India’s stand on the latest round of talks on Food security."]]},{"s":"GS3 · International Relations","n":"Syllabus","i":[[2014,"2015","2013"]]},{"s":"GS3 · Economic Development","n":"Unemployment","i":[[2023,"15","Most of the unemployment in India is structural in nature. Examine the methodolo- gy adopted to compute unemployment in the country and suggest improvements."],[2015,"12.5","The nature of economic growth in India in described as jobless growth. Do you agree with this view? Give arguments in favour of your answer."]]},{"s":"GS3 · Economic Development","n":"Investment","i":[[2020,"15","Explain the meaning of investment in an economy in terms of capital formation. Dis- cuss the factors to be considered while designing a concession agreement between a public entity and a private entity."]]},{"s":"GS3 · Economic Development","n":"Care X Monetized Economy","i":[[2023,"15","Distinguish between ‘care economy’ and ‘monetized economy’. How can care econ- omy be brought into monetized economy through women empowerment?"]]},{"s":"GS3 · Economic Development","n":"Demographic Dividend","i":[[2014,"12.5","While we flaunt India’s demographic dividend, we ignore the dropping rates of employability. What are we missing while doing so? Where will the jobs that India desperately needs come from? Explain."]]},{"s":"GS3 · Economic Development","n":"Digitalization of Economy","i":[[2023,"10","What is the status of digitalization in the Indian economy? Examine the problems faced in this regard and suggest improvements."]]},{"s":"GS3 · Economic Development","n":"GDP","i":[[2021,"10","Explain the difference between computing methodology of India’s gross domestic product (GDP) before the year 2015 and after the year 2015."],[2020,"10","Define potential GDP and explain its determinants. What are the factors that have been inhibiting India from realizing its potential GDP?"],[2019,"10","Do you agree with the view that steady GDP growth and low inflation have left the Indian economy in good shape? Give reasons in support of your arguments."]]},{"s":"GS3 · Economic Development","n":"Monetary policy","i":[[2024,"10","What are the causes of persistent high food inflation in India? Comment on the effectiveness of the monetary policy of the RBI to control this type of inflation."]]},{"s":"GS3 · Economic Development","n":"Miscellaneous","i":[[2022,"10","The increase in life expectancy in the country has led to newer health challenges in the community. What are those challenges and what steps need to be taken to meet them ?"]]},{"s":"GS3 · Economic Development","n":"Economic Growth","i":[[2022,"15","Economic growth in the recent past has been led by increase in labour activity.” Explain this statement. Suggest the growth pattern that will lead to creation of more jobs without compromising labour productivity."],[2021,"15","Do you agree that the Indian economy has recently experienced a V-shaped recov- ery? Give reasons in support of your answer."],[2017,"10","Among several factors for India’s potential growth, savings rate is the most effective one. Do you agree? What are the other factors available for growth potential?"]]},{"s":"GS3 · Economic Development","n":"Manufacturing Sector","i":[[2025,"15","Discuss the rationale of the Production Linked Incentive (PLI) scheme. What are its achieve- ments? In what way can the functioning and outcomes of the scheme be improved?"],[2025,"15","India aims to become a semiconductor manufacturing hub. What are the challenges faced by the semiconductor industry in India? Mention the salient features of the India Semiconductor Mission."],[2023,"10","Faster economic growth requires increased share of the manufacturing sector in GDP, par- ticularly of MSMEs. Comment on the present policies of the Government in this regard."],[2015,"12.5","Success of ‘Make in India’ programme depends on the success of ‘Skill India’ pro- gramme and radical labour reforms. Discuss with logical arguments."]]},{"s":"GS3 · Economic Development","n":"Niti Aayog X Planning Com- mission","i":[[2018,"15","How are the principles followed by the NITI Aayog different from those followed by the erstwhile Planning Commission in India?"]]},{"s":"GS3 · Economic Development","n":"GST","i":[[2020,"15","Explain the rationale behind the Goods and Services Tax (Compensation to States) Act of 2017. How has COVID-19 impacted the GST compensation fund and created new federal tensions?"],[2019,"10","Enumerate the indirect taxes which have been subsumed in the Goods and Services Tax (GST) in India. Also, comment on the revenue implications of the GST introduced in India since July 2017."],[2013,"10","Discussion the rationale for introducing Good and services tax in India. Bring out critically the reasons for delay in roll out for its regime."]]},{"s":"GS3 · Economic Development","n":"Corporate Social Responsi- bilty","i":[[2013,"10","With a consideration towards the strategy of inclusive growth, the new Companies Bill, 2013 has indirectly made CSR a mandatory obligation. Discuss the challenges expected in its implementation in right earnest. Also discuss other provisions in the Bill and their implications"]]},{"s":"GS3 · Economic Development","n":"Financial Inclusion","i":[[2022,"10","Is inclusive growth possible under market economy ? State the significance of finan- cial inclusion in achieving economic growth in India."],[2016,"12.5","Pradhan Mantri Jan-Dhan Yojana (PMJDY) is necessary for bringing unbanked to the institutional finance fold. Do you agree with this for financial inclusion of the poorer section of the Indian society? Give arguments to justify your opinion."]]},{"s":"GS3 · Economic Development","n":"Inclusive Growth","i":[[2025,"10","Distinguish between the Human Development Index (HDI) and Inequality-adjusted Human Development Index (IHDI) with special reference to India. Why is the IHDI considered a better indicator of inclusive growth?"],[2017,"15","What are the salient features of ‘inclusive growth’? Has India been experiencing such a growth process? Analyze and suggest measures for inclusive growth."],[2016,"12.5","Comment on the challenges for inclusive growth which include careless and useless manpower in the Indian context. Suggest measures to be taken for facing these challenges."]]},{"s":"GS3 · Economic Development","n":"Inclusive Growth X Capital- ism","i":[[2014,"12.5","Capitalism has guided the world economy to unprecedented prosperity. However, it often encourages shortsightedness and contributes to wide disparities between the rich and the poor. In this light, would it be correct to believe and adopt capitalism driving inclusive growth in India? Discuss."]]},{"s":"GS3 · Economic Development","n":"Inclusive Growth X Infra- structure","i":[[2021,"15","Investment in infrastructure is essential for a more rapid and inclusive economic growth. Discuss in the light of India’s experience."],[2016,"12.5","What are ‘Smart Cities? Examine their relevance for urban development in India. Will it increase rural-urban differences? Give arguments for Smart Villages’ in the light of PURA and RURBAN Mission."]]},{"s":"GS3 · Economic Development","n":"Inclusive Growth X Public Expenditure","i":[[2024,"10","Examine the pattern and trend of public expenditure on social services in the post-reforms period in India. To what extent this has been in consonance with achieving the objective of inclusive growth?"]]},{"s":"GS3 · Economic Development","n":"Inclusive Growth X Sustain- able Development","i":[[2020,"10","Explain intra-generational and inter-generational issues of equity from the perspec- tive of inclusive growth and sustainable development."],[2019,"15","It is argued that the strategy of inclusive growth is intended to meet the objectives of inclusiveness and sustainability together. Comment on this statement."]]},{"s":"GS3 · Economic Development","n":"Current Budget","i":[[2018,"10","Comment on the important changes introduced in respect of the Long-term Capital Gains Tax (LCGT) and Dividend Distribution Tax (DDT) in the Union Budget for 2018- 2019."],[2017,"15","One of the intended objectives of Union Budget 2017-18 is to ‘transform, energize and clean India’. Analyse the measures proposed in the Budget 2017-18 to achieve the objective."]]},{"s":"GS3 · Economic Development","n":"Gender Budgeting","i":[[2016,"12.5","Women empowerment in India needs gender budgeting. What are the require- ments and status of gender budgeting in the Indian context?"]]},{"s":"GS3 · Economic Development","n":"Fiscal Policy","i":[[2025,"15","Explain how the Fiscal Health Index (FHI) can be used as a tool for assessing the fiscal performance of states in India. In what way would it encourage the states to adopt prudent and sustainable fiscal policies?"],[2021,"10","Distinguish between capital budget and revenue budget. Explain the components of both these Budgets."],[2019,"15","The public expenditure management is a challenge to the government of India in the context of budget-making during the post-liberalization period. Clarify it."],[2013,"10","What are the reasons for introduction of Fiscal responsibility and Budget Manage- ment (FRBM) act, 2003? Discuss critically its salient features and their effectiveness."],[2013,"10","What is meaning of the term tax-expenditure? Taking housing sector as an example, discuss how it influences budgetary policies of the government."]]},{"s":"GS3 · Economic Development","n":"Food Processing Sector","i":[[2025,"15","Examine the scope of the food processing industries in India. Elaborate the mea- sures taken by the government in the food processing industries for generating employment opportunities."],[2022,"10","Elaborate the scope and significance of the food processing industry in India."],[2020,"10","What are the challenges and opportunities of food processing sector in the coun- try? How can income of the farmers be substantially increased by encouraging food processing?"],[2019,"15","Elaborate on the policy taken by the government of India to meet the challenges of the food processing sector."],[2017,"10","What are the reasons for poor acceptance of cost effective small processing unit? How the food processing unit will be helpful to uplift the socio-economic status of poor farmers?"],[2015,"12.5","What are the impediments in marketing and supply chain management in develop- ing the food processing industry in India? Can e-commerce help in overcoming these bottlenecks?"]]},{"s":"GS3 · Economic Development","n":"Revolutions and Missions","i":[[2013,"10","India needs to strengthen measures to promote the pink revolution in food industry for better nutrition and health. Critically elucidate the statement."]]},{"s":"GS3 · Economic Development","n":"Balance of Payment","i":[[2015,"12.5","Craze for gold in Indians have led to a surge in import of gold in recent years and put pressure on balance of payments and external value of rupee. In view of this, examine the merits of Gold Monetization Scheme."]]},{"s":"GS3 · Economic Development","n":"FDI","i":[[2016,"12.5","Justify the need for FDI for the development of the Indian economy. Why there is gap between MOUs signed and actual FDIs? Suggest remedial steps to be taken for increasing actual FDIs in India."],[2014,"12.5","Foreign direct investment in the defence sector is now said to be liberalised. What influence this is expected to have on Indian defence and economy in the short and long run?"],[2013,"5","Discuss the impact of FDI entry into multi-trade retail sector on supply chain man- agement in commodity trade pattern of the economy."],[2013,"5","Though India allowed foreign direct investment (FDI) in what is called multi brand retail through joint venture route in September 2012, the FDI even after a year, has not picket up. Discuss the reasons."]]},{"s":"GS3 · Economic Development","n":"LPG Reform and Impact","i":[[2017,"15","“Industrial growth rate has lagged behind in the overall growth of Gross-Domes- tic-Product(GDP) in the post-reform period” Give reasons. How far the recent chang- es in Industrial Policy are capable of increasing the industrial growth rate?"],[2016,"12.5","How globalization has led to the reduction of employment in the formal sector of the Indian economy? Is increased informalization detrimental to the development of the country?"],[2014,"12.5","Normally countries shift from agriculture to industry and then later to services, but India shifted directly from agriculture to services. What are the reasons for the huge growth of services vis-a-vis industry in the country? Can India become a developed country without a strong industrial base?"],[2013,"10","Examine the impact of liberalization on companies owned by Indian. Are the com- peting with the MNCs satisfactorily?"]]},{"s":"GS3 · Economic Development","n":"Protectionism and Currency Manipulations","i":[[2025,"10","What are the challenges before the Indian economy when the world is moving away from free trade and multilateralism to protectionism and bilateralism? How can these challenges be met?"],[2018,"15","How would the recent phenomena of protectionism and currency manipulations in world trade affect macroeconomic stability of India?"]]},{"s":"GS3 · Economic Development","n":"Special Economic Zones","i":[[2015,"12.5","There is a clear acknowledement that Special Economic Zones (SEZs) are a tool of industrial development, manufacturing and exports. Recognizing this potential, the whole instrumentality of SEZs requires augmentation. Discuss the issues plaguing the success of SEZs with respect to taxation, governing laws and administration."]]},{"s":"GS3 · Economic Development","n":"Labour-intensive X Capi- tal-intensive Export","i":[[2017,"10","Account for the failure of the manufacturing sector in achieving the goal of la- bour-intensive exports. Suggest measures for more labour intensive rather capi- tal-intensive export."]]},{"s":"GS3 · Economic Development","n":"Labour Reform","i":[[2024,"15","Discuss the merits and demerits of the four ‘Labour Codes’ in the context of labour market reforms in India. What has been the progress so far in this regard?"]]},{"s":"GS3 · Economic Development","n":"Airports X Infrastructure","i":[[2024,"15","What is the need for expanding the regional air connectivity in India? In this context, discuss the government’s UDAN Scheme and its achievements."],[2014,"12.5","International civil aviation laws provide all countries complete and exclusive soveri- gnity over the airspace above the territory. What do you understand by airspace? What are the implications of these laws on the space above this airspace? Discuss the challenges which this poses and suggests ways to contain the threat."]]},{"s":"GS3 · Economic Development","n":"PPP X Infrastructure","i":[[2022,"10","Why is Public Private Partnership (PPP) required in infrastructural projects ? Examine the role of PPP model in the redevelopment of Railway Stations in India."],[2017,"10","Examine the developments of Airports in India through Joint Ventures under Pub- lic-Private Partnership(PPP) model. What are the challenges faced by the authorities in this regard."],[2014,"12.5","Explain how private public partnership agreements, in longer gestation infrastruc- ture projects, can transfer unsuitable liabilities to the future. What arrangements need to be put in place to ensure that successive generations’ capacities are not compromised?"],[2013,"10","Adaptation of PPP model for infrastructure development of the country has not been free from criticism. Critically discuss the pros and cons of the model."]]},{"s":"GS3 · Economic Development","n":"Renewable Energy","i":[[2022,"15","Do you think India will meet 50 percent of its energy needs from renewable energy by 2030 ? Justify your answer. How will the shift of subsidies from fossil fuels to renewables help achieve the above objective ? Explain."],[2020,"15","Describe the benefits of deriving electric energy from sunlight in contrast to the conventional energy generation. What are the initiatives offered by our Government for this purpose?"],[2018,"15","With growing energy needs should India keep on expanding its nuclear energy pro- gramme? Discuss the facts and fears associated with nuclear energy."],[2018,"10","Access to affordable, reliable, sustainable and modern energy is the sine qua non to achieve Sustainable Development Goals (SDGs). Comment on the progress made in India in this regard."],[2016,"12.5","Give an account of the current status and the targets to be achieved pertaining to renewable energy sources in the country. Discuss in brief the importance of National Programme on Light Emitting Diodes (LEDs)."],[2015,"12.5","To what factors can the recent dramatic fall in equipment costs and tariff of solar energy be at  work? List out the advantages and disadvan- tages of the technology."],[2013,"5","What is digital signature? What does its authentication mean? Giver various salient built in features of a digital signature."]]},{"s":"GS3 · Science & Technology","n":"Material Science and Indus- try Applications","i":[[2013,"5","What is an FRP composite material? How are they manufactured? Discuss their applications in aviation and automobile industry"]]},{"s":"GS3 · Science & Technology","n":"Medical and Health Technol- ogies","i":[[2022,"15","What is the basic principle behind vaccine development? How do vaccines work? What approaches were adopted by the Indian vaccine manufacturers to produce COVID-19 vaccines ?"],[2017,"10","Stem cell therapy is gaining popularity in India to treat a wide variety of medical conditions including Leukaemia, Thalassemia, damaged cornea and several burns. Describe briefly what stem cell therapy is and what advantages it has over other treatments?"],[2014,"12.5","Can overuse and the availability of antibiotics without doctor’s prescription, the contributors to the emergence of drug-resistant diseases in India? What are the available mechanisms for monitoring and control? Critically discuss the various issues involved."],[2013,"10","What do you understand by fixed dose drug combinations (FDCs)? Discuss their merits and demerits."]]},{"s":"GS3 · Science & Technology","n":"General Science","i":[[2022,"10","Each year a large amount of plant material, cellulose, is deposited on the surface of Planet Earth. What are the natural processes this cellulose undergoes before yield- ing carbon dioxide, water and other end products ?"]]},{"s":"GS3 · Science & Technology","n":"Nobel Prizes","i":[[2021,"15","The Nobel Prize in Physics of 2014 was jointly awarded to a Akasaki, Amano and Nakamura for the invention of Blue LEDs in1990s. How has this invention impacted the everyday life of human beings?"]]},{"s":"GS3 · Science & Technology","n":"Sports and Technology","  have been developed to prevent such a catastrophe?"],[2023,"15","What is the main task of India’s third mood mission which could not be achieved in its earlier mission? List the countries that have achieved this task. Introduce the subsystems in the spacecraft launched and explain the role of the ‘Virtual Launch Control Centre’ at the Vikram Sarabhai Space Centre which contributed to the suc- cessful launch from Sriharikota"],[2022,"15","Launched on 25th December, 2021, James Webb Space Telescope has been much in the news since then. What are its unique features which make it superior to its pre- decessor Space Telescopes ? What are the key goals of this mission ? What potential benefits does it hold for the human race?"],[2019,"10","What is India’s plan to have its own space station and how will it benefit our space programme?"],[2017,"10","India has achieved remarkable successes in unmanned space missions including the Chandrayaan and Mars Orbitter Mission, but has not ventured into manned space mission, both in terms of technology and logistics? Explain critically."],[2016,"12.5","Discuss India’s achievements in the field of Space Science and Technology. How the application of this technology has helped India in its socio-economic development?"],[2015,"12.5","What do you understand by ‘Standard Positioning Systems’ and ‘Protection Posi- tioning Systems’ in the GPS era? Discuss the advantages India perceives from its ambitious IRNSS programme employing just seven satellites."]]},{"s":"GS3 · Environment","n":"Biodiversity","i":[[2018,"15","How does biodiversity vary in India? How is the Biological Diversity Act, 2002 helpful in conservation of flora and fauna?"]]},{"s":"GS3 · Environment","n":"Climate Change","i":[[2017,"15","‘Climate Change’ is a global problem. How India will be affected by climate change? How Himalayan and coastal states of India will be affected by climate change?"]]},{"s":"GS3 · Environment","n":"Sustainable Development","i":[[2019,"15","Define the concept of carrying capacity of an ecosystem as relevant to an environ- ment. Explain how understanding this concept is vital while planning for sustainable development of a region."]]},{"s":"GS3 · Environment","n":"EIA","i":[[2024,"10","What role do environmental NGOs and activists play in influencing Environmental Impact Assessment (EIA) outcomes for major projects in India? Cite four examples with all important details."],[2020,"10","How does the draft Environment Impact Assessment (EIA) Notification, 2020 differ from the existing EIA Notification, 2006?"],[2016,"12.5","Rehabilitation of human settlements is one of the important environmental impacts which always attracts controversy while planning major projects. Discuss the mea- sures suggested for mitigation of this impact while proposing major developmental projects."],[2014,"12.5","Environmental impact assessment studies are increasingly undertaken before proj- ect is cleared by the government. Discuss the environmental impacts of coal-fired thermal plants located at Pitheads."]]},{"s":"GS3 · Environment","n":"Air Pollution and Related Issues","i":[[2025,"10","What is Carbon Capture, Utilization and Storage (CCUS)? What is the potential role of CCUS in tackling climate change?"],[2022,"10","Discuss in detail the photochemical smog emphasizing its formation, effects and mitigation. Explain the 1999 Gothenburg Protocol."],[2021,"10","Describe the key points of the revised Global Air-Quality Guidelines (AQGs) recently released by the World Health Organisation (WHO). How are these different from its last update in 2005? What changes in India’s National Clean Air Programme are required to achieve these revised standards?"],[2020,"15","What are the key features of the National Clean Air Programme (NCAP) initiated by the Government of India?"]]},{"s":"GS3 · Environment","n":"Solid wastes","i":[[2018,"10","What are the impediments in disposing the huge quantities of discarded solid wastes which are continuously being generated? How do we remove safely the toxic wastes that have been accumulating in our habitable environment?"]]},{"s":"GS3 · Environment","n":"Water Pollution and Related Issues","i":[[2025,"15","Examine the factors responsible for depleting groundwater in India. What are the steps taken by the government to mitigate such depletion of groundwater?"],[2025,"10","Seawater intrusion in the coastal aquifers is a major concern in India. What are the causes of seawater intrusion and the remedial measures to combat this hazard?"],[2024,"10","Industrial pollution of river water is a significant environmental issue in India. Discuss the various mitigation measures to deal with this problem and also the government’s initiatives in this regard."],[2023,"10","What is oil pollution? What are its impacts on the marine ecosystem? In what way is oil pollution particularly harmful for a country like India?"],[2015,"12.5","The Namami Gange and National mission for clean Ganga (NMCG) programmes and causes of mixed results from the previous schemes. What quantum leaps can help preserve the river Ganga better than incremental inputs?"],[2013,"10","Enumerate the National Water Policy of India. Taking river Ganges as an example, discuss the strategies which may be adopted for river water pollution control and management. What are the legal provisions for management and handling of haz- ardous wastes in India?"]]},{"s":"GS3 · Environment","n":"EVs","i":[[2023,"15","The adoption of electric vehicles is rapidly growing worldwide. How do electric vehicles contribute to reducing carbon emissions and what are the key benefits they offer compared to traditional combustion engine vehicles?"]]},{"s":"GS3 · Environment","n":"IPCC Reports","i":[[2023,"15","The Intergovernmental Panel on Climate Change(IPCC) has predicted a global sea level rise of about one metre by AD 2100. What would be its impact in India and the other countries in the Indian Ocean region?"]]},{"s":"GS3 · Environment","
