otential.",[]]]],["Examples",[["Flipkart, an e-commerce giant, received significant funding from venture capitalists. Ola, a ride-hailing service, attracted private equity investments to expand its operations.",[]]]],["Advantages",[["These models foster innovation, provide growth capital, and aid in scaling up businesses rapidly.",[]]]],["Challenges",[["Limited accessibility for small enterprises, exit challenges for investors, and risks associated with investing in early-stage companies.",[]]]]]],["Debt Financing",[["Definition",[["Debt financing involves raising funds by borrowing through loans, bonds, or other debt instruments.",[]]]],["Examples",[["Infrastructure projects like highways and power plants often raise funds through corporate bonds and loans from financial institutions.",[]]]],["Advantages",[["Debt financing offers a wider range of funding options and typically carries lower costs compared to equity financing.",[]]]],["Challenges",[["The burden of debt repayment, interest payments, and the risk of default can lead to financial instability for businesses.",[]]]]]],["Sovereign Wealth Funds (SWFs)",[["Definition",[["SWFs are state-owned investment funds that manage surplus reserves from commodity exports or foreign exchange.",[]]]],["Examples",[["India's National Investment and Infrastructure Fund (NIIF) aims to attract long-term investments in infrastructure projects.",[]]]],["Advantages",[["SWFs provide stable and patient capital, diversify investment portfolios, and support economic stability.",[]]]],["Challenges",[["SWFs need to ensure transparent governance, avoid political interference, and address concerns related to national interests.",[]]]]]],["Real Estate Investment Trusts (REITs)",[["Definition",[["REITs allow investors to pool funds for investing in income-generating real estate properties.",[]]]],["Examples",[["Blackstone's investment in commercial real estate through REITs offers retail investors an opportunity to participate in the real estate sector.",[]]]],["Advantages",[["REITs provide liquidity, transparency, and access to real estate assets without the burden of property management.",[]]]],["Challenges",[["Market volatility can affect REIT prices, and maintaining the quality of assets becomes essential for investor confidence.",[]]]]]],["Infrastructure Investment Trusts (InvITs)",[["Definition",[["InvITs pool funds to invest in income-generating infrastructure assets like roads, power projects, and pipelines.",[]]]],["Examples",[["India Grid Trust, an InvIT, has invested in power transmission assets, attracting long-term investors seeking stable returns.",[]]]],["Advantages",[["InvITs provide retail investors access to infrastructure assets, generate regular income, and support infrastructure development.",[]]]],["Challenges",[["Regulatory complexities, project risks, and the need for ensuring asset quality are critical considerations.",[]]]],["Impact Investment",[]],["Definition",[["Impact investments aim for both financial returns and positive social or environmental impact.",[]]]],["Examples",[["Microfinance institutions investing in rural entrepreneurship, and renewable energy projects addressing climate change.",[]]]],["Advantages",[["Impact investments align with sustainable development goals, combining financial gains with societal benefits.",[]]]],["Challenges",[["Measuring social impact accurately, maintaining financial viability, and avoiding \"impact-washing\" are key challenges.",[]]]]]],["Government Initiatives to Attract Investment",[["Make in India",[["Encourages manufacturing investments to boost domestic production and create employment.",[]]]],["Startup India",[["Fosters innovation and entrepreneurship by providing startups with various incentives and support.",[]]]],["National Infrastructure Pipeline",[["Envisages significant investment in infrastructure to accelerate economic growth and development.",[]]]],["Invest India",[["Acts as a facilitator for foreign investors, providing information and assistance for ease of doing business.",[]]]],["Examples",[]],["FDI in Retail",[["Walmart's investment in Flipkart transformed India's e-commerce landscape, promoting digital entrepreneurship.",[]]]],["PPP in Infrastructure",[["The Delhi Metro project, a result of effective PPP, revolutionized urban transportation in the capital city.",[]]]],["Venture Capital Success",[["Ola's growth story, backed by venture capital, illustrates how startups can revolutionize traditional industries.",[]]]]]],["Conclusion",[["Investment models are critical drivers of economic growth and development. With diverse options available, India can attract funds, fuel innovation, and create jobs across sectors. Effective implementation of policies, transparent regulations, and investor-friendly environment are essential for realizing the full potential of these investment models.",[]]]]]},{"id":"G2|116","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"1. Achievements of Indians in Science & Technology","p":230,"ch":"","items":[["Achievements of Indians in Science & Technology",[]],["C.V. Raman",[]],["Discovery",[["Raman Effect, inelastic scattering of light.",[]]]],["Applications",[["Spectroscopy, molecular structure analysis.",[]]]],["A.P.J. Abdul Kalam",[]],["Contributions",[["Missile and space technology advancements.",[]],["Achievements: Played a key role in developing India's first satellite launch vehicle (SLV-3).",[]]]],["Vikram Sarabhai",[]],["Pioneer",[["Father of the Indian space program.",[]],["Achievements: Established ISRO, launched India's first satellite Aryabhata.",[]]]],["Amartya Sen",[]],["Contributions",[["Development economics and welfare economics.",[]],["Achievements: Nobel Prize in Economics for his work on poverty and social welfare.",[]]]],["Venkatraman Ramakrishnan",[]],["Contribution",[["Structural studies of ribosome.",[]],["Achievements: Nobel Prize in Chemistry for his work on the structure and function of the ribosome.",[]]]],["Kailasavadivoo Sivan",[["Role: Chairman of ISRO.",[]],["Achievements: Launch of Mars Orbiter Mission (Mangalyaan) and Chandrayaan missions.",[]]]],["Shrinivas Kulkarni",[["Achievements: Played a key role in the discovery of the first binary pulsar.",[]],["Impact: Contributed to the study of cosmic microwave background radiation.",[]]]],["Abdul Kalam Island",[["Significance: India's premier missile test range.",[]],["Achievements: Successful testing of Agni and Prithvi missiles.",[]]]],["Gaganyaan Mission",[]],["Objective",[["Manned spaceflight program.",[]],["Achievements: Aiming to send Indian astronauts to space, enhancing India's space capabilities.",[]]]],["M.S. Swaminathan",[["Role: Known as the \"Father of the Green Revolution in India.\"",[]]]],["Contributions",[["Introducing high-yielding varieties of crops.",[]],["Impact: Revolutionized Indian agriculture, ensuring food security.",[]]]],["Nandan Nilekani",[["Role: Co-founder of Infosys, architect of Aadhaar.",[]],["Achievements: Development of Aadhaar, world's largest biometric identification system.",[]]]],["Conclusion",[["Indians have left an indelible mark on global science and technology, from pioneering discoveries to space exploration and technological innovations. These achievements underscore India's growing prominence as a hub of innovation and excellence.",[]]]]]},{"id":"G2|117","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"2. Indigenisation of Technology and Developing New Technology: Opportunities, Challenges, Solutions","p":231,"ch":"","items":[["Opportunities",[["Self-Reliance",[["Developing indigenous technology reduces dependency. Example: ISRO's Mars Orbiter Mission showcased India's capability to build cost-effective space technology, enhancing self-reliance in space exploration.",[]]]],["Economic Growth",[["Indigenous technology fosters innovation-driven industries. Example: India's IT sector became a global leader due to its software services, contributing significantly to economic growth.",[]]]],["Security",[["Indigenous technology reduces vulnerabilities. Example: Indigenous development of cybersecurity solutions enhances national security against cyber threats.",[]]]],["Sovereignty",[["Crucial technologies safeguard strategic interests. Example: Indigenous development of defense technologies like INSAS rifles reduced reliance on imports, strengthening national sovereignty.",[]]]],["Global Competitiveness",[["Developing cutting-edge technologies boosts global competitiveness. Example: India's pharmaceutical industry is a leader in generic drugs, providing cost-effective solutions worldwide.",[]]]],["Challenges",[]],["Research Infrastructure",[["Limited research facilities hinder innovation. Example: Lack of advanced research centers delays breakthroughs in fields like quantum computing.",[]]]],["Skill Gap",[["Shortage of skilled professionals slows progress. Example: The shortage of AI experts impacts the development of indigenous AI technologies.",[]]]],["Funding Constraints",[["Limited R&D funding restricts technology development. Example: Budget constraints in R&D affect progress in critical areas like renewable energy technologies.",[]]]],["Regulatory Complexities",[["Bureaucratic hurdles delay technology development. Example: Cumbersome approval processes hinder the development of new medical devices.",[]]]],["Intellectual Property",[["Protecting intellectual property rights is challenging. Example: Ensuring patents for indigenous innovations like traditional medicines can be complicated.",[]]]]]],["Solutions",[["Research Clusters",[["Establishing technology parks for collaborative research. Example: IIT Madras Research Park facilitates industry-academia partnerships for technology development.",[]]]],["Skill Development",[["Initiatives like Skill India for training in emerging technologies. Example: NSDC's Skill India program imparts skills in areas like AI and IoT.",[]]]],["Public-Private Partnerships",[["Collaborating with private sector for funding and technology transfer. Example: The CSIR-Tata Innovation Center fosters collaboration for technology development.",[]]]],["Startup Ecosystem",[["Incubating technology startups through schemes like Startup India. Example: Startups like Zerodha and Byju's are indigenous success stories in fintech and edtech.",[]]]],["Policy Reforms",[["Streamlining regulations and providing incentives for indigenous tech development. Example: Production Linked Incentive (PLI) scheme for electronics encourages domestic manufacturing.",[]]]],["Innovation Challenges",[["Initiating open innovation challenges to crowdsource solutions. Example: AarogyaSetu App Challenge encouraged developers to create a COVID-19 tracking app.",[]]]],["Collaborative R&D",[["Encouraging industry-academia partnerships for technology development. Example: DRDO's collaboration with IITs for defense technology research.",[]]]]]],["Conclusion",[["Indigenisation of technology and developing new technology are crucial for India's progress. By addressing challenges through innovative solutions, fostering research ecosystems, and leveraging existing initiatives, India can build a technologically self-reliant future.",[]]]]]},{"id":"G2|118","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"3. Developments in Information Technology: Evolution, Impact, Challenges, and Future","p":233,"ch":"","items":[["Evolution",[["Information technology (IT) has rapidly evolved, transforming various aspects of modern life. From the advent of computers to the digital age, IT has brought about revolutionary changes. For example, the evolution of India's IT industry from software services to becoming a global IT hub, with companies like TCS, Infosys, and Wipro making significant contributions.",[]],["Impact",[]],["Communication",[["Instant global communication through emails, social media, and video conferencing. Messaging apps like WhatsApp have revolutionized communication.",[]]]],["Business",[["E-commerce, online transactions, and digital marketing have reshaped commerce. Amazon and Flipkart have transformed how people shop.",[]]]],["Education",[["E-learning platforms, online courses, and digital resources for remote learning. Platforms like BYJU'S and Coursera offer accessible education.",[]]]],["Healthcare",[["Electronic health records, telemedicine, and AI-powered diagnostics. Practo and Portea bring healthcare to people's homes.",[]]]],["Entertainment",[["Streaming services, online gaming, and augmented reality experiences. Netflix and PUBG have changed how people entertain themselves.",[]]]],["Government",[["E-governance, digital services, and transparency in administration. The Aadhaar system streamlines government services.",[]]]],["Challenges",[]],["Cybersecurity",[["Rising cyber threats, data breaches, and privacy concerns. The 2016 cyberattack on Cosmos Bank exposed vulnerabilities.",[]]]],["Digital Divide",[["Unequal access to technology, hindering social and economic progress. Rural-urban divide persists in internet penetration.",[]]]],["Job Displacement",[["Automation and AI impacting traditional job roles. Automation in manufacturing affects manual labor.",[]]]],["Misinformation",[["Rapid spread of false information and fake news. WhatsApp's role in misinformation during mob violence incidents.",[]]]],["Environmental Impact",[["Growing energy consumption and electronic waste. E-waste pollution due to improper disposal.",[]]]]]],["Initiatives",[["Digital India",[["Indian government's initiative to transform the country into a digitally empowered society. Push for digital literacy and services.",[]]]],["Skill Development",[["Programs to train and upskill the workforce in IT-related skills. NSDC's initiatives to train for the IT sector.",[]]]],["Start-up Ecosystem",[["Support for technology start-ups through funding and incubation. Startup India fostering innovation.",[]]]],["Cybersecurity Measures",[["Strengthening regulations and infrastructure to combat cyber threats. CERT-In's role in responding to cyber incidents.",[]]]],["E-Governance",[["Providing government services digitally for increased efficiency and transparency. UMANG app for a single platform for government services.",[]]]]]],["Future",[["Artificial Intelligence",[["Integration of AI in various sectors for automation and predictive analysis. NITI Aayog's AI strategy for India's development.",[]]]],["5G Technology",[["Faster internet speeds enabling seamless connectivity and IoT applications. India's plan to roll out 5G networks.",[]]]],["Blockchain",[["Secure and transparent data management in financial, supply chain, and other sectors. Blockchain's use in digital identities and land records.",[]]]],["Smart Cities",[["Utilizing IT to create sustainable and efficient urban environments. The Smart Cities Mission aiming for technological advancement.",[]]]],["Quantum Computing",[["Revolutionary computing power for complex calculations and simulations. India's initiative in quantum computing research.",[]]]]]],["Conclusion",[["Information technology's rapid development has significantly shaped society, enhancing communication, business, education, healthcare, and more. While challenges like cybersecurity and job displacement exist, responsible use of technology and continued innovation will determine its positive impact on our future",[]]]]]},{"id":"G2|119","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"4. India's Space Sector","p":235,"ch":"","items":[["Introduction",[["India's space sector, led by ISRO, has achieved remarkable milestones in satellite launches, interplanetary missions, and commercial ventures.",[]],["Achievements",[]],["Satellite Launches",[["ISRO's Polar Satellite Launch Vehicle (PSLV) became a reliable workhorse, launching satellites for global clients, e.g., PSLV-C37 launching 104 satellites in a single mission.",[]]]],["Interplanetary Missions",[["Mars Orbiter Mission (Mangalyaan) made India the first Asian country to reach Martian orbit, demonstrating cost-effectiveness and technological prowess.",[]]]],["Navigation System",[["IRNSS (NavIC) provides accurate regional positioning and navigation services, enhancing navigation for civilian and military applications.",[]]]],["Commercial Ventures",[["Antrix Corporation, ISRO's commercial arm, offers satellite launch services to international clients, boosting revenue and global recognition.",[]]]],["International Collaboration",[["Collaboration with NASA, ESA, and other space agencies, e.g., ISRO-NASA partnership in Chandrayaan missions, fostering knowledge exchange.",[]]]],["Challenges",[]],["Budget Constraints",[["Allocating sufficient funds for ambitious projects while catering to other developmental needs.",[]]]],["Technological Innovation",[["Developing cutting-edge technologies, e.g., reusable launch vehicles, poses challenges due to resource limitations.",[]]]],["Global Competition",[["Competing with established space powers in satellite launches and technological advancements.",[]]]],["Skilled Workforce",[["Ensuring availability of skilled scientists, engineers, and technicians for research and development.",[]]]],["Commercial Viability",[["Balancing commercial ventures and national interests without compromising security.",[]]]]]],["Initiatives",[["Make in India",[["Encouraging domestic manufacturing of satellites and components, e.g., ISRO's Vikram Sarabhai Space Centre manufacturing satellite components.",[]]]],["Gaganyaan Mission",[["Human spaceflight project aims to send Indian astronauts to space, showcasing ISRO's technological prowess.",[]]]],["Space Technology Incubators",[["Establishing centers to nurture startups, e.g., Agnikul Cosmos developing 3D-printed small satellite launch vehicles.",[]]]],["Navigation Services",[["Utilizing NavIC for disaster management, agriculture, and transportation, enhancing national utility.",[]]]],["Space Education",[["Promoting space education and research, e.g., IIST Thiruvananthapuram offering specialized courses in space science and engineering.",[]]]]]],["Future Prospects",[["Gaganyaan Mission",[["Sending Indian astronauts to space, fostering human spaceflight capabilities and global recognition.",[]]]],["Interplanetary Exploration",[["Continuing exploration of Mars, Venus, and beyond, unraveling mysteries of the solar system.",[]]]],["Commercial Launch Services",[["Expanding commercial satellite launch services, enhancing revenue and technological advancements.",[]]]],["Space Tourism",[["Pioneering space tourism, offering civilians an opportunity to experience space travel.",[]]]],["Innovative Satellite Applications",[["Leveraging satellites for disaster management, climate monitoring, and telecommunication.",[]]]]]],["Conclusion",[["India's space sector's achievements reflect its commitment to technological innovation and exploration. Overcoming challenges and harnessing opportunities will pave the way for a prosperous and pioneering future in space endeavors.",[]]]]]},{"id":"G2|120","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"5.Robotics Sector","p":236,"ch":"","items":[["Overview",[["Robotics, designing and operating robots, revolutionizes sectors like manufacturing, healthcare, and space exploration in India.",[]]]],["Applications",[["Manufacturing",[["Robotic arms in automobile assembly lines ensure precision, e.g., Maruti Suzuki's use of robotic welding for car body fabrication.",[]]]],["Healthcare",[["Surgical robots like Da Vinci assist in complex surgeries, improving outcomes with precise movements, as seen in AIIMS, New Delhi.",[]]]],["Agriculture",[["Drones monitor crops, spray pesticides, e.g., Tamil Nadu's use of drones for pest control in agriculture.",[]]]],["Space Exploration",[["ISRO's Mars Orbiter Mission showcases robotic prowess, enabling interplanetary exploration.",[]]]],["Service Industry",[["Hotel Crown Plaza Gurgaon's \"Rover\" delivers room service, enhancing guest experience.",[]]]],["Challenges",[]],["Job Displacement",[["Automation poses job loss risk, e.g., Tata Motors automating some tasks leading to workforce concerns.",[]]]],["Ethical Dilemmas",[["Concerns over autonomous weapons raise questions about responsible use, as witnessed in debates on AI-powered drones.",[]]]],["Regulation Gap",[["Lack of clear regulations raises safety issues, e.g., unmanned aerial vehicles causing security concerns at airports.",[]]]],["Safety Concerns",[["Ensuring human-robot interaction safety, e.g., Hyundai's safety robots in India's healthcare sector.",[]]]],["Technological Limitations",[["Complex tasks like understanding emotions remain challenging, as seen in limited AI-driven customer service bots.",[]]]]]],["Initiatives",[["Digital India",[["Promotes automation, AI, e.g., HDFC Bank's Eva chatbot, enhancing customer service efficiency.",[]]]],["Atal Innovation Mission",[["Encourages innovation, e.g., startup Vicara's humanoid robot \"Mitra\" assists COVID-19 patients in hospitals.",[]]]],["Make in India",[["Fosters local production, e.g., KUKA Robotics India assembling industrial robots in Pune.",[]]]],["Startup Incubators",[["Nurtures innovation, e.g., Emotix's \"Miko\" educational robot enhances child learning experiences.",[]]]],["Research Collaborations",[["Industry-academia partnerships, e.g., IIT Kanpur's collaboration with Aerial Robotics startup ideaForge.",[]]]]]],["Future Prospects",[["Collaborative Robots",[["Human-robot interaction, e.g., Tata Steel's robot-human collaboration for efficient steel production.",[]]]],["Medical Robotics",[["Enhanced healthcare, e.g., AIIMS's AI-driven robots aiding in patient monitoring and assistance.",[]]]],["Autonomous Vehicles",[["Self-driving cars and drones, e.g., Amazon's drone deliveries for swift and contactless delivery.",[]]]],["AI Integration",[["Informed decision-making, e.g., Wipro's \"Holmes\" AI platform improving business operations.",[]]]],["Space Robotics",[["Satellite maintenance, e.g., ISRO's \"Robotic Arm\" on Mars Orbiter Mission for in-space tasks.",[]]]]]],["Conclusion",[["Robotics, redefining industries, requires careful handling of job displacement and ethical challenges. India's innovation and regulations will shape a future where robots and humans collaborate for unprecedented advancements.",[]]]]]},{"id":"G2|121","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"6.Biotechnology","p":238,"ch":"","items":[["Biotechnology: Overview, Applications, Challenges, and Future",[]],["Overview",[["Biotechnology involves harnessing biological systems, organisms, or derivatives to develop products and applications that benefit society. India has made significant strides in biotechnology, with institutions like ISRO, IITs, and research organizations driving advancements.",[]]]],["Applications",[["Healthcare",[["Medical diagnostics, drug development, and personalized medicine. Bharat Biotech's Covaxin, a COVID-19 vaccine, exemplifies India's biotech achievements.",[]]]],["Agriculture",[["Genetically modified crops for increased yield and pest resistance. Bt cotton and Bt brinjal for enhanced productivity.",[]]]],["Environment",[["Bioremediation using microorganisms to clean polluted environments. Oil spill cleanup using biodegrading agents.",[]]]],["Industrial Biotech",[["Enzymes for detergent production, biofuels, and bioplastics. Use of enzymes in paper and textile industries.",[]]]],["Pharmaceuticals",[["Production of therapeutic proteins using recombinant DNA technology. Insulin production from genetically modified bacteria.",[]]]],["Challenges",[]],["Ethical Concerns",[["Moral issues surrounding genetic modifications and human cloning. Balancing advancements with ethical boundaries.",[]]]],["Regulation",[["Stringent regulatory frameworks for biotech products to ensure safety and efficacy.",[]]]],["Biodiversity Protection",[["Preventing genetic erosion and loss of biodiversity due to biotech practices.",[]]]],["Public Perception",[["Addressing concerns and misinformation about biotechnology's safety and impact.",[]]]],["Intellectual Property",[["Challenges in patenting biotech inventions due to complexities in defining novelty and utility.",[]]]]]],["Initiatives",[["DBT",[["The Department of Biotechnology supports research, infrastructure, and human resource development in biotech.",[]]]],["BIRAC",[["Biotechnology Industry Research Assistance Council supports innovative research and startups.",[]]]],["National Biotechnology Parks",[["Promotes collaborative research between academia and industry.",[]]]],["Genome India Project",[["Aims to sequence the genetic diversity of Indians for precision medicine.",[]]]],["Bio-incubators",[["Promote biotech startups and innovations by providing resources and mentorship.",[]]]]]],["Future",[["Precision Medicine",[["Tailoring medical treatments based on individual genetic makeup.",[]]]],["Synthetic Biology",[["Creating novel biological systems for various applications.",[]]]],["Agricultural Advancements",[["Developing drought-resistant, nutrient-rich crops using biotechnology.",[]]]],["Bioplastics and Biofuels",[["Environmentally friendly alternatives to plastics and fossil fuels.",[]]]],["Gene Editing",[["Advanced gene editing techniques like CRISPR-Cas9 for targeted genetic modifications.",[]]]]]],["Conclusion",[["Biotechnology's vast applications in healthcare, agriculture, and industry hold immense promise. With ethical awareness, robust regulations, and ongoing initiatives, India is poised to harness biotechnology's potential for transformative advancements.",[]]]]]},{"id":"G2|122","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"7.Nanotechnology","p":239,"ch":"","items":[["Nano-Technology: Overview, Applications, Challenges, and Future",[]],["Overview",[["Nano-technology involves manipulating matter at the nanoscale (1-100 nanometers) to create new materials and devices. It explores the unique properties of materials at this scale. India has been actively involved in nanotechnology research, with institutions like IITs and NCL leading advancements.",[]]]],["Applications",[["Medicine",[["Targeted drug delivery, imaging, and early disease detection. Nanoparticles for cancer therapy, like Bharat Biotech's Covaxin for COVID-19.",[]]]],["Electronics",[["Miniaturization of components, enhancing device performance. Nanoscale transistors in electronics, making gadgets more efficient.",[]]]],["Textiles",[["Stain-resistant, antimicrobial fabrics. Nano-enhanced textiles for sports gear and medical textiles.",[]]]],["Energy",[["Efficient solar cells, energy storage, and fuel cells. Tata Power Solar's use of nanotechnology in solar panels.",[]]]],["Environment",[["Water purification, air pollution control, and sustainable materials. Nanotechnology-based water filters and air purifiers.",[]]]],["Food",[["Enhanced packaging, improved nutritional content, and quality control. Nanotech-based sensors for food safety.",[]]]],["Challenges",[]],["Safety Concerns",[["Potential health and environmental risks of nanoparticles. Regulation and risk assessment are essential.",[]]]],["Ethical Issues",[["Responsible use of nanotechnology, ensuring its benefits outweigh risks. Ethical implications of nanotechnology in medicine.",[]]]],["Regulation",[["Lack of standardized regulations globally. Need for international collaboration to ensure safe practices.",[]]]],["Commercialization",[["Transition from lab-scale to large-scale production poses challenges. Cost-effective mass production is a hurdle.",[]]]],["Public Awareness",[["Lack of awareness about nanotechnology's potential and limitations. Importance of educating the public.",[]]]]]],["Initiatives",[["Nano Mission",[["Indian government's initiative to promote nanotechnology research. Funds for research, infrastructure, and training.",[]]]],["Nanotech Parks",[["Establishing nanotechnology research and incubation centers. IIT Bombay's Society for Innovation and Entrepreneurship (SINE).",[]]]],["Research Collaborations",[["Partnerships between academia, research institutions, and industry. CSIR-NCL collaborating with companies for nanotech innovations.",[]]]],["Skill Development",[["Training programs to nurture skilled workforce for nanotechnology research and development.",[]]]],["Regulatory Framework",[["Developing guidelines for safe and responsible use of nanotechnology in different sectors.",[]]]]]],["Future",[["Healthcare Revolution",[["Nanomedicine for personalized treatments, early disease detection, and precise drug delivery.",[]]]],["Advanced Electronics",[["Nanoscale components for faster, more energy-efficient electronics.",[]]]],["Clean Energy",[["Nanotech-enhanced solar cells, energy storage solutions for renewable energy.",[]]]],["Environmental Solutions",[["Nanoparticles for effective pollution control and water purification.",[]]]],["Smart Materials",[["Nanotech-based materials with unique properties for various applications.",[]]]],["Green Nanotechnology",[["Environment-friendly approaches to nanotechnology, reducing environmental impact.",[]]]]]],["Conclusion",[["Nano-technology holds transformative potential across sectors like medicine, electronics, and energy. Despite challenges, strategic research, regulation, and awareness can ensure its responsible and impactful integration into various fields.",[]]]]]},{"id":"G2|123","s":"G2","g":"GS-3 · Block-4 (SnT)","t":"8.Intellectual Protecting Rights (IPR) & Issues Related to it","p":241,"ch":"","items":[["Introduction",[["Intellectual Property Rights (IPR) encompass legal protections for intangible creations, fostering innovation, creativity, and economic growth.",[]]]],["Types of IPR",[["Copyright",[["Protection for authors, composers, and artists. Example: Copyright of Bollywood movies preserves revenue for the film industry.",[]]]],["Patent",[["Incentivizes inventions. Example: Indian company Bharat Biotech holds patents for vaccines, driving indigenous vaccine development.",[]]]],["Trademark",[["Brand protection. Example: The Tata logo distinguishes Tata Group products in diverse industries.",[]]]],["Trade Secret",[["Business confidentiality. Example: Coca-Cola's secret formula remains confidential for competitive advantage.",[]]]],["Industrial Design",[["Visual design protection. Example: The unique design of Royal Enfield motorcycles differentiates the brand.",[]]]]]],["Importance of IPR",[["Incentive for Innovation",[["IPR motivates Indian researchers to invent and create, leading to technological advancements.",[]]]],["Economic Growth",[["Attracts foreign investment, spurs startups, and contributes to GDP growth.",[]]]],["Consumer Protection",[["Ensures quality and authenticity of products, preventing counterfeit goods in the market.",[]]]],["Technology Transfer",[["Attracts global companies for collaborations, boosting technology transfer to India.",[]]]],["Cultural Preservation",[["Protects traditional knowledge, preventing misappropriation of indigenous wisdom.",[]]]],["Challenges",[]],["Piracy and Counterfeiting",[["Example: Pirated Bollywood DVDs and counterfeit luxury goods impact Indian industries.",[]]]],["Lack of Awareness",[["Example: Artisans' designs being copied due to limited understanding of IPR rights.",[]]]],["Global Variations",[["Example: Patents registered in India may not prevent infringement in other countries.",[]]]],["Patent Trolls",[["Example: Foreign entities exploiting patent loopholes against Indian pharmaceutical companies.",[]]]],["Digital Age Challenges",[["Example: Unauthorized online streaming and downloading of music and movies.",[]]]]]],["Solutions and Initiatives",[]],["Solutions and Initiatives",[["Education and Awareness",[["Government and organizations promoting IPR education among creators and the public. Example: IP workshops for artists and startups.",[]]]],["Strengthening Laws",[["Regular updates and amendments to IPR laws to address emerging challenges. Example: Updating copyright laws for digital content distribution.",[]]]],["Enforcement Mechanisms",[["Improved enforcement through specialized IPR enforcement agencies and digital monitoring tools. Example: Customs seizing counterfeit goods at borders.",[]]]],["International Cooperation",[["Bilateral and multilateral agreements for harmonizing IPR protection globally. Example: WIPO treaties promoting cross-border IP rights.",[]]]],["Alternative Dispute Resolution",[["Encouraging mediation and arbitration to resolve IPR disputes efficiently. Example: Domain name dispute resolution mechanisms.",[]]]]]],["Future Trends",[["Digital Rights Management",[["Encryption and access controls combat digital piracy.",[]]]],["Open Source Movement",[["Collaborative development of software and content under permissive licenses.",[]]]],["Blockchain and IPR",[["Blockchain secures digital assets and establishes ownership.",[]]]],["Green Technologies",[["Protecting innovations in sustainable energy and environment.",[]]]],["Artificial Intelligence and IPR",[["Navigating the legal complexities of AI-generated content and inventions.",[]]]]]],["Conclusion",[["IPR's role in India's growth is evident through examples like indigenous vaccine patents and Bollywood copyrights. Addressing challenges and embracing trends will ensure IPR continues to fuel innovation and economic prosperity in India.",[]]]]]},{"id":"G2|124","s":"G2","g":"GS-3 · Block-5 (Disaster and Environment)","t":"1.Environmental Impact Assessment","p":243,"ch":"","items":[["Introduction",[["EIA is a process to assess potential environmental impacts of developmental projects before approval, ensuring sustainable development.",[]]]],["Importance of EIA",[["Preventive Measure",[["Identifies potential adverse impacts on the environment and helps design mitigative measures.",[]]]],["Informed Decision-Making",[["Provides valuable insights to policymakers, helping them make informed choices.",[]]]],["Public Participation",[["Engages communities and stakeholders in the decision-making process.",[]]]],["Legal Compliance",[["Ensures projects adhere to environmental regulations and standards.",[]]]],["Sustainable Development",[["Balances economic growth with environmental conservation.",[]]]],["Steps in EIA",[]],["Screening",[["Determines if the project requires a detailed EIA based on its size and potential impact.",[]]]],["Scoping",[["Defines the boundaries of the study, identifies key impacts, and gathers baseline data.",[]]]],["Assessment",[["Analyzes potential impacts and formulates mitigation strategies.",[]]]],["Review and Approval",[["Expert committee evaluates the EIA report and recommends approvals or modifications.",[]]]],["Monitoring and Compliance",[["Ensures implementation of mitigation measures and assesses actual impacts.",[]]]],["Examples of EIA Impact Categories",[]],["Air Quality",[["Thermal power plant emissions affecting air quality and respiratory health.",[]]]],["Water Resources",[["Dam construction impacting river ecosystems and downstream water availability.",[]]]],["Biodiversity",[["Deforestation for infrastructure projects leading to habitat loss.",[]]]],["Social and Cultural Impacts",[["Displacement of local communities due to mining projects.",[]]]],["Noise Pollution",[["Construction activities affecting nearby residential areas.",[]]]],["Challenges",[]],["Incomplete Data",[["Lack of comprehensive baseline data affects accurate impact assessment.",[]]]],["Bias in Reports",[["Developers sometimes influence the content and conclusions of EIA reports.",[]]]],["Cumulative Impact",[["Failure to consider cumulative impacts of multiple projects in an area.",[]]]],["Lack of Public Awareness",[["Communities often unaware of their rights and participation opportunities.",[]]]],["Enforcement Issues",[["Weak regulatory mechanisms lead to non-compliance and inadequate monitoring.",[]]]]]],["Initiatives and Solutions",[["Digital Platforms",[["Online submission and monitoring of EIAs enhance transparency.",[]]]],["Strengthening Regulatory Bodies",[["Empowering regulatory agencies for effective monitoring and enforcement.",[]]]],["Capacity Building",[["Training and sensitizing officials, professionals, and local communities.",[]]]],["Public Consultations",[["Ensuring public hearings are conducted impartially and inclusively.",[]]]],["Incorporating Scientific Advances",[["Using modern technology like remote sensing for accurate impact assessment.",[]]]]]]]},{"id":"G2|125","s":"G2","g":"GS-3 · Block-5 (Disaster and Environment)","t":"2.Disaster and Disaster Management.","p":245,"ch":"","items":[["Landslides: Definition, Causes, and Mitigation",[]],["Definition",[["Landslides are the downward movement of rock, soil, and debris along a slope, often triggered by natural factors or human activities.",[]],["Causes",[]],["Natural Factors",[["Heavy rainfall, earthquakes, volcanic activity, and rapid snowmelt.",[]]]],["Human Activities",[["Deforestation, construction, mining, and improper land use.",[]]]]]],["Mitigation Initiatives",[["Early Warning Systems",[["Real-time monitoring using sensors and satellite data to predict landslides.",[]]]],["Afforestation",[["Planting trees to stabilize soil and prevent erosion on slopes.",[]]]],["Terracing",[["Creating steps on steep slopes to control water flow and reduce erosion.",[]]]],["Land-use Planning",[["Regulating construction and development in vulnerable areas.",[]]]],["Public Awareness",[["Educating communities about landslide risks and safety measures.",[]]]],["Example: In 2018, the Kedarnath disaster in Uttarakhand, India, resulted from a combination of heavy rainfall and human interventions. It highlighted the importance of effective disaster management to prevent such incidents.",[]]]],["Urban Floods: Causes, Impacts, and Mitigation",[["Causes",[]],["Poor Drainage",[["Inadequate urban planning and clogged drains due to waste accumulation.",[]]]],["Encroachment",[["Filling natural water bodies for construction, reducing flood absorption capacity.",[]]]],["Climate Change",[["Increased intensity of rainfall leading to sudden floods.",[]]]],["Impacts",[]],["Property Damage",[["Homes, infrastructure, and businesses are affected.",[]]]],["Health Risks",[["Waterborne diseases and contamination of drinking water.",[]]]],["Economic Loss",[["Disruption of businesses and transportation, loss of livelihoods.",[]]]]]],["Mitigation Initiatives",[["Integrated Drainage Systems",[["Constructing efficient drainage networks to manage excess water.",[]]]],["Urban Planning",[["Zoning to prevent construction in flood-prone areas.",[]]]],["Rainwater Harvesting",[["Collecting rainwater to reduce runoff and recharge groundwater.",[]]]],["Elevated Infrastructure",[["Building structures above flood levels to prevent damage.",[]]]],["Green Spaces",[["Creating parks and open spaces that can absorb excess water.",[]]]],["Example: The 2015 Chennai floods were caused by unprecedented rainfall and poor urban planning, leading to extensive flooding. The disaster emphasized the need for sustainable urban development and flood management.",[]],["Role of Technology in Disaster Management",[]]]],["Early Warning Systems",[["Earthquake Alerts",[["Seismic sensors provide warnings before earthquakes strike.",[]]]],["Flood Prediction",[["Real-time data from rainfall and river levels for timely alerts.",[]]]]]],["Satellite Technology",[["Remote Sensing",[["Satellite imagery helps monitor disaster-prone areas and assess damage.",[]]]],["Communication",[["Satellites aid in maintaining communication during disasters.",[]]]]]],["GIS and Mapping",[["Vulnerability Mapping",[["Identifying high-risk areas for disaster preparedness.",[]]]],["Resource Allocation",[["GIS aids in efficient deployment of resources during emergencies.",[]]]],["Example: India's National Remote Sensing Centre (NRSC) uses satellite imagery to monitor cyclones and floods, enabling timely response and effective disaster management.",[]]]],["NDMA (National Disaster Management Authority) Guidelines",[]],["Introduction",[["NDMA is India's apex body for disaster management. It formulates policies, plans, and guidelines, aiming to build a resilient and disaster-ready nation.",[]]]],["Preparedness",[]],["Mock Drills",[["Regular simulated emergency exercises like earthquake drills in schools.",[]]]],["Training",[["NDRF's rigorous training of responders for effective disaster management.",[]]]],["Response",[]],["Multi-Agency Coordination",[["NDMA's unified command system ensures seamless collaboration among various agencies during emergencies.",[]]]],["Evacuation Plans",[["During Cyclone Fani, timely evacuation saved lives and reduced impact.",[]]]],["Recovery",[]],["Infrastructure Restoration",[["Post Kerala floods, quick rebuilding of damaged roads and bridges aided recovery.",[]]]],["Psycho-Social Support",[["After Mumbai floods, counseling provided psychological support to affected individuals.",[]]]],["Mitigation",[]],["Structural Measures",[["Earthquake-resistant buildings constructed in high-risk zones.",[]]]],["Awareness Programs",[["NDMA's campaigns educate communities on disaster preparedness, like the Tsunami Ready initiative.",[]]]],["Information Dissemination",[]],["Early Warning Systems",[["IMD's advanced cyclone tracking provided timely alerts during Cyclone Amphan.",[]]]],["Public Awareness",[["NDMA's social media campaigns educate citizens on actions to take during disasters.",[]]]]]},{"id":"G2|126","s":"G2","g":"GS-3 · Block-6 (Security-1)","t":"1.Linkages between Development and Spread of Extremism.","p":247,"ch":"","items":[["Linkages between Development and Spread of Extremism in India",[["Causes",[]],["Marginalization and Naxalism",[["Underdeveloped tribal regions in Chhattisgarh, Jharkhand, and Odisha have seen Naxalism flourish due to lack of access to basic services and opportunities.",[]]]],["Unemployment and Radicalization",[["High youth unemployment in Jammu and Kashmir has led to radicalization and involvement in militant groups.",[]]]],["Economic Disparities",[["Widening economic disparities between regions and communities can create a breeding ground for extremist ideologies.",[]]]],["Resource Conflicts",[["Disputes over land, minerals, and other resources can lead to social unrest and provide openings for extremist groups.",[]]]],["Examples",[]],["Naxalism in Tribal Areas",[["The Naxal movement has taken root in areas with limited development and government presence, exploiting the discontent among tribal populations.",[]]]],["Youth Radicalization in Kashmir",[["Youths, frustrated by unemployment and political unrest, have been drawn towards militancy in the past.",[]]]]]],["Countermeasures and Initiatives",[["Inclusive Development through MGNREGA",[["The Mahatma Gandhi National Rural Employment Guarantee Act provides employment, reducing economic disparities and extremism's appeal.",[]]]],["Special Schemes for Vulnerable Areas",[["'Special Central Assistance to Scheduled Castes Sub Plan' uplifts marginalized communities and reduces their vulnerability to extremism.",[]]]],["Community Policing",[["'Operation Smile' in Chhattisgarh empowers local communities to maintain security, building trust with law enforcement.",[]]]],["Youth Engagement",[["'Udaan' in Jammu and Kashmir offers skill training and jobs to young people, steering them away from extremist ideologies.",[]]]],["Promotion of Education",[["'Padhe Bharat Badhe Bharat' campaign encourages primary education, preventing potential indoctrination of youth by extremists.",[]]]]]],["State Government Initiatives",[["Andhra Pradesh's Community Policing",[["The 'Greyhounds' program engages local communities in countering Naxalism and promoting development.",[]]]],["Jharkhand's Livelihood Promotion",[["'Mukhyamantri Krishi Ashirwad Yojana' provides direct cash transfer to farmers, addressing rural distress and extremism.",[]]]],["Odisha's Tribal Development",[["'Ama Gaon Ama Bikash' initiative focuses on tribal welfare, ensuring equitable development and reducing susceptibility to extremism.",[]]]],["Kerala's Rehabilitation Program",[["'Operation Sulaimani' tackles unemployment by providing free meals to needy, preventing desperation that can lead to radicalization.",[]]]]]]]},{"id":"G2|127","s":"G2","g":"GS-3 · Block-6 (Security-1)","t":"2.Role of External State and Non-state Actors in creating challenges to Internal Security.","p":249,"ch":"","items":[["Role of External State and Non-State Actors in Challenging India's Internal Security",[]],["State Actors",[["Proxy Warfare by Pakistan",[["State-sponsored terrorism by Pakistan involves infiltrating militants into Indian territory to create unrest in Jammu and Kashmir.",[]]]],["Example: Mumbai 26/11 attacks were orchestrated by Pakistan- based Lashkar-e-Taiba, highlighting external actors' impact on internal security, Pulwama Attack.",[]],["China's Strategic Encirclement",[["China's involvement in border disputes and infrastructure projects near India's borders raises security concerns.",[]]]],["Example: Doklam standoff brought to fore China's assertiveness in border areas, impacting India's internal security landscape.",[]]]],["Non-State Actors",[["Radicalization by Extremist Groups",[["International terrorist organizations like ISIS and Al-Qaeda attempt to radicalize Indian youth through online platforms.",[]]]],["Example: The Kerala ISIS module involving Indian citizens showcased the influence of non-state actors in radicalization.",[]],["Drug and Arms Trafficking",[["Non-state actors engage in illegal drug and arms trade, destabilizing regions and fueling criminal activities.",[]]]],["Example: Punjab's drug menace partly fueled by cross-border drug trafficking highlights non-state actors' role in internal security challenges.",[]],["Challenges",[]],["Sovereignty and Border Security",[["Infiltration attempts and territorial claims challenge India's sovereignty and border security.",[]]]],["Ethnic and Religious Tensions",[["External actors can exploit India's diversity, fueling ethnic and religious conflicts for their strategic gains.",[]]]]]],["Solutions",[["Effective Diplomacy",[["Engaging with neighbors and international organizations to address disputes through peaceful means is crucial.",[]]]],["Enhanced Border Management",[["Strengthening border infrastructure and surveillance to counter infiltration and transnational threats.",[]]]]]],["Initiatives",[["Neighborhood First Policy",[["India's foreign policy aims to strengthen ties with neighboring countries to promote regional stability.",[]]]],["Counter-Terrorism Cooperation",[["Bilateral and multilateral mechanisms like BIMSTEC and SCO facilitate intelligence sharing and counter-terrorism efforts.",[]]]]]],["Conclusion",[["External state and non-state actors pose significant challenges to India's internal security through proxy warfare, radicalization, and illicit activities. Addressing these threats requires diplomatic engagement, robust border management, international cooperation, and stringent counter-terrorism efforts. Vigilance and collaboration are key to safeguarding India's sovereignty and internal stability.",[]]]]]},{"id":"G2|128","s":"G2","g":"GS-3 · Block-6 (Security-1)","t":"3.Security Challenges and their Management in Border Areas","p":250,"ch":"","items":[["Security Challenges and their Management in Border Areas",[["Challenges",[]],["Infiltration and Cross-Border Terrorism",[["Border areas witness infiltration by militants, leading to security threats and terror attacks.",[]]]],["Example: Uri attack in 2016, where militants infiltrated and attacked an Indian Army base, highlighting the security challenge.",[]],["Transnational Crime and Smuggling",[["Border regions become hubs for human trafficking, drug smuggling, and arms trade.",[]]]],["Example: The Indo-Bangladesh border sees smuggling of drugs, counterfeit currency, and illegal migrants, impacting security.",[]]]],["Committee Recommendations",[["Madhukar Gupta Committee",[["Suggested measures to address gaps in border infrastructure, technology, and personnel to curb illegal activities along the India- Pakistan border.",[]]]],["D.P. Aggarwal Committee",[["Recommended steps to enhance border management through improved coordination, infrastructure, and community involvement along the India-China border.",[]]]]]],["Management Strategies",[["Smart Border Surveillance",[["Use of modern technology like sensors, cameras, and drones to monitor border areas and detect intrusions.",[]]]],["Example: The Comprehensive Integrated Border Management System (CIBMS) employs technology for real-time border surveillance.",[]],["Community Participation",[["Involving local communities in border security by creating awareness and garnering support against anti-national activities.",[]]]],["Example: Village Defense Committees in Jammu and Kashmir involve locals in assisting security forces against threats.",[]]]],["Case Study: Indo-Bangladesh Border Management",[["The India-Bangladesh border faces challenges such as smuggling, illegal migration, and infiltration. The Joint Border Management Plan (JBMP) aims to enhance cooperation and coordination between the two countries' border security agencies.",[]]]],["Recommendation",[]],["H.S. Brahma Committee",[["Proposed measures like technology-driven border management, increased diplomatic engagement, and development projects to address challenges along the India-Bangladesh border.",[]]]],["Conclusion",[["Border areas encounter security challenges like cross-border terrorism and transnational crime. Implementing committee recommendations, utilizing technology, involving local communities, and fostering cooperation with",[]],["neighbouring countries are essential for effective border management and ensuring national security.",[]]]]]},{"id":"G2|129","s":"G2","g":"GS-3 · Block-6 (Security-1)","t":"4.Linkages of Organised Crime with Terrorism.","p":252,"ch":"","items":[["Definition of Terrorism",[["Terrorism refers to the use of violence, intimidation, or coercion to achieve political, ideological, religious, or social objectives by targeting civilians, causing fear, and destabilizing societies.",[]]]],["Types of Terrorism",[["State-Sponsored Terrorism",[["When a state supports, funds, or harbors terrorist groups to achieve its political goals, often using them as proxies against rivals.",[]]]],["Example: Pakistan's alleged support to terror groups like Lashkar-e-Taiba to further its objectives in India and Afghanistan.",[]],["Religious Terrorism",[["Driven by extremist interpretations of religious beliefs, seeking to establish a specific religious order or target perceived enemies.",[]]]],["Example: The ISIS aiming to establish a caliphate through acts of terror and violence.",[]],["Ethnic/Nationalist Terrorism",[["Advocates for a specific ethnic or national group's interests, often seeking autonomy or independence through violence.",[]]]],["Example: The Tamil Tigers in Sri Lanka pursuing an independent Tamil state through violent means.",[]],["Ideological Terrorism",[["Based on extreme ideologies, aiming to challenge or overthrow prevailing political or social systems.",[]]]],["Example: The Red Brigades in Italy pursued an ideology to dismantle capitalist structures through violent means.",[]]]],["Linkages of Organised Crime with Terrorism",[["Funding",[["Terrorist groups often engage in criminal activities like drug trafficking, smuggling, and extortion to fund their operations.",[]]]],["Example: The Taliban's involvement in opium cultivation and trade in Afghanistan provides them with significant financial resources.",[]],["Logistical Support",[["Organised crime networks can provide terrorists with safe havens, transportation, and forged documents.",[]]]],["Example: Mafia groups assisting terror operatives in entering a country illegally using their network connections.",[]],["Weapons Procurement",[["Terrorists may collaborate with criminal networks to acquire illegal firearms and explosives.",[]]]],["Example: The Mumbai terror attacks in 2008 involved the use of smuggled weapons and explosives.",[]],["Money Laundering",[["Criminal networks help terrorists legitimize their funds by laundering money through legal businesses.",[]]]],["Example: Hawala networks used for money laundering to fund terrorist activities.",[]]]],["Initiatives",[["Financial Action Task Force (FATF)",[["An international body that combats money laundering and terrorist financing through global cooperation and regulations.",[]]]],["Joint Task Forces",[["Collaborative efforts between law enforcement agencies to address both organised crime and terrorism.",[]]]]]],["Conclusion",[["Terrorism manifests in various forms, driven by religious, ideological, ethnic, or national motivations. The convergence of organised crime and terrorism poses a significant security challenge globally, necessitating comprehensive strategies involving international cooperation, intelligence sharing, and coordinated law enforcement efforts.",[]]]]]},{"id":"G2|130","s":"G2","g":"GS-3 · Block-6 (Security-1)","t":"5.Various Security Forces and Agencies and their Mandate.","p":253,"ch":"","items":[["National Security Guard (NSG)",[["Specialized counter-terrorism force. Successfully neutralized terrorists in the 2008 Mumbai attacks.",[]]]],["Central Reserve Police Force (CRPF)",[["Expertise in counter-insurgency. Efforts in Operation Green Hunt against Naxalism.",[]]]],["Border Security Force (BSF)",[["Ensures border security. Prevents infiltration attempts, thwarting terror incursions.",[]]]],["Central Industrial Security Force (CISF)",[["Safeguards vital installations. Ensures airport security against potential threats.",[]]]],["National Investigation Agency (NIA)",[["Investigates terrorism-related cases. Apprehended suspects involved in the Pulwama attack.",[]]]],["Intelligence Bureau (IB)",[["Gathers actionable intelligence. Tracks and prevents terror activities through timely information.",[]]]],["RAW (Research and Analysis Wing)",[["Manages external intelligence. Facilitated successful surgical strikes against terrorist camps.",[]]]],["State Police",[["Crucial in countering local terrorism. Local intelligence efforts help track and prevent terror activities.",[]]]],["Interpol",[["Facilitates global police cooperation. Played a role in arresting a cross- border terror suspect.",[]]]],["United Nations Security Council (UNSC)",[["Enforces global counter-terrorism measures. Imposes sanctions disrupting terror funding networks.",[]]]],["Joint Counter Terrorism Mechanism (JCTM)",[["India-US partnership identifies global terror networks.",[]]]],["Global Counterterrorism Forum (GCTF)",[["Promotes counter-terrorism best practices. Shares knowledge to enhance anti-terror capacities.",[]]]]]},{"id":"G2|131","s":"G2","g":"GS-3 · Block-7 (Security-2)","t":"1.Challenges to Internal Security through Communication Networks","p":254,"ch":"","items":[["Challenges to Internal Security through Communication Networks",[]],["Cyber Threats",[]],["Definition",[["Cyber threats involve attacks on computer systems and networks to compromise data, disrupt services, or steal sensitive information.",[]],["Examples: Ransomware attacks like WannaCry and NotPetya disrupted critical services globally. In India, the Kudankulam Nuclear Power Plant faced a cyber attack.",[]]]],["Social Media Misuse",[]],["Definition",[["Exploitation of social media platforms for spreading misinformation, inciting violence, and recruiting terrorists.",[]],["Examples: ISIS effectively used platforms like Twitter for recruitment. Rumors spread through WhatsApp led to mob violence incidents in India.",[]]]],["Data Breaches",[]],["Definition",[["Unauthorized access to confidential data, resulting in its exposure or misuse.",[]],["Examples: The data breach in the Aadhaar database compromised personal information of millions. Banking apps have been targeted, leading to financial losses.",[]]]],["Phishing Attacks",[]],["Definition",[["Fraudulent attempts to gather sensitive information through disguised emails or websites.",[]],["Examples: Fraudsters sending emails posing as banks to get account details. State-sponsored attacks targeting government officials' emails.",[]]]],["Dark Web",[]],["Definition",[["Hidden part of the internet used for illegal activities, including drug trafficking, arms trade, and cybercrime.",[]],["Examples: Dark web marketplaces like Silk Road facilitated illegal trade. Cybercriminals offer hacking services for financial gains.",[]]]],["Encryption Challenges",[]],["Definition",[["Balancing individual privacy and national security when dealing with encrypted data.",[]],["Examples: WhatsApp's end-to-end encryption hindered investigations in some criminal cases. Government requests for decryption raise concerns about privacy.",[]]]],["Insider Threats",[]],["Definition",[["Threats posed by individuals with authorized access to systems, who misuse their privileges.",[]],["Examples: Edward Snowden leaked classified NSA documents. Insider threat led to data breaches at various organizations.",[]]]],["Combating Challenges",[]],["Technology Upgradation",[["Employ advanced tools to detect and counter cyber threats.",[]]]],["Collaboration",[["International cooperation to track and apprehend cybercriminals across borders.",[]]]],["Public Awareness",[["Educate users about safe online practices to avoid falling victim to cyber threats.",[]]]],["Legal Frameworks",[["Strengthen laws to address cybercrime, ensuring stringent punishments.",[]]]],["Government Initiatives",[]],["National Cyber Security Policy (2013)",[["Aims to safeguard cyberspace, enhance cybersecurity, and protect critical information infrastructure.",[]]]],["CERT-In",[["India's national agency for responding to cybersecurity incidents, providing alerts and guidelines to safeguard against threats.",[]]]],["Conclusion",[["The interconnected digital world presents various challenges to internal security through communication networks. Vigilance, technological advancements, and global cooperation are essential to mitigate these threats effectively.",[]]]]]},{"id":"G2|132","s":"G2","g":"GS-3 · Block-7 (Security-2)","t":"2.Role of Media and Social Networking Sites in Internal Security Challenges","p":256,"ch":"","items":[["Role of Media and Social Networking Sites in Internal Security Challenges",[]],["Dissemination of Information",[["Role: Media plays a vital role in informing the public about incidents, threats, and government actions related to internal security.",[]],["Example: News coverage of terrorist attacks helps citizens stay vigilant and authorities respond effectively.",[]]]],["Sensationalism and Panic",[["Role: Media's sensational reporting of incidents can create panic, hinder investigations, and cause unnecessary alarm.",[]],["Example: Overhyping certain incidents can lead to public fear and irrational behavior during emergencies.",[]]]],["Fake News and Misinformation",[["Role: Social networking sites can spread false information, leading to confusion and potential security threats.",[]],["Example: False rumors on social media about communal tensions can escalate tensions and disrupt peace.",[]]]],["Manipulation of Narratives",[["Role: Media and social media can be used to shape perceptions, incite violence, and spread extremist ideologies.",[]],["Example: Terrorist organizations exploit social media to recruit sympathizers and radicals.",[]]]],["Surveillance and Monitoring",[["Role: Media's investigative journalism and social media posts can expose security vulnerabilities and hold authorities accountable.",[]],["Example: Whistleblowers sharing information on corruption can lead to actions against corrupt officials.",[]]]],["Combating Challenges",[]],["Media Ethics",[["Responsible reporting, fact-checking, and avoiding sensationalism to prevent misinformation.",[]]]],["Digital Literacy",[["Educating citizens about identifying and verifying reliable sources of information.",[]]]],["Social Media Regulations",[["Implementing guidelines to curb the spread of hate speech and misinformatio thorities.",[]]]],["Customer Due Diligence (CDD)",[["Thoroughly assessing customer background and transaction patterns to identify potential risks.",[]]]],["Transaction Monitoring",[["Real-time tracking of financial transactions to detect and report any irregular activities.",[]]]],["Prevention Steps in India",[]],["Prevention of Money Laundering Act (PMLA), 2002",[["Enacted to prevent money laundering and establish measures to combat it.",[]]]],["Financial Intelligence Unit - India (FIU-IND)",[["Central agency to collect, analyze, and disseminate information related to suspicious transactions.",[]]]],["KYC Norms",[["Financial institutions are required to establish the identity of customers and monitor transactions to prevent money laundering.",[]]]],["Reporting Entities (REs)",[["Entities like banks, financial institutions, and intermediaries are mandated to report suspicious transactions.",[]]]],["Benami Transactions (Prohibition) Act, 1988",[["Prevents transactions involving benami properties and empowers confiscation of such properties.",[]]]],["Demonetization",[["Move to curb black money by invalidating high- denomination currency notes in circulation.",[]]]],["Amendments",[["Regular amendments and updates to existing laws to strengthen the anti-money laundering framework.",[]]]],["Challenges",[]],["Global Nature",[["Money laundering often involves cross-border transactions and jurisdictions.",[]]]],["Technological Advancements",[["Digital platforms and cryptocurrencies provide new avenues for money laundering.",[]]]],["Complex Transactions",[["Evolving methods make detection and prevention challenging.",[]]]],["Steps Taken at International Level",[]],["Financial Action Task Force (FATF)",[["International organization setting standards and promoting effective implementation of legal, regulatory, and operational measures against money laundering.",[]]]],["Mutual Legal Assistance Treaties (MLATs)",[["Agreements between countries to assist each other in criminal investigations, including money laundering cases.",[]]]],["United Nations Convention against Transnational Organized Crime Aims to combat organized crime, including money laundering, through international cooperation.",[]],["Bilateral Agreements",[["Countries collaborate to exchange information and intelligence for the prevention and investigation of money laundering cases.",[]]]],["Modes of Money Laundering",[["Shell Companies",[["Creating fictitious companies to hide the origin of illicit funds. Example: Fake corporations used to move money across borders unnoticed.",[]]]],["Trade-Based Laundering",[["Manipulating trade transactions to obscure the source of funds. Example: Over-invoicing or under-invoicing goods to move money undetected.",[]]]],["Smurfing or Structuring",[["Breaking down large transactions into smaller amounts to avoid suspicion. Example: Depositing multiple small sums in different accounts.",[]]]],["Underground Banking or Hawala",[["Informal money transfer systems that bypass regular banking channels. Example: Transferring money through hawala networks.",[]]]],["Real Estate Investments",[["Investing illicit funds in real estate to legitimize their source. Example: Buying properties with illegal money.",[]]]],["Gambling and Casinos",[["Converting illegal funds into gambling chips and then cashing out. Example: Betting dirty money at a casino and collecting clean winnings.",[]]]],["Cryptocurrencies and Virtual Assets",[["Using digital currencies for anonymous transactions. Example: Converting illegal funds into cryptocurrencies and transferring them.",[]]]],["Trade in Precious Metals and Gems",[["Using high-value commodities to move money secretly. Example: Illicit funds used to purchase and trade precious metals.",[]]]],["Offshore Accounts and Tax Havens",[["Storing money in foreign accounts with relaxed financial regulations. Example: Using offshore banks to conceal the source of funds.",[]]]],["Round-Tripping",[["Creating fake transactions to artificially inflate income. Example: Shuffling money through various accounts to create an illusion of legitimate income.",[]]]],["Mixing Legitimate and Illegitimate Funds",[["Blending illegal funds with legal ones to mask their source. Example: Combining clean and dirty money in the same business transactions.",[]]]],["Loan Back Schemes",[["False loans used to legitimize illicit funds. Example: Falsely documenting a loan to create a legal source for illegal funds.",[]]]]]],["Conclusion",[["Money laundering poses a serious threat to the integrity of financial systems and global security. India has taken proactive steps through legislative measures, strengthening reporting mechanisms, and",[]],["adopting modern technologies to prevent and combat money laundering. International cooperation and coordination are crucial to effectively tackle this transnational menace.",[]]]]]}]},C=D.cards,SRC=D.src,INT=[3,7,14,30,60];

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}},ST=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dstr=d=>(d||new Date()).toLocaleDateString('en-CA'),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const E={microtheme:'',question:'',file:'',page:'',override_k:'',date:'',status:''};
const meta=o=>Object.entries(o).filter(([k,v])=>v!==''&&v!==undefined&&v!==null).map(([k,v])=>k+'='+v).join(';');
const unmeta=s=>{const o={};String(s||'').split(';').forEach(p=>{const i=p.indexOf('=');if(i>0)o[p.slice(0,i)]=p.slice(i+1)});return o};
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start(a.currentTime+t);o.stop(a.currentTime+t+.15)})}catch(e){}}
const SYNC=(()=>{let cfg=LS('upsc-sync','{}'),Q=[],K='',O={},busy=false;const msg=m=>{const e=$('syn');if(e)e.textContent=m};
 async function post(tab,ops){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,tab,ops})});const j=await r.json();if(j.error)throw new Error(j.error)}
 async function get(tab,c){c=c||cfg;const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'tab='+tab+'&token='+encodeURIComponent(c.token));const j=await r.json();if(j.error)throw new Error(j.error);return j.rows}
 function push(tab,op){if(!cfg.url)return;op.tab=tab;Q=Q.filter(u=>!(u.tab==tab&&u.id==op.id));Q.push(op);ST(K+'-q',Q);flush()}
 async function flush(){if(!cfg.url||busy||!Q.length)return !Q.length;busy=true;msg('Syncing…');try{const sent=Q.slice();for(const t of new Set(sent.map(o=>o.tab)))for(let i=0,L=sent.filter(o=>o.tab==t);i<L.length;i+=400)await post(t,L.slice(i,i+400).map(o=>{const c=Object.assign({},o);delete c.tab;return c}));Q=Q.filter(u=>!sent.includes(u));ST(K+'-q',Q);msg('Synced ✓');if(Q.length)setTimeout(flush,50);return true}catch(e){msg('Sync failed, will retry ('+e.message+')');return false}finally{busy=false}}
 async function pull(){if(!cfg.url)return;if(Q.length&&!await flush())return;msg('Loading…');try{const res=await Promise.all(O.tabs.map(t=>get(t))),by={};O.tabs.forEach((t,i)=>by[t]=res[i]);O.apply(by);msg('Synced ✓')}catch(e){msg('Could not load: '+e.message)}}
 function init(o){O=o;K=o.key;Q=LS(K+'-q','[]');msg(cfg.url?'Connected':'Sync off');
  $('sb').onclick=()=>{const s=$('sy').style;s.display=s.display=='flex'?'none':'flex';$('su').value=cfg.url||'';$('sk').value=cfg.token||''};
  $('ss').onclick=async()=>{const u=$('su').value.trim(),k=$('sk').value.trim();if(!u||!k){$('sm').textContent='Enter both fields';return}$('sm').textContent='Connecting…';
   try{const rows=await get(O.tabs[0],{url:u,token:k});cfg={url:u,token:k};ST('upsc-sync',cfg);if(!rows.length){(o.seed?o.seed():[]).forEach(([t,op])=>{op.tab=t;Q.push(op)});ST(K+'-q',Q);await flush()}else await pull();$('sm').textContent='Connected';$('sy').style.display='none'}catch(e){$('sm').textContent='Failed: '+e.message}};
  $('sd').onclick=()=>{cfg={};try{localStorage.removeItem('upsc-sync')}catch(e){}msg('Sync off');$('sm').textContent='Disconnected'};pull()}
 return{init,push,pull}})();

const CI={};C.forEach(c=>CI[c.id]=c);
let K=LS('kc-state','{}'),mode='fc',sel=null,pill='all',shown=100,res=[],OPEN=new Set(),scope='topic',revealed=false;
const keep=()=>ST('kc-state',K),key=(m,id)=>m+'|'+id,stOf=(m,c)=>K[key(m,c.id)];
const cnt=it=>it.reduce((a,x)=>a+1+cnt(x[1]),0);
function op(k){const r=K[k],c=CI[k.slice(3)];return Object.assign({},E,{id:k,status:r?r.s:'',date:r?r.d:'',microtheme:c?c.t.slice(0,100):'',question:c?SRC[c.s]+' · '+c.g:'',file:r?meta({box:r.box,due:r.due}):'',page:r?r.n:''})}
function rate(m,c,v){const k=key(m,c.id),r=K[k]||{s:'',box:0,due:'',n:0,d:''};r.n++;r.d=dstr();if(v=='done'){r.box=r.s=='done'?Math.min(4,r.box+1):0;r.due=addD(INT[r.box])}else{r.box=0;r.due=addD(1)}r.s=v;K[k]=r;keep();SYNC.push('Cards',op(k))}
function reset(m,c){const k=key(m,c.id);delete K[k];keep();SYNC.push('Cards',op(k))}
Object.keys(SRC).forEach(k=>$('src').add(new Option(SRC[k],k)));
function fillGrp(){const g=$('grp');g.length=1;[...new Set(C.filter(c=>!$('src').value||c.s==$('src').value).map(c=>c.g))].forEach(x=>g.add(new Option(x,x)))}fillGrp();
const PILLS=[['all','All'],['new','New'],['review','Review'],['done','Completed'],['due','Due today']];
function filter(){const t=$('q').value.toLowerCase().trim(),s=$('src').value,g=$('grp').value;res=[];const n={};PILLS.forEach(p=>n[p[0]]=0);
 C.forEach(c=>{if(s&&c.s!=s)return;if(g&&c.g!=g)return;if(t&&!(c.t+' '+JSON.stringify(c.items)).toLowerCase().includes(t))return;const r=stOf(mode,c);
  const f={all:1,new:!r,review:r&&r.s=='review',done:r&&r.s=='done',due:r&&r.due<=dstr()};PILLS.forEach(p=>{if(f[p[0]])n[p[0]]++});if(f[pill])res.push(c.id)});
 $('pills').innerHTML=PILLS.map(p=>`<button data-p="${p[0]}" class="${pill==p[0]?'on':''}">${p[1]} ${n[p[0]]}</button>`).join('');shown=100;list();head()}
function head(){const f=C.filter(c=>(K['fc|'+c.id]||{}).s=='done').length,m=C.filter(c=>(K['mm|'+c.id]||{}).s=='done').length,d=Object.keys(K).filter(k=>K[k].due<=dstr()).length;$('stats').innerHTML=`<span><b>${f}</b>/${C.length} flashcards</span><span><b>${m}</b>/${C.length} mindmaps</span><span><b>${d}</b> due</span>`}
function item(id){const c=CI[id],r=stOf(mode,c);return `<div class="it${id==sel?' on':''}" data-i="${id}"><span class="dot ${r?r.s:''}"></span><div><div class="t">${esc(c.t)}</div><div class="meta">${esc(SRC[c.s])} · ${esc(c.g)} · p.${c.p}${r&&r.due?' · due '+r.due:''}</div></div></div>`}
function list(){$('cnt').textContent=res.length+' topics';$('list').innerHTML=res.slice(0,shown).map(item).join('')+(res.length>shown?'<div class="it" id="more"><b>Show more…</b></div>':'')}
// ---- flashcard ----
function kw(items,path){return items.map((it,i)=>{const p=path+'.'+i,h=it[1].length;return `<div><div class="kt${h?' x':''}" ${h?`data-x="${p}"`:''}><span class="ar">${h?'▸':''}</span>${esc(it[0])}${h?` <span class="meta">(${cnt(it[1])})</span>`:''}</div>${h?`<div class="kc" data-c="${p}" hidden>${kw(it[1],p)}</div>`:''}</div>`}).join('')}
function marks(m,c){const r=stOf(m,c);return `<div class="row"><button class="p" data-r="done">✓ Completed</button><button data-r="review">⟳ Review again</button><button data-r="reset">Reset</button><button data-nx="1">Next ›</button></div><div class="cb">${r?`${m=='fc'?'Flashcard':'Mindmap'}: ${r.s} · box ${r.box} · due ${r.due} · seen ${r.n}×`:`${m=='fc'?'Flashcard':'Mindmap'} not studied yet`}</div>`}
function fc(c){return `<div class="meta">${esc(SRC[c.s])} · ${esc(c.g)}${c.ch?' · '+esc(c.ch):''} · PDF p.${c.p}</div><h2>${esc(c.t)}</h2>${revealed?`<div class="row" style="margin:6px 0"><button data-ea="1">Expand all</button><button data-ca="1">Collapse all</button><span class="meta">${c.items.length} first-level keywords · ${cnt(c.items)} points in total</span></div><div class="box" style="padding:4px">${kw(c.items,'k')}</div>`:`<div class="box"><p>Say or write the key words for this topic, then reveal.</p><button class="p" data-rv="1">Reveal keywords</button></div>`}${marks('fc',c)}`}
// ---- mindmap ----
function allPaths(items,p,out){items.forEach((it,i)=>{const q=p+'.'+i;if(it[1].length){out.push(q);allPaths(it[1],q,out)}});return out}
function mnode(it,p,d){const h=it[1].length,o=OPEN.has(p);return `<div class="mb"><div class="mn d${Math.min(d,3)}" ${h?`data-m="${p}"`:''}>${esc(it[0])}${h?`<b>${o?'−':'+'}</b>`:''}</div>${h&&o?`<div class="mk">${it[1].map((k,i)=>mnode(k,p+'.'+i,d+1)).join('')}</div>`:''}</div>`}
function mm(c){const g=C.filter(x=>x.s==c.s&&x.g==c.g);
 let tree;if(scope=='topic')tree=`<div class="mm"><div class="mn root">${esc(c.t)}</div><div class="mk">${c.items.map((k,i)=>mnode(k,c.id+'.'+i,1)).join('')}</div></div>`;
 else tree=`<div class="mm"><div class="mn root">${esc(c.g)}</div><div class="mk">${g.map(x=>{const r=stOf('mm',x),o=OPEN.has('G'+x.id);return `<div class="mb"><div class="mn d1" data-g="${x.id}"><span class="dot ${r?r.s:''}" style="display:inline-block;margin-right:6px"></span>${esc(x.t)}<b>${o?'−':'+'}</b></div>${o?`<div class="mk">${x.items.map((k,i)=>mnode(k,x.id+'.'+i,2)).join('')}</div>`:''}</div>`}).join('')}</div></div>`;
 return `<div class="meta">${esc(SRC[c.s])} · ${esc(c.g)} · PDF p.${c.p}</div><h2>${esc(scope=='topic'?c.t:c.g)}</h2><div class="row" style="margin:6px 0"><button data-sc="topic" class="${scope=='topic'?'p':''}">This topic</button><button data-sc="group" class="${scope=='group'?'p':''}">Whole group</button><button data-ma="1">Expand all</button><button data-mc="1">Collapse</button></div><div class="mmw">${tree}</div>${marks('mm',c)}`}
function show(id){sel=id;const c=CI[id];if(!revealed&&mode=='fc'){}
 $('det').innerHTML=`<div class="vt"><button data-v="fc" class="${mode=='fc'?'on':''}">Flashcard</button><button data-v="mm" class="${mode=='mm'?'on':''}">Mindmap</button></div>`+(mode=='fc'?fc(c):mm(c));
 document.querySelectorAll('#list .it.on').forEach(e=>e.classList.remove('on'));const e=document.querySelector(`#list [data-i="${id}"]`);if(e)e.classList.add('on')}
function next(){if(!res.length)return;let i=res.indexOf(sel),n;if($('shuf').checked){const o=res.filter(x=>x!=sel);n=o.length?o[Math.floor(Math.random()*o.length)]:res[0]}else n=res[(i+1)%res.length];revealed=false;OPEN=new Set();show(n)}
document.addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('.it')){if(b.id=='more'){shown+=100;list();return}if(b.dataset.i){revealed=false;OPEN=new Set();show(b.dataset.i)}return}

 if(t.closest('[data-ea]')){document.querySelectorAll('.kc').forEach(k=>k.hidden=false);document.querySelectorAll('.kt.x .ar').forEach(a=>a.textContent='▾');return}
 if(t.closest('[data-ca]')){document.querySelectorAll('.kc').forEach(k=>k.hidden=true);document.querySelectorAll('.kt.x .ar').forEach(a=>a.textContent='▸');return}
 if(b=t.closest('[data-m]')){const p=b.dataset.m;OPEN.has(p)?OPEN.delete(p):OPEN.add(p);show(sel);return}
 if(b=t.closest('[data-g]')){const p='G'+b.dataset.g;OPEN.has(p)?OPEN.delete(p):OPEN.add(p);show(sel);return}
 if(b=t.closest('[data-sc]')){scope=b.dataset.sc;show(sel);return}
 if(t.closest('[data-ma]')){OPEN=new Set(scope=='topic'?allPaths(c.items,c.id,[]):C.filter(x=>x.s==c.s&&x.g==c.g).flatMap(x=>['G'+x.id].concat(allPaths(x.items,x.id,[]))));show(sel);return}

 if(b=t.closest('[data-r]')){const v=b.dataset.r;if(v=='reset')reset(mode,c);else rate(mode,c,v);filter();if(v!='reset')next();else show(sel);return}
 if(t.closest('[data-nx]')){next()}});
