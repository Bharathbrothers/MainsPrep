cus on welfare measures, introduction of public health and education programs.",[]],["Colonization's Social Effects - Cultural Syncretism and Inequality",[]]]],["Context",[["Colonization often led to the blending of indigenous and colonizer cultures.",[]],["Impact: Erosion of traditional norms, social hierarchies.",[]],["Impact on India: Cultural hybridity due to British influence, caste-based inequalities persisted.",[]],["Decolonization's Legacy - Nation-Building and Identity Struggles",[]]]],["Context",[["Newly independent nations faced challenges in forming identities and governance structures.",[]],["Impact: Ethnic conflicts, search for post-colonial identities.",[]],["Impact on India: Formation of Indian identity, challenges in managing diverse cultures.",[]]]]]},{"id":"G2|75","s":"G2","g":"GS-1 · Block-3 (History-II)","t":"5. Great Depression","p":139,"ch":"B. History of the World will include events from 18th century such as Industrial Revolution, world wars, Redrawal of National Boundaries, Colonization, Decolonization, political philosophies like Communism, Capitalism, Socialism etc.— their forms and effect on the society.","items":[["Great Depression: Causes, Origin, and Impact on the US",[["Introduction - Global Economic Crisis of the 1930s",[]]]],["Definition",[["The Great Depression refers to the severe worldwide economic downturn during the 1930s.",[]]]],["Context",[["Precipitated by the stock market crash of 1929 in the United States.",[]],["Causes of the Stock Market Crash",[]]]],["Context",[["Speculative bubble in stock prices, excessive borrowing and spending.",[]],["Impact: Overvaluation, investor panic, market collapse.",[]],["Economic Collapse in the US",[]]]],["Context",[["Rapid decline in industrial production, massive unemployment.",[]],["Impact: Businesses closed, millions jobless.",[]],["Global Spread of Economic Crisis",[]]]],["Context",[["Economic interconnectedness led to a domino effect.",[]],["Impact: Worldwide trade contraction, financial instability.",[]],["Impact on the Banking System",[]]]],["Context",[["Bank failures, loss of savings and assets.",[]],["Impact: Reduced credit availability, further economic contraction.",[]],["Government Response and New Deal Policies",[]]]],["Context",[["Franklin D. Roosevelt's New Deal aimed at recovery.",[]],["Impact: Public works programs, financial sector regulations.",[]],["Impact of Great Depression on India",[]],["Indian Economy and Agricultural Dependence",[]]]],["Context",[["India heavily agrarian, export-oriented economy.",[]],["Impact: Falling agricultural prices, revenue loss.",[]],["Exports Decline and Raw Material Glut",[]]]],["Context",[["Reduced global demand for Indian goods.",[]],["Impact: Export industries hit, raw material prices collapsed.",[]],["British Policies and Indian Revenues",[]]]],["Context",[["British implemented exchange controls, reduced revenue.",[]],["Impact: Economic strain, inadequate funds for development.",[]],["Agricultural Distress and Rural Unrest",[]]]],["Context",[["Plummeting agricultural prices affected rural communities.",[]],["Impact: Farmer distress, increased social tensions.",[]],["Urban Unemployment and Poverty",[]]]],["Context",[["Widespread joblessness and poverty in urban areas.",[]],["Impact: Growing urban slums, social upheaval.",[]],["Impact on Nationalist Movement",[]]]],["Context",[["Economic hardship intensified resentment against British rule.",[]],["Impact: Strengthened demand for self-rule, mass protests.",[]],["Gandhi's Salt March - Economic Protest",[]]]],["Context",[["Gandhi's salt march symbolized protest against economic injustice.",[]],["Impact: Focused world attention on India's plight.",[]],["Economic Policy Shifts and Self-Sufficiency",[]]]],["Context",[["India sought economic self-reliance, reduced dependency.",[]],["Impact: Shaped post-independence economic policies.",[]],["Legacy - Economic Resilience and Learning",[]]]],["Context",[["Great Depression lessons influenced India's future economic strategies.",[]],["Impact: Emphasis on diversification, self-reliance, and preparedness. --------------------------------------------------------------------------------------------------------------------------------------",[]]]]]},{"id":"G2|76","s":"G2","g":"GS-1 · Block-4 (Society)","t":"Salient features of Indian Society","p":141,"ch":"","items":[["Salient Features of Indian Society",[]],["Diversity",[["Diversity",[]]]],["Caste System",[["Caste System",[]]]],["Religious Pluralism",[["Religious Pluralism",[]]]],["Joint Family System",[["Joint Family System",[]]]],["Gender Dynamics",[["Gender Dynamics",[]]]],["Urban-Rural Divide",[["Urban-Rural Divide",[]]]],["Social Stratification",[["Social Stratification",[]]]],["Education and Literacy",[["Education and Literacy",[]]]],["Cultural Heritage",[["Cultural Heritage",[]]]],["Globalization Impact",[["Globalization Impact",[]]]],["Social Movements",[["Social Movements",[]]]],["Language Diversity",[["Language Diversity",[]]]]]},{"id":"G2|77","s":"G2","g":"GS-1 · Block-4 (Society)","t":"2. Effects of Globalization on Indian Society:","p":142,"ch":"","items":[["Overview",[["Cultural Exchange",[]]]],["Positive",[["Bollywood's global popularity showcases India's cultural richness and diversity, fostering cross-cultural understanding.",[]]]],["Negative",[["Increased influence of Western fashion trends on Indian youth, leading to a shift away from traditional attire.",[]],["Economic Growth",[]]]],["Positive",[["Opening up of the Indian economy in the 1990s resulted in increased foreign investments, driving economic growth.",[]]]],["Negative",[["Growing income inequality between urban professionals and rural agricultural workers.",[]],["Technology Transfer",[]]]],["Positive",[["The IT boom in cities like Bangalore turned India into a global technology hub, attracting multinational corporations.",[]]]],["Negative",[["Rural areas lacking access to advanced technologies and facing challenges in adopting modern agricultural practices.",[]],["Consumerism",[]]]],["Positive",[["Multinational retail giants entering India, like Walmart and Amazon, offering a wider range of products to consumers.",[]]]],["Negative",[["Rise of fast food chains contributing to changing dietary habits and health concerns, as seen in the obesity epidemic.",[]],["Employment Opportunities",[]]]],["Positive",[["BPO industry in cities like Gurgaon created job opportunities for English-speaking youth, especially women.",[]]]],["Negative",[["Outsourcing of manufacturing jobs to countries with cheaper labor, leading to unemployment in certain sectors.",[]],["Education and Awareness",[]]]],["Positive",[["Online learning platforms like Coursera and Khan Academy enable access to global education resources.",[]]]],["Negative",[["Pressure on students due to increased competition, leading to mental health issues and suicides.",[]],["Healthcare Impact",[]]]],["Positive",[["Medical tourism in India attracts patients from around the world seeking cost-effective treatments.",[]]]],["Negative",[["Urbanization and changing lifestyles contribute to a rise in non-communicable diseases like diabetes and cardiovascular diseases.",[]],["Social Dynamics",[]]]],["Positive",[["#MeToo movement in India gained momentum, shedding light on gender-based violence and discrimination.",[]]]],["Negative",[["Spread of Western beauty ideals affecting self-esteem among Indian women and influencing cosmetic surgery trends.",[]],["Cultural Homogenization",[]]]],["Positive",[["UNESCO recognizing yoga as an intangible cultural heritage, fostering a global appreciation for an ancient Indian practice.",[]]]],["Negative",[["Westernization leading to a decline in traditional crafts and languages in some regions.",[]],["Migration and Brain Drain",[]]]],["Positive",[["Indian diaspora contributing significantly to the economies of countries like the United States and the United Kingdom.",[]]]],["Negative",[["\"Brain drain\" phenomenon where skilled professionals seek opportunities abroad due to better working conditions.",[]],["Environmental Concerns",[]]]],["Positive",[["International collaborations like the Paris Agreement addressing climate change with India committing to renewable energy targets.",[]]]],["Negative",[["Rapid industrialization leading to pollution and resource depletion, as seen in the case of the Ganges River pollution.",[]],["Political Influence",[]]]],["Positive",[["India's active participation in BRICS and G20 summits amplifies its voice in global economic and political matters.",[]]]],["Negative",[["Concerns over sovereignty due to participation in trade agreements like RCEP (Regional Comprehensive Economic Partnership).",[]]]]]},{"id":"G2|78","s":"G2","g":"GS-1 · Block-4 (Society)","t":"3. Communalism:","p":144,"ch":"","items":[["Definition",[["Definition",[]]]],["Religious Tensions",[["Religious Tensions",[]]]],["Example",[["The Babri Masjid demolition in 1992 led to communal violence and tensions between Hindus and Muslims.",[]]]],["Politically Exploited",[["Politically Exploited",[]]]],["Example",[["Partition of India in 1947 was fueled by communal tensions, with politicians exploiting religious differences for political gains.",[]]]],["Hate Speech and Propaganda",[["Hate Speech and Propaganda",[]]]],["Example",[["Instances of hate speeches by political leaders or religious figures inflaming communal sentiments.",[]]]],["Rise of Extremist Groups",[["Rise of Extremist Groups",[]]]],["Example",[["Growth of extremist groups like the RSS and SIMI, promoting religious exclusivity and intolerance.",[]]]],["Communal Riots",[["Communal Riots",[]]]],["Example",[["Gujarat riots in 2002 resulted in widespread violence between Hindus and Muslims, leading to loss of life and property.",[]]]],["Polarization",[["Polarization",[]]]],["Example",[["Prevalence of divisive narratives during elections to polarize voters along religious lines.",[]]]],["Media Influence",[["Media Influence",[]]]],["Example",[["Biased reporting and sensationalism in media exacerbating communal tensions.",[]]]],["Impact on Governance",[["Impact on Governance",[]]]],["Example",[["Communal considerations affecting policy decisions and administrative appointments.",[]]]],["Education System",[["Education System",[]]]],["Example",[["Religious bias in educational curricula promoting a particular viewpoint.",[]]]],["Cultural Heritage",[["Cultural Heritage",[]]]],["Example",[["Attempts to rewrite history from a communal perspective, distorting the past.",[]]]],["Legal Measures",[["Legal Measures",[]]]],["Example",[["Laws against hate speech and promoting communal harmony like the Unlawful Activities (Prevention) Act.",[]]]],["Counter-Movements",[["Counter-Movements",[]]]],["Example",[["Initiatives by civil society organizations promoting interfaith dialogue and harmony.",[]]]],["Definition",[["Definition",[]]]],["Linguistic and Cultural Identity",[["Linguistic and Cultural Identity",[]]]],["Example",[["The linguistic reorganization of states in 1956, like the creation of Andhra Pradesh, based on language identity.",[]]]],["Resource Distribution",[["Resource Distribution",[]]]],["Example",[["Demands for more equitable sharing of resources, as seen in the disputes over water-sharing among states like Karnataka and Tamil Nadu.",[]]]],["Economic Disparities",[["Economic Disparities",[]]]],["Example",[["Northern states seeking more central assistance due to lower economic development compared to southern states.",[]]]],["Political Representation",[["Political Representation",[]]]],["Example",[["Assam Accord of 1985 addressing political and cultural concerns of Assamese people.",[]]]],["Autonomous Movements",[["Autonomous Movements",[]]]],["Example",[["Demand for Gorkhaland by the Gorkha Janmukti Morcha in Darjeeling, seeking greater autonomy for the region.",[]]]],["Cultural Preservation",[["Cultural Preservation",[]]]],["Example",[["Movements in tribal areas like Jharkhand for the preservation of cultural and tribal identity.",[]]]],["Language Disputes",[["Language Disputes",[]]]],["Example",[["Language-related tensions in states like Maharashtra over the use of Marathi.",[]]]],["Resentment against Center",[["Resentment against Center",[]]]],["Example",[["Demands for greater state rights and fiscal autonomy due to perceived central dominance.",[]]]],["Interstate Disputes",[["Interstate Disputes",[]]]],["Example",[["Boundary disputes like the Karnataka-Tamil Nadu water dispute over the Cauvery River.",[]]]],["Development Imbalance",[["Development Imbalance",[]]]],["Example",[["Demands for special status or economic packages by states like Bihar to address development gaps.",[]]]],["Political Alliances",[["Political Alliances",[]]]],["Example",[["Formation of regional political parties like AIADMK in Tamil Nadu and TRS in Telangana.",[]]]],["Impact on National Unity",[["Impact on National Unity",[]]]],["Example",[["Concerns over regionalism's potential to challenge the unity and integrity of the nation.",[]]]],["Definition",[["Definition",[]]]],["Constitutional Foundation",[["Constitutional Foundation",[]]]],["Example",[["The Indian Constitution enshrines secularism in the Preamble, emphasizing the commitment to treating all religions equally.",[]]]],["Religious Freedom",[["Religious Freedom",[]]]],["Example",[["Citizens have the right to practice and propagate any religion without discrimination.",[]]]],["State Neutrality",[["State Neutrality",[]]]],["Example",[["The Indian state does not promote or endorse any particular religion, ensuring a separation between religion and governance.",[]]]],["Uniform Civil Code Debate",[["Uniform Civil Code Debate",[]]]],["Example",[["The debate over implementing a uniform civil code to ensure equal rights for all citizens, irrespective of religious beliefs.",[]]]],["Religious Reforms",[["Religious Reforms",[]]]],["Example",[["Abolition of untouchability and discriminatory practices, promoting social equality and justice.",[]]]],["Religious Education",[["Religious Education",[]]]],["Example",[["Schools run by the government cannot promote any particular religion, ensuring a secular educational environment.",[]]]],["Protection of Minority Rights",[["Protection of Minority Rights",[]]]],["Example",[["Laws and policies safeguard the rights of religious and cultural minorities, such as reservations for minority communities.",[]]]],["State Holidays",[["State Holidays",[]]]],["Example",[["Public holidays are observed for various religious festivals, reflecting the diversity and pluralism of Indian society.",[]]]],["Political Representation",[["Political Representation",[]]]],["Example",[["India elects leaders from various religious backgrounds, promoting inclusivity and representation.",[]]]],["Freedom of Expression",[["Freedom of Expression",[]]]],["Example",[["Citizens can criticize or discuss religious matters without fear of persecution, upholding freedom of speech.",[]]]],["Religious Tolerance",[["Religious Tolerance",[]]]],["Example",[["Coexistence of various religious groups, such as Hindus, Muslims, Christians, and Sikhs, contributing to a harmonious society.",[]]]],["Challenges and Controversies",[["Challenges and Controversies",[]]]],["Example",[["Disputes over the role of religion in politics and issues like communal violence challenge the practice of secularism",[]]]]]},{"id":"G2|79","s":"G2","g":"GS-1 · Block-5 (Social Justice-1)","t":"Demography","p":148,"ch":"","items":[["Population Growth",[]],["Inputs",[["Birth rate, death rate, migration.",[]]]],["Outcomes",[["High population density, demographic dividend.",[]],["Example: India's population reaching 1.3 billion, with a large youth population.",[]],["Age Structure",[]]]],["Inputs",[["Birth and death rates in different age groups.",[]]]],["Outcomes",[["Youth bulge, aging population.",[]],["Example: India's median age being around 28 years, indicating a significant young population.",[]],["Fertility and Family Planning",[]]]],["Inputs",[["Access to contraceptives, family planning programs.",[]]]],["Outcomes",[["Total fertility rate, population control.",[]],["Example: Success of family planning initiatives in states like Kerala, leading to lower birth rates.",[]],["Migration Patterns",[]]]],["Inputs",[["Rural-urban migration, interstate migration.",[]]]],["Outcomes",[["Urbanization, strain on urban infrastructure.",[]],["Example: Large-scale migration from Bihar and Uttar Pradesh to cities like Delhi for employment.",[]],["Gender Ratio",[]]]],["Inputs",[["Sex-selective abortions, cultural preferences.",[]]]],["Outcomes",[["Skewed sex ratio, gender imbalance.",[]],["Example: Haryana and Punjab having lower female-to-male ratios due to preference for male children.",[]],["Urbanization Trends",[]]]],["Inputs",[["Economic opportunities, industrialization.",[]]]],["Outcomes",[["Growth of megacities, challenges in urban planning.",[]],["Example: Mumbai and Delhi witnessing rapid urbanization, leading to infrastructural strain.",[]],["Population Aging",[]]]],["Inputs",[["Increased life expectancy, declining birth rates.",[]]]],["Outcomes",[["Elderly care challenges, social security concerns.",[]],["Example: Japan facing issues related to an aging population, including a shrinking workforce.",[]],["Healthcare and Demographic Dividend",[]]]],["Inputs",[["Access to healthcare, quality of life.",[]]]],["Outcomes",[["Potential for economic growth through a productive young population.",[]],["Example: India's demographic dividend potential if properly skilled and employed.",[]],["Population Policies",[]]]],["Inputs",[["Government policies, family planning campaigns.",[]]]],["Outcomes",[["Shift in fertility rates, population control.",[]],["Example: China's one-child policy aimed at controlling population growth.",[]],["Population Density",[]]]],["Inputs",[["Land area, settlement patterns.",[]]]],["Outcomes",[["Pressure on resources, urban congestion.",[]],["Example: Mumbai being one of the most densely populated cities globally.",[]],["Demographic Transition",[]]]],["Inputs",[["Socioeconomic development, healthcare improvements.",[]]]],["Outcomes",[["Shift from high birth and death rates to low rates.",[]],["Example: India experiencing demographic transition with declining birth and death rates.",[]],["Census and Data Collection",[]]]],["Inputs",[["Periodic population census, surveys.",[]]]],["Outcomes",[["Insights into population trends, policy formulation.",[]],["Example: India's decennial census providing crucial data for planning and policymaking.",[]],["Population Growth",[["Increase in the number of individuals living in a specific area over time.",[]]]],["Birth Rate",[["The number of live births per 1,000 individuals in a given year.",[]]]],["Death Rate",[["The number of deaths per 1,000 individuals in a given year.",[]]]],["Fertility Rate",[["The average number of children born to a woman during her lifetime.",[]]]],["Mortality Rate",[["The rate at which deaths occur in a population.",[]]]],["Migration",[["The movement of individuals from one place to another, often leading to changes in population distribution.",[]]]],["Demographic Dividend",[["A period of economic growth resulting from a relatively large working-age population compared to dependent young and elderly individuals.",[]]]],["Youth Bulge",[["A disproportionate percentage of young people in a population age structure.",[]]]],["Population Pyramid",[["A graphical representation of a population's age and sex distribution.",[]]]],["Dependency Ratio",[["The ratio of dependent individuals (young and elderly) to the working-age population.",[]]]],["Urbanization",[["The process of people moving from rural to urban areas, resulting in the growth of cities and towns.",[]]]],["Ageing Population",[["A population with a high proportion of elderly individuals due to declining birth rates and increased life expectancy.",[]]]],["Sex Ratio",[["The ratio of males to females in a population.",[]]]],["Population Density",[["The number of individuals per unit of area (usually per square kilometer).",[]]]],["Population Policies",[["Government measures and strategies to control and manage population growth.",[]]]],["Demographic Transition",[["The shift from high birth and death rates to low birth and death rates as a country develops economically and socially.",[]]]],["Census",[["A complete enumeration of a population, typically conducted at regular intervals.",[]]]],["Sex-selective Abortions",[["Abortion based on the sex of the fetus, often leading to skewed sex ratios.",[]]]],["Megacity",[["A city with a population exceeding 10 million people.",[]]]],["Age Structure",[["The distribution of different age groups within a population.",[]]]],["Family Planning",[["The practice of controlling the number and spacing of children a family has, often through contraceptive methods.",[]]]],["Population Control",[["Efforts to regulate the size and growth rate of a population, often through government policies.",[]]]],["Migrant Worker",[["A person who moves from one region or country to another for employment opportunities.",[]]]],["Overpopulation",[["When the population of an area exceeds its carrying capacity, leading to strain on resources and services.",[]]]],["Diaspora",[["The dispersion of people from their original homeland to other parts of the world.",[]]]]]]]},{"id":"G2|80","s":"G2","g":"GS-1 · Block-5 (Social Justice-1)","t":"Aging and Issues","p":148,"ch":"","items":[["Aging Population",[]],["Description",[["An increasing proportion of elderly individuals in the population due to declining birth rates and increased life expectancy.",[]],["Impact: Strain on pension and healthcare systems, need for elderly care facilities.",[]],["Economic Challenges",[]]]],["Description",[["An aging population can lead to a shrinking workforce and potential skills shortage.",[]],["Impact: Increased dependency ratio, pressure on social security programs, and pension funds.",[]],["Healthcare Burden",[]]]],["Description",[["Older individuals often require more healthcare services due to age-related health issues.",[]],["Impact: Increased demand on healthcare infrastructure, rising healthcare costs.",[]],["Elderly Care Gap",[]]]],["Description",[["Lack of proper facilities and support for the elderly, especially for those without family or financial resources.",[]],["Impact: Neglect, abuse, inadequate healthcare and living conditions for the elderly.",[]],["Loneliness and Isolation",[]]]],["Description",[["Older individuals may experience social isolation due to the loss of friends, family members, and reduced mobility.",[]],["Impact: Mental health issues like depression and anxiety, lower quality of life.",[]],["Elder Abuse",[]]]],["Description",[["Physical, emotional, or financial mistreatment of elderly individuals, often by family members or caregivers.",[]],["Impact: Deterioration of physical and mental health, erosion of trust.",[]],["Intergenerational Relations",[]]]],["Description",[["Generation gap and differences in values and lifestyles between younger and older generations.",[]],["Impact: Strained family relationships, misunderstanding, and conflict.",[]],["Workforce Transition",[]]]],["Description",[["Transitioning from active employment to retirement, affecting financial stability and lifestyle.",[]],["Impact: Retirement planning challenges, potential loss of identity and purpose.",[]],["Elderly Rights and Dignity",[]]]],["Description",[["Ensuring that elderly individuals have access to their rights and are treated with respect.",[]],["Impact: Preventing neglect, abuse, and discrimination.",[]],["Ageism",[]]]],["Description",[["Discrimination or prejudice against individuals based on their age, often targeting the elderly.",[]],["Impact: Reduced opportunities, unequal treatment in employment, healthcare, and society.",[]],["Financial Security",[]]]],["Description",[["The need for financial stability and support during retirement years.",[]],["Impact: Insufficient savings leading to economic challenges during old age.",[]],["Technology Divide",[]]]],["Description",[["Older individuals may face difficulties in adopting and using technology, leading to exclusion from digital services.",[]],["Impact: Limited access to information, services, and social connections.",[]]]]]},{"id":"G2|81","s":"G2","g":"GS-1 · Block-5 (Social Justice-1)","t":"Population Explosion and Family Planning","p":148,"ch":"","items":[["Population Explosion",[]],["Description",[["Rapid and unsustainable growth of the population, often leading to overpopulation.",[]],["Causes: High birth rates, declining death rates, lack of awareness about family planning.",[]],["Resource Scarcity",[]],["Impact: Overpopulation strains resources like food, water, energy, and housing.",[]]]],["Consequences",[["Poverty, malnutrition, environmental degradation.",[]],["Economic Challenges",[]],["Impact: Large population can lead to unemployment, poverty, and reduced per capita income.",[]]]],["Solution",[["Family planning to achieve a balance between population growth and economic development.",[]],["Healthcare Strain",[]],["Impact: Overburdened healthcare systems struggle to provide adequate services to a rapidly growing population.",[]]]],["Solution",[["Promoting family planning to ensure manageable healthcare demand.",[]],["Education Gap",[]],["Impact: Rapid population growth can strain education systems, leading to inadequate access to quality education.",[]]]],["Solution",[["Family planning can help reduce pressure on educational infrastructure.",[]],["Family Planning Importance",[]]]],["Description",[["Voluntary planning of family size and spacing of births to achieve desired family goals.",[]],["Benefits: Improved maternal and child health, reduced poverty, better educational opportunities.",[]],["Contraceptive Methods",[]]]],["Description",[["Various methods like condoms, oral contraceptives, intrauterine devices (IUDs), sterilization.",[]],["Role: Contraception helps prevent unplanned pregnancies and supports family planning efforts.",[]],["Government Initiatives",[]],["Example: National Family Planning Program in India aims to promote family planning and reproductive health services.",[]],["Awareness Campaigns",[]],["Example: \"Hum Do, Hamare Do\" (We Two, Ours Two) campaign in India promotes small family norms.",[]],["Women's Empowerment",[]],["Impact: Access to family planning empowers women to make decisions about their own bodies and reproductive health.",[]],["Cultural and Social Factors",[]],["Impact: Cultural norms and social pressure can influence family planning decisions.",[]]]],["Solution",[["Advocacy for changing social attitudes and encouraging informed choices.",[]],["Role of NGOs and Healthcare Providers",[]]]],["Description",[["Non-governmental organizations (NGOs) and healthcare providers play a role in spreading awareness about family planning methods and benefits.",[]],["Global Efforts",[]],["Example: International organizations like UNFPA (United Nations Population Fund) work to promote family planning and reproductive health worldwide.",[]]]]]},{"id":"G2|82","s":"G2","g":"GS-1 · Block-5 (Social Justice-1)","t":"Two-Child Policy","p":148,"ch":"","items":[["Rationale",[["Governments implement the policy to curb rapid population growth, reduce strain on resources, and promote sustainable development.",[]]]],["Population Control",[["The policy aims to achieve a balance between population growth and available resources, ensuring long-term socio-economic stability.",[]]]],["Impact on Birth Rates",[["The policy leads to a decline in birth rates as families are restricted to having a maximum of two children.",[]]]],["Legal Enforcement",[["In some cases, the policy might be legally enforced, involving penalties or incentives to encourage compliance.",[]]]],["Variations",[["Policies can vary in their strictness; some might have exemptions for certain communities, rural areas, or specific circumstances.",[]]]],["Challenges",[["Implementing and enforcing such policies can face challenges related to ethical concerns, individual rights, and potential gender bias.",[]]]],["Success and Failures",[["The effectiveness of the policy depends on various factors, including cultural norms, awareness, and social support systems.",[]]]],["Gender Imbalance",[["In societies with a preference for male children, the policy can lead to skewed sex ratios if not properly managed.",[]]]],["Government Initiatives",[["Some governments might provide incentives, benefits, or support to families adhering to the two-child policy.",[]]]],["Case Studies",[["China's \"One-Child Policy\": Enforced from 1979 to 2015, aimed to control the population but resulted in demographic challenges like an aging population.",[]],["India's \"Hum Do, Hamare Do\": Encourages smaller families through awareness campaigns and benefits.",[]]]],["Role of Education",[["Awareness programs and education about family planning methods play a significant role in promoting the policy.",[]]]],["Economic and Social Impact",[["The policy can lead to a demographic dividend by reducing dependency ratios, enabling economic growth.",[]]]],["Human Rights Concerns",[["Critics argue that family planning decisions should be individual choices, and such policies might infringe upon personal freedoms.",[]]]],["Future Considerations",[["Countries need to balance population control with human rights, economic development, and social factors.",[]]]]]},{"id":"G2|83","s":"G2","g":"GS-1 · Block-5 (Social Justice-1)","t":"Poverty: Strategies, Inequality, Schemes, and Impact","p":148,"ch":"","items":[["Definition of Poverty",[]],["Description",[["Poverty refers to the state of being extremely poor, lacking the resources and means for a decent standard of living.",[]],["Example: A family living below the poverty line, struggling to afford basic necessities.",[]],["Strategies to Tackle Poverty",[]]]],["Description",[["Governments and organizations employ various strategies such as employment generation, education, healthcare, and social safety nets.",[]],["Example: India's National Rural Employment Guarantee Act (NREGA) provides rural households with 100 days of guaranteed wage employment to alleviate poverty.",[]],["Inequality and Poverty",[]]]],["Description",[["Inequality in income distribution can exacerbate poverty, as the gap between the rich and poor widens.",[]],["Example: Unequal access to quality education and healthcare perpetuates poverty cycles.",[]],["Social Safety Nets",[]]]],["Description",[["Government programs that provide financial support to vulnerable populations, reducing their risk of falling into poverty.",[]],["Example: Brazil's Bolsa Família program provides conditional cash transfers to low-income families to alleviate poverty.",[]],["Education and Skill Development",[]]]],["Description",[["Investing in education and skill development helps individuals escape poverty by enhancing employability.",[]],["Example: The Skill India initiative in India aims to provide skill training to millions of youth to improve their employment prospects.",[]],["Healthcare Access",[]]]],["Description",[["Access to affordable healthcare can prevent families from falling into poverty due to medical expenses.",[]],["Example: Thailand's Universal Healthcare Coverage scheme provides free healthcare services, reducing health-related financial burdens.",[]],["Microfinance and Entrepreneurship",[]]]],["Description",[["Providing small loans and support to micro-entrepreneurs empowers individuals to start businesses and improve their economic condition.",[]],["Example: Grameen Bank in Bangladesh provides microloans to impoverished individuals, promoting self-employment.",[]],["Food Security Programs",[]]]],["Description",[["Ensuring access to nutritious food through initiatives like subsidized food distribution can mitigate hunger and malnutrition.",[]],["Example: India's Public Distribution System (PDS) provides subsidized food grains to eligible families.",[]],["Affordable Housing",[]]]],["Description",[["Ensuring access to affordable and safe housing helps prevent families from becoming homeless and vulnerable.",[]],["Example: Singapore's Housing and Development Board provides subsidized housing for low-income families.",[]],["Impact of Poverty Alleviation Schemes",[]]]],["Description",[["Well-designed poverty alleviation schemes can uplift marginalized communities, improving their overall well-being.",[]],["Example: Mexico's Oportunidades program has helped reduce poverty rates and improve health and education outcomes among beneficiaries.",[]],["Global Initiatives",[]]]],["Description",[["International organizations like the United Nations and World Bank collaborate to design and implement poverty reduction programs worldwide.",[]],["Example: The Sustainable Development Goals (SDGs) include a goal to eradicate extreme poverty and hunger by 2030.",[]],["Long-term Impact",[]]]],["Description",[["Successful poverty reduction strategies lead to improved human development indices, increased economic growth, and enhanced social cohesion.",[]],["Example: China's rapid economic growth and poverty reduction over the last few decades have significantly improved living standards for millions",[]]]],["NOTES FEEDBACK :- abhinavhinducollegedu@gmail.com",[]]]},{"id":"G2|84","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"1. History of Planning in India - From Bombay Plan to Last Five-Year Plan","p":159,"ch":"1. Indian Economy and issues relating to Planning","items":[["Introduction",[["The history of planning in India spans from the pre-independence era to the modern age, marked by different approaches and ideologies.",[]]]],["Bombay Plan (1944)",[["Proposed by a group of prominent industrialists, the Bombay Plan aimed at post- independence economic development.",[]],["Emphasized heavy industrialization, infrastructure, and comprehensive economic policy.",[]],["Achievements",[["Laid the foundation for future economic planning discussions.",[]],["Highlighted the need for industrial growth and self-reliance.",[]]]],["Challenges",[["Limited representation of diverse sectors and perspectives.",[]],["The plan's focus on heavy industry raised concerns about environmental impact.",[]]]],["Example",[["The Bombay Plan laid the groundwork for the development of core industries in India, such as steel and heavy machinery.",[]]]]]],["First Five-Year Plan (1951-1956)",[["India's first formal plan, focusing on agricultural development, irrigation, and power generation. (Harrod Domar Model)",[]],["Establishment of Planning Commission to formulate plans and allocate resources.",[]],["Achievements",[["Achieved an average annual growth rate of 3.6%.",[]],["Significant progress in building infrastructure, like dams and power plants.",[]]]],["Challenges",[["Limited resources due to post-independence challenges.",[]],["Overemphasis on heavy industries affected other sectors.",[]]]],["Example",[["Bhakra Nangal Dam, a major irrigation and power generation project, was initiated during this plan.",[]]]]]],["Second Five-Year Plan (1956-1961)",[["Emphasized industrialization and the establishment of public sector industries.",[]],["Nehru-Mahalanobis model adopted, emphasizing heavy industry and capital goods.",[]],["Achievements",[["Continued industrial growth with a focus on heavy industries.",[]],["Strengthened the public sector's role in economic development.",[]]]],["Challenges",[["Imbalance between heavy and consumer industries.",[]],["Slow progress in the agricultural sector.",[]]]],["Example",[["Establishment of the Steel Authority of India Limited (SAIL) to boost steel production.",[]]]]]],["Third Five-Year Plan (1961-1966)",[["Introduction of Green Revolution to boost agricultural productivity.",[]],["Concentrated on self-reliance and reducing disparities among regions.",[]],["Achievements",[["Green Revolution led to significant increase in food production.",[]],["Enhanced focus on agricultural research and irrigation.",[]]]],["Challenges",[["Regional disparities persisted despite efforts.",[]],["Challenges in ensuring equitable distribution of benefits.",[]]]],["Example",[["Successful implementation of the High-Yielding Variety (HYV) seeds led to increased wheat and rice production.",[]]]]]],["Fourth Five-Year Plan (1969-1974)",[["Aimed at achieving \"growth with stability\" and reducing poverty.",[]],["Shift towards the private sector's role in industrial development.",[]],["Achievements",[["Increased focus on poverty alleviation and rural development.",[]],["Industrial licensing policies underwent reforms.",[]]]],["Challenges",[["Oil crisis in 1973 impacted the economy.",[]],["Slow progress in reducing income inequalities.",[]]]],["Example",[["The nationalization of banks during this period aimed to promote financial inclusion and stability.",[]]]]]],["Fifth Five-Year Plan (1974-1979)",[["Emphasis on poverty alleviation and employment generation.",[]],["Plan disrupted by the oil crisis and economic challenges.",[]],["Achievements",[["Initiated policies for promoting small-scale industries and rural employment.",[]],["Increased investments in social sectors like education and healthcare.",[]]]],["Challenges",[["Economic challenges due to global oil crisis.",[]],["Slowdown in industrial growth and development.",[]]]],["Example",[["The Integrated Rural Development Program (IRDP) was launched to uplift rural households by providing income-generating assets.",[]]]]]],["Sixth Five-Year Plan (1980-1985)",[["Focused on increasing agricultural productivity, rural development, and employment generation.",[]],["Introduction of the National Technology Mission.",[]],["Achievements",[["Achieved higher agricultural growth due to technology-driven interventions.",[]],["Rural development initiatives like the Minimum Needs Program.",[]]]],["Challenges",[["Inflation and external debt impacted economic stability.",[]],["Limited progress in reducing income disparities.",[]]]],["Example",[["The National Dairy Development Board's Operation Flood was a success, making India the world's largest milk producer.",[]]]]]],["Seventh Five-Year Plan (1985-1990)",[["Aimed at modernizing and technologically upgrading industries.",[]],["Stress on self-reliance, export promotion, and addressing environmental issues.",[]],["Achievements",[["Industrial growth with an emphasis on technology and quality.",[]],["Export-oriented units and policy measures for foreign investment.",[]]]],["Challenges",[["Balance of payments crisis and fiscal deficits.",[]],["Need for better environmental management.",[]]]],["Example",[["The establishment of Export Processing Zones (EPZs) contributed to boosting exports.",[]]]]]],["Eighth Five-Year Plan (1992-1997)",[["Shift towards economic reforms and liberalization.",[]],["Focus on human resource development, poverty alleviation, and infrastructure.",[]],["Achievements",[["Economic liberalization and opening up of the economy to foreign investment.",[]],["Emphasis on social sector programs like education and healthcare.",[]]]],["Challenges",[["Adjusting to the new era of economic liberalization.",[]],["Ensuring benefits of reforms reach all sections of society.",[]]]],["Example",[["The introduction of the New Economic Policy (1991) marked a significant shift towards market-oriented reforms.",[]]]]]],["Ninth Five-Year Plan (1997-2002)",[["Emphasized growth with equity and social justice.",[]],["Focus on education, health, and information technology.",[]],["Achievements",[["Continued economic growth with increased attention to human development.",[]],["Strengthening of rural infrastructure through programs like Pradhan Mantri Gram Sadak Yojana (PMGSY).",[]]]],["Challenges",[["Ensuring the benefits of growth reach marginalized sections.",[]],["The challenge of maintaining fiscal discipline.",[]]]],["Example",[["The National Health Policy (2002) aimed to improve healthcare services and access across the nation.",[]]]]]],["Tenth Five-Year Plan (2002-2007)",[["Aimed at doubling the per capita income within a decade.",[]],["Focus on infrastructure, education, healthcare, and rural development.",[]],["Achievements",[["Impressive growth in GDP and per capita income.",[]],["Expansion of infrastructure, including roads and telecommunications.",[]]]],["Challenges",[["Disparities between urban and rural areas remained.",[]],["Environmental concerns arising from rapid economic growth.",[]]]],["Example",[["The Sarva Shiksha Abhiyan (SSA) was launched to provide universal elementary education.",[]]]]]],["Eleventh Five-Year Plan (2007-2012)",[["Focus on inclusive growth, reduction of poverty, and regional disparities.",[]],["Introduced flagship programs like National Rural Health Mission and National Skill Development Mission.",[]],["Achievements",[["Considerable reduction in poverty and increase in inclusive growth indicators.",[]],["Implementation of flagship programs aimed at improving healthcare and skills.",[]]]],["Challenges",[["Disparities between states persisted.",[]],["Challenges in effective implementation and monitoring of programs.",[]]]],["Example",[["The Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA) aimed at providing employment opportunities to rural households.",[]]]]]],["Twelfth Five-Year Plan (2012-2017)",[["Emphasis on faster, sustainable, and more inclusive growth.",[]],["Focus on social sectors, infrastructure, and innovation.",[]],["Achievements",[["Progress in social indicators like literacy and life expectancy.",[]],["Steps taken towards enhancing ease of doing business and promoting innovation.",[]]]],["Challenges",[["Slowdown in economic growth during certain years.",[]],["Structural issues in various sectors requiring attention.",[]]]],["Example",[["The Pradhan Mantri Jan Dhan Yojana (PMJDY) aimed to provide financial inclusion to unbanked populations.",[]]]]]],["Niti Aayog replaced Planning Commission",[["NITI Aayog replaced the Planning Commission.",[]],["Focus on Sustainable Development Goals (SDGs), digitalization, and addressing regional imbalances.",[]],["Achievements",[["Continued focus on sustainable development and innovation.",[]],["Introduction of initiatives like Make in India and Swachh Bharat Abhiyan.",[]]]],["Challenges",[["Achieving balanced and equitable development across states.",[]],["Ensuring environmental sustainability amidst rapid development.",[]]]],["Example",[["The Digital India initiative aimed at transforming India into a digitally empowered society.",[]]]]]],["Conclusion",[["The history of planning in India reflects the nation's journey towards economic growth, development, and social progress.",[]],["Each Five-Year Plan addressed specific challenges and opportunities, contributing to India's development trajectory.",[]]]]]},{"id":"G2|85","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"2. Issues and Solutions Relating to Planning in India","p":165,"ch":"1. Indian Economy and issues relating to Planning","items":[["Introduction",[["Economic planning in India has been pivotal for growth, yet it grapples with multifaceted challenges that necessitate strategic solutions and policy innovations.",[]]]],["Lack of Implementation",[]],["Challenge",[["Bureaucratic hurdles and inefficiencies often hinder effective plan execution.",[]],["Example: The delay in completing the Mumbai Metro Line 3 due to land acquisition issues and administrative bottlenecks.",[]]]],["Solution",[["Implementing technology-driven monitoring systems and simplifying clearance processes can streamline implementation.",[]]]],["Regional Disparities",[]],["Challenge",[["Bridging the gap between prosperous and backward regions is an ongoing challenge.",[]],["Example: The contrasting development levels between Maharashtra and Bihar highlight the need for targeted policies.",[]]]],["Solution",[["Launching state-specific programs like the \"Bihar Development Mission\" to uplift less developed regions.",[]],["Scheme Example: The Aspirational Districts Programme focuses on transforming 130 backward districts across India.",[]]]],["Inclusive Growth",[]],["Challenge",[["Ensuring growth benefits all segments of society remains a challenge.",[]],["Example: Despite overall economic progress, marginalized tribal communities in Odisha still struggle with poverty.",[]]]],["Solution",[["Implementing targeted programs like the Tribal Sub-Plan to improve the socio-economic conditions of tribal populations.",[]]]],["Sustainability and Environment",[]],["Challenge",[["Harmonizing planning with environmental preservation is vital.",[]],["Example: The deteriorating air quality in Delhi-NCR region due to industrial emissions and vehicular pollution.",[]]]],["Solution",[["Integrating pollution control measures into industrial policies and promoting electric mobility solutions.",[]],["Scheme Example: The National Mission for Sustainable Agriculture promotes climate-resilient farming practices.",[]]]],["Changing Global Dynamics",[]],["Challenge",[["Globalization requires adapting planning strategies to remain competitive.",[]],["Example: The need to update trade policies to accommodate the rise of e- commerce and digital transactions.",[]]]],["Solution",[["Introducing e-commerce-friendly trade regulations and developing robust digital infrastructure.",[]]]],["Inefficient Resource Allocation",[]],["Challenge",[["Ensuring optimal resource allocation across sectors is vital.",[]],["Example: Excessive investment in large infrastructure projects sometimes diverts resources from essential sectors like healthcare.",[]]]],["Solution",[["Implementing data-driven resource allocation strategies and allocating budgets for critical sectors.",[]]]],["Public vs. Private Sector Balance",[]],["Challenge",[["Striking a balance between public and private sectors is essential.",[]],["Example: Dominance of state-owned enterprises affecting competition and innovation in sectors like telecommunications.",[]]]],["Solution",[["Encouraging private sector participation through strategic divestments and promoting fair competition.",[]]]],["Rapid Urbanization",[]],["Challenge",[["Urbanization strains infrastructure and housing provisions.",[]],["Example: Rapid urbanization leading to inadequate housing and overburdened urban amenities in cities like Bengaluru.",[]]]],["Solution",[["Implementing urban planning policies, investing in affordable housing projects, and promoting sustainable urban development.",[]],["Scheme Example: The Smart Cities Mission focuses on developing 100 cities with modern infrastructure and amenities.",[]]]],["Data Limitations",[]],["Challenge",[["Planning relies on accurate and timely data, which can be limited.",[]],["Example: Delays in data collection and reporting hampering timely policy adjustments.",[]]]],["Solution",[["Introducing real-time data collection mechanisms and creating platforms for data sharing among government departments.",[]]]],["Volatile External Factors",[]],["Challenge",[["Global economic uncertainties can disrupt planned trajectories.",[]],["Example: The economic downturn caused by the COVID-19 pandemic affecting trade and growth projections.",[]]]],["Solution",[["Creating contingency plans, diversifying export markets, and maintaining a resilient fiscal policy.",[]]]],["Conclusion",[["Addressing these challenges demands a collaborative approach, innovative policy measures, and a keen focus on adaptability.",[]],["Implementing solutions grounded in inclusivity, sustainability, and innovation can ensure effective and equitable economic planning in India.",[]]]]]},{"id":"G2|86","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"3. GDP , Computing methodology & Changes , Potential GDP & its determinants, constraints in realising Potential GDP","p":167,"ch":"1. Indian Economy and issues relating to Planning","items":[["Gross Domestic Product (GDP)",[]],["Definition",[["GDP measures the total value of all goods and services produced within a country's borders in a specific time period.",[]]]],["Computing Methodology & Changes",[]],["Before 2015",[]],["Base Year",[["2004-05.",[]]]],["Approach",[["Expenditure Approach: (Consumption + Investment + Govt. Spending + Exports).",[]]]],["Production Approach",[["Factor Cost, excluding taxes and subsidies.",[]]]],["Informal Sector",[["Not fully captured, limited representation.",[]]]],["Quality Adjustments",[["Limited consideration of product improvements.",[]]]],["Weights Update",[["Infrequent updates, not reflective of changing consumption patterns.",[]]]],["After 2015",[]],["Base Year",[["Changed to 2011-12.",[]],["Benefits: Reflects more recent economic structure and consumption patterns.",[]]]],["Approach",[["Expenditure Approach: (Consumption + Govt. Expenditure + Investments + Exports). (same)",[]]]],["Production Approach",[["Market Prices, includes taxes and subsidies.",[]],["Benefits: Provides a more comprehensive picture of production value.",[]]]],["Informal Sector",[["Improved representation through value-added method.",[]],["Benefits: Inclusion of unorganized sector's contribution for accuracy.",[]]]],["Quality Adjustments",[["More comprehensive to reflect improved product quality.",[]],["Benefits: Captures real economic value considering quality improvements.",[]]]],["Weights Update",[["Reflects changing consumption patterns more accurately.",[]],["Benefits: Reflects current consumption behaviour, enhancing accuracy.",[]],["The changes in computing methodology after 2015 aimed to enhance accuracy, inclusivity, and alignment with the evolving economic structure and consumption patterns.",[]]]],["Potential GDP & its Determinants",[]],["Potential GDP Definition",[["The maximum sustainable output an economy can achieve without causing inflation.",[]],["Determinants",[]]]],["Labor Force Growth",[["More workers, increased output.",[]],["Example: India's demographic dividend adding to potential GDP.",[]]]],["Capital Accumulation",[["Investment boosts productivity.",[]],["Example: Technology investments improving manufacturing efficiency.",[]]]],["Technological Advancement",[["Innovations enhance production efficiency.",[]],["Example: Precision agriculture tech increasing farm productivity.",[]]]],["Human Capital Development",[["Skilled workforce for higher productivity.",[]],["Example: Skill India program enhancing worker skills.",[]]]],["Constraints in Realizing Potential GDP",[]],["Infrastructure Deficit",[["Inadequate facilities hinder production.",[]],["Example: Insufficient cold storage affects agricultural output.",[]]]],["Skill Mismatch",[["Lack of skilled workforce affects efficiency.",[]],["Example: IT sector demands skilled programmers.",[]]]],["Regulatory Bottlenecks",[["Complex regulations impede business.",[]],["Example: Lengthy approval processes delay projects.",[]]]],["Resource Scarcity",[["Limited natural resources limit capacity.",[]],["Example: Limited water availability affects agriculture.",[]]]],["Financial Constraints",[["Limited credit access hampers investment.",[]],["Example: MSMEs facing difficulty accessing loans.",[]]]]]},{"id":"G2|87","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"4. Niti Aayog VS Planning Commission","p":169,"ch":"1. Indian Economy and issues relating to Planning","items":[["NITI Aayog",[]],["Formation (Example)",[["Established in 2015, replacing Planning Commission, to promote flexible and collaborative policy formulation.",[]],["Role (Example): Functions as a think tank, advising on policies like Atal Innovation Mission to foster entrepreneurship.",[]]]],["Approach (Example)",[["Promotes cooperative federalism via platforms like NITI Forum for Northeast, addressing regional disparities.",[]]]],["Composition (Example)",[["Comprises PM, CMs, experts; Joint Action Plan for Andaman and Nicobar Islands showcases unity.",[]]]],["Functions (Example)",[["Focus on sectors like healthcare, evident through National Health Stack development.",[]]]],["Flexibility (Example)",[["States empowered in policy-making, e.g., Agriculture Marketing Reforms to suit local needs.",[]]]],["Planning Commission",[]],["Formation (Example)",[["Created in 1950 to shape India's development, Draft First Five-Year Plan a landmark initiative.",[]],["Role (Example): Played role in Green Revolution through allocation of resources and technology dissemination.",[]]]],["Approach (Example)",[["Centralized approach in Nehruvian era, emphasized heavy industry development.",[]]]],["Composition (Example)",[["Led by Deputy Chairman, included experts; National Education Policy guided by expertise.",[]]]],["Functions (Example)",[["Allocation of funds to sectors, e.g., ICDS for child development and welfare.",[]]]],["Critiques (Example)",[["Lack of state involvement criticized; skewed resource allocation underlined by regional disparities.",[]]]],["(Feedback/errors regarding notes – abhinavhinducollegedu@gmail.com)",[]],["Key Differences",[]],["Approach (Example)",[["NITI Aayog's \"15-Year Vision, 7-Year Strategy, 3-Year Action Plan\" supports long-term development.",[]]]],["Participation (Example)",[["NITI Aayog's Governing Council involves CMs, e.g., Sustainable Development Goals localized.",[]]]],["Decision-Making (Example)",[["NITI Aayog's collaboration with states on aspirational districts showcases customized approach.",[]],["Role (Example): NITI Aayog's Aarogya Setu App during COVID-19 exemplifies innovation-driven solutions.",[]],["Impact (Example): NITI Aayog's emphasis on grassroots projects enhances livelihoods, such as AMRUT mission for urban transformation.",[]]]],["Conclusion",[["NITI Aayog's inclusive, flexible, and innovative approach has strengthened collaborative governance, policy formulation, and developmental planning in India.",[]]]]]},{"id":"G2|88","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"5. Investment and Capital Formation, Concession Agreement between Public and Private Entity","p":170,"ch":"1. Indian Economy and issues relating to Planning","items":[["Investment and Capital Formation",[]],["Investment Definition",[["Committing resources to generate future income or achieve a goal.",[]],["Example: Foreign direct investment (FDI) in India's manufacturing sector.",[]]]],["Capital Formation",[["Accumulation of physical and financial assets.",[]],["Example: Infrastructure development, such as building roads and bridges.",[]]]],["Factors in Designing a Concession Agreement between Public and Private Entity",[["Clear Objectives",[["Agreement's purpose, scope, and goals defined.",[]],["Example: Mumbai-Pune Expressway's efficient connectivity target.",[]]]],["Risk Allocation",[["Roles in managing operational and financial risks defined.",[]],["Example: Metro projects with risk-sharing between authorities and private firms.",[]]]],["Regulatory Framework",[["Laws, policies, approvals aligned to ensure compliance.",[]],["Example: PPP model in education ensuring quality standards.",[]]]],["Project Viability",[["Feasibility studies assess project's technical, financial viability.",[]],["Example: Renewable energy projects studied for sustainability.",[]]]],["Revenue Sharing",[["Clearly outline revenue distribution between parties.",[]],["Example: Toll collection division in road infrastructure projects.",[]]]],["Performance Standards",[["Define service quality, project delivery benchmarks.",[]],["Example: Concessionaire's commitment to maintain road quality in BOT projects.",[]]]],["Public Interest",[["Ensure services accessible, affordable to the public.",[]],["Example: Affordable housing through PPP model in urban development.",[]]]],["Dispute Resolution",[["Mechanisms to address conflicts and disputes.",[]],["Example: Arbitration clauses in PPP agreements.",[]]]]]],["Conclusion",[["Designing a concession agreement requires meticulous consideration of factors to ensure successful collaboration between public and private entities, promoting efficiency, quality, and sustainable development.",[]]]]]},{"id":"G2|89","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"6. Issues with Mobilization of Resources","p":172,"ch":"1. Indian Economy and issues relating to Planning","items":[["Introduction",[["Effective mobilization of resources is crucial for sustaining economic growth and development. However, India faces a range of challenges in this endeavor, necessitating strategic solutions and reforms.",[]]]],["Tax Evasion and Black Money",[]],["Challenge",[["Combatting tax evasion and curbing the generation of black money.",[]],["Example: Instances of high-profile tax evasion cases involving undisclosed income and offshore accounts.",[]]]],["Solution",[["Initiatives like the Voluntary Disclosure of Income Scheme encourage taxpayers to declare undisclosed income.",[]]]],["Informal Economy and Tax Base",[]],["Challenge",[["Formalizing the informal economy to enhance the tax base.",[]],["Example: A substantial portion of economic activity, like street vending, often remains unaccounted for.",[]]]],["Solution",[["The Goods and Services Tax (GST) aims to integrate informal sectors into the formal tax structure.",[]]]],["High Non-Performing Assets (NPAs)",[]],["Challenge",[["Addressing the issue of high NPAs in the banking sector.",[]],["Example: A surge in NPAs in public sector banks due to lending to high-risk projects.",[]]]],["Solution",[["The Insolvency and Bankruptcy Code (IBC) expedites resolution of NPAs and facilitates debt recovery.",[]]]],["Public Sector Disinvestment Challenges",[]],["Challenge",[["Ensuring transparent and efficient public sector disinvestment.",[]],["Example: Delays and controversies in the disinvestment of Air India raised concerns.",[]]]],["Solution",[["The privatization of Bharat Petroleum Corporation Limited (BPCL) aims to improve efficiency and resource utilization.",[]],["Scheme Example: The Strategic Disinvestment Policy outlines the government's approach to disinvesting in public sector enterprises.",[]]]],["Illicit Financial Flows",[]],["Challenge",[["Preventing illegal financial flows and capital flight.",[]],["Example: Cases of money laundering and transfer pricing manipulation across borders.",[]]]],["Solution",[["Stricter enforcement of anti-money laundering laws and international cooperation under FATF guidelines.",[]]]],["Infrastructure Financing Gap",[]],["Challenge",[["Bridging the financing gap for critical infrastructure projects.",[]],["Example: Limited funds for projects like the Mumbai-Ahmedabad Bullet Train.",[]]]],["Solution",[["Attracting foreign investment through projects like the Delhi-Mumbai Industrial Corridor.",[]]]],["State-Level Fiscal Imbalances",[]],["Challenge",[["Addressing fiscal disparities among states.",[]],["Example: Revenue disparities between developed and less developed states like Maharashtra and Bihar.",[]]]],["Solution",[["Finance Commission's recommendations allocate resources based on states' fiscal capacities and development needs.",[]]]],["Limited Foreign Direct Investment (FDI) in Some Sectors",[]],["Challenge",[["Encouraging FDI in critical sectors.",[]],["Example: Restrictions on FDI in multi-brand retail impacting investment in organized retail.",[]]]],["Solution",[["Easing FDI norms to attract investment in sectors like retail and aviation.",[]]]],["Inefficient Resource Allocation",[]],["Challenge",[["Ensuring optimal resource allocation across sectors.",[]],["Example: Uneven allocation affecting sectors like healthcare despite growing health demands.",[]]]],["Solution",[["Introducing outcome-based budgeting to allocate resources based on performance and needs.",[]]]],["Volatile Commodity Prices",[]],["Challenge",[["Managing the impact of fluctuating commodity prices.",[]],["Example: Fluctuations in oil prices impacting fiscal health and subsidy burden.",[]]]],["Solution",[["Creating a stabilization fund to cushion the fiscal impact of volatile commodity prices.",[]]]],["Conclusion",[["By addressing these resource mobilization challenges with targeted reforms, India can optimize resource utilization and support sustained economic growth and development.",[]],["Realizing these solutions requires collaborative efforts and proactive policy adjustments.",[]]]]]},{"id":"G2|90","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"7. Growth and Development: Challenges and Solutions","p":174,"ch":"1. Indian Economy and issues relating to Planning","items":[["Introduction",[["Navigating the path of sustainable growth and development is a complex endeavour. India faces various challenges on this journey, requiring strategic solutions and policy adaptations for achieving inclusive and balanced progress.",[]]]],["Inclusive Growth",[]],["Challenge",[["Ensuring that economic growth benefits all segments of society.",[]],["Example: Despite overall growth, income inequality persists between urban and rural areas.",[]]]],["Solution",[["Implementing targeted social welfare programs like the National Social Assistance Program (NSAP) to uplift the marginalized.",[]]]],["Environmental Sustainability",[]],["Challenge",[["Balancing economic growth with environmental preservation.",[]],["Example: Urbanization and industrialization leading to air and water pollution.",[]]]],["Solution",[["Integrating green technologies and eco-friendly practices, as seen in the National Solar Mission and Swachh Bharat Abhiyan.",[]]]],["Infrastructure Deficit",[]],["Challenge",[["Addressing the gap in quality infrastructure across sectors.",[]],["Example: Insufficient transportation infrastructure affecting trade and connectivity.",[]]]],["Solution",[["Launching initiatives like the Bharatmala Project to develop road networks and promote seamless movement of goods.",[]]]],["Education and Skill Gap",[]],["Challenge",[["Bridging the gap between education and employable skills.",[]],["Example: Unemployment among educated youth due to skills mismatch.",[]]]],["Solution",[["Skill development initiatives like PMKVY and fostering industry-academia collaborations.",[]]]],["Agriculture Distress",[]],["Challenge",[["Ensuring the viability of agriculture and the welfare of farmers.",[]],["Example: Frequent crop failures and lack of market access affecting rural livelihoods.",[]]]],["Solution",[["Enhancing irrigation infrastructure, promoting organic farming, and implementing crop insurance schemes.",[]]]],["Access to Healthcare",[]],["Challenge",[["Ensuring equitable access to quality healthcare services.",[]],["Example: Disparities in healthcare quality between urban and rural areas.",[]]]],["Solution",[["Expanding the reach of programs like Ayushman Bharat and strengthening primary healthcare centers.",[]]]],["Urbanization Challenges",[]],["Challenge",[["Managing rapid urbanization and improving urban living conditions.",[]],["Example: Overcrowded slums and inadequate sanitation facilities.",[]]]],["Solution",[["Developing smart cities, upgrading slum areas, and ensuring affordable housing through initiatives like PMAY.",[]]]],["Financial Inclusion",[]],["Challenge",[["Extending financial services to all sections of society.",[]],["Example: Lack of access to banking services in remote and rural areas.",[]]]],["Solution",[["Promoting initiatives like Jan Dhan Yojana to ensure affordable and accessible financial services for the unbanked.",[]]]],["Gender Inequality",[]],["Challenge",[["Reducing gender-based disparities in education, employment, and wages.",[]],["Example: Lower workforce participation and unequal pay for women.",[]]]],["Solution",[["Empowering women through programs like Beti Bachao Beti Padhao and promoting gender-sensitive policies.",[]]]],["Technological Integration",[]],["Challenge",[["Harnessing technology for development while addressing digital divide.",[]],["Example: Limited access to digital infrastructure in rural areas.",[]]]],["Solution",[["Promoting Digital India initiatives and expanding digital connectivity to rural regions.",[]]]],["Conclusion",[["India's growth and development journey is marked by diverse challenges that demand comprehensive solutions.",[]],["By implementing targeted policies and fostering collaboration between stakeholders, India can stride towards holistic development that encompasses economic, social, and environmental dimensions.",[]]]]]},{"id":"G2|91","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"8. Employment: Issues and Challenges","p":176,"ch":"1. Indian Economy and issues relating to Planning","items":[["Introduction",[["Employment is crucial for growth, but challenges persist. These hurdles must be tackled to ensure productive and inclusive work opportunities.",[]]]],["Unemployment and Underemployment",[]],["Issue",[["Limited job opportunities for the workforce.",[]],["Example: Youth unemployment remains high, indicating skills mismatch.",[]]]],["Solution",[["Skill India focuses on skill development to boost employability.",[]]]],["Informal Sector Dominance",[]],["Issue",[["Informal jobs lack security.",[]],["Example: Daily wage laborers lack benefits.",[]]]],["Solution",[["PM Shram Yogi Maandhan aids informal sector workers.",[]]]],["Job Quality and Decent Work",[]],["Issue",[["Poor working conditions and wages.",[]],["Example: Gig economy lacks job security.",[]]]],["Solution",[["Labor laws enhancement ensures fair work conditions.",[]]]],["Skill Mismatch",[]],["Issue",[["Skills don't match job needs.",[]],["Example: Graduates face unemployment due to skills mismatch.",[]]]],["Solution",[["Sarva Shiksha Abhiyan and Skill India focus on skills aligned with demand.",[]]]],["Youth Unemployment",[]],["Issue",[["High youth joblessness.",[]],["Example: Many educated youth are unemployed.",[]]]],["Solution",[["National Career Service and Stand-Up India promote youth employment.",[]]]],["Gender Disparities",[]],["Issue",[["Unequal gender opportunities.",[]],["Example: Women face limited roles and pay gaps.",[]]]],["Solution",[["Beti Bachao Beti Padhao and STEP Scheme aim for gender equality.",[]]]],["Rural-Urban Divide",[]],["Issue",[["Urban-rural job gap.",[]],["Example: Urban areas develop faster.",[]]]],["Solution",[["PMAY and MGNREGA aim for balanced growth.",[]]]],["Technological Disruption",[]],["Issue",[["Technology replacing jobs.",[]],["Example: Automation affects manufacturing.",[]]]],["Solution",[["Skill upgradation and innovation foster future job readiness.",[]]]],["Informalization of Formal Jobs",[]],["Issue",[["Formal jobs turn informal.",[]],["Example: Contractual work lacks stability.",[]]]],["Solution",[["Labor regulations strengthen rights of gig workers.",[]]]],["Brain Drain and Migration",[]],["Issue",[["Skilled workers leave.",[]],["Example: Professionals migrate for better opportunities.",[]]]],["Solution",[["Skill India and Make in India aim to retain talent.",[]]]],["Conclusion",[["Employment challenges demand focused solutions. India can ensure inclusive work growth for a productive and equitable society.",[]]]]]},{"id":"G2|92","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"9. Manufactuting – Labour VS Capital Intensive, Jobless growth","p":178,"ch":"1. Indian Economy and issues relating to Planning","items":[["Manufacturing Sector: Labor-Intensive vs. Capital-Intensive Exports",[]],["Issue",[["Manufacturing sector has shown a bias towards capital-intensive exports over labor-intensive ones.",[]]]],["Solution",[["Strategies to promote labor-intensive exports:",[]],["Skill Development",[["Invest in training and upskilling labor force.",[]],["Example: Skill India Mission enhancing workforce capabilities.",[]]]],["Technology Transfer",[["Enhance technology diffusion to labor-intensive industries.",[]],["Example: Promote technology parks for MSMEs.",[]]]],["Cluster Development",[["Promote industrial clusters for economies of scale.",[]],["Example: Textile hubs in Tirupur and Surat.",[]]]],["Export Incentives",[["Tailored incentives for labor-intensive sectors.",[]],["Example: SEZs for electronics manufacturing.",[]]]],["Market Diversification",[["Target markets with demand for labor-intensive products.",[]],["Example: Garment exports to developed economies.",[]]]],["Infrastructure Improvement",[["Better logistics for efficient supply chains.",[]],["Example: Dedicated freight corridors for seamless transportation.",[]]]]]],["Jobless Growth in India",[]],["Definition",[["Economic growth without a proportional increase in employment opportunities.",[]],["Example: India's GDP growth without corresponding job creation.",[]],["Causes",[]],["Automation",[["Technology replaces labor in certain sectors.",[]],["Example: Robotics in manufacturing.",[]]]],["Skill Gap",[["Mismatch between job requirements and workforce skills.",[]],["Example: Lack of skilled workers in emerging sectors.",[]]]],["Informal Sector",[["Majority in low-productivity informal jobs.",[]],["Example: Street vendors, daily wage laborers.",[]]]],["Sectoral Shift",[["Structural changes impact employment patterns.",[]],["Example: Decline in labor-intensive industries.",[]]]]]],["Addressing Jobless Growth",[["Skill Development",[["Enhance workforce skills for emerging sectors.",[]],["Example: Skill India Mission targeting diverse industries.",[]]]],["Entrepreneurship Promotion",[["Encourage startups and small businesses.",[]],["Example: Start-Up India campaign.",[]]]],["Labor Reforms",[["Balance workers' rights with ease of hiring.",[]],["Example: Labor Codes to simplify rules.",[]]]],["Investment in Labor-Intensive Sectors",[["Stimulate job creation in key sectors.",[]],["Example: Government schemes supporting textile and apparel industries.",[]]]]]],["Conclusion",[["Promoting labor-intensive exports requires skill development, technological upgradation, and market diversification. Addressing jobless growth mandates skill enhancement, entrepreneurship promotion, and investment in labor- intensive sectors to align growth with employment generation.",[]]]]]},{"id":"G2|93","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"10. Inclusive Growth and issues arising from it.","p":179,"ch":"1. Indian Economy and issues relating to Planning","items":[["Introduction",[["Inclusive growth aims for fair development, yet it brings challenges. These hurdles need attention to make growth truly equal.",[]]]],["Poverty Reduction and Income Disparities",[]],["Issue",[["Despite growth, income gaps persist.",[]],["Example: Some still live in poverty despite overall economic progress.",[]]]],["Solution",[["Welfare programs like MGNREGA and direct transfers aim to bridge income disparities.",[]]]],["Social Exclusion and Marginalization",[]],["Issue",[["Some groups miss growth benefits.",[]],["Example: Tribes and remote areas lack basics for development.",[]]]],["Solution",[["Plans like Special Central Assistance aim to aid marginalized areas.",[]]]],["Quality Education and Skills Gap",[]],["Issue",[["Ensuring good education for all.",[]],["Example: Rural areas lack quality education.",[]]]],["Solution",[["Programs like Sarva Shiksha Abhiyan focus on balanced education access.",[]]]],["Healthcare Disparities",[]],["Issue",[["Equal healthcare access for all.",[]],["Example: Rural areas struggle with healthcare.",[]]]],["Solution",[["Ayushman Bharat scheme aims for fair healthcare coverage.",[]]]],["Digital Divide and Technology Access",[]],["Issue",[["Equal access to technology.",[]],["Example: Rural areas lack digital facilities.",[]]]],["Solution",[["Digital India campaign aims for tech access in all regions.",[]]]],["Gender Inequality",[]],["Issue",[["Equal opportunities for all genders.",[]],["Example: Women face limited rights.",[]]]],["Solution",[["Beti Bachao Beti Padhao focuses on women's upliftment.",[]]]],["Urban-Rural Divide",[]],["Issue",[["Bridging city-rural gap.",[]],["Example: Cities grow faster.",[]]]],["Solution",[["PMAY and rural electrification aim for balanced growth.",[]]]],["Environmental Sustainability",[]],["Issue",[["Growth without harming environment.",[]],["Example: Pollution affects communities.",[]]]],["Solution",[["Sustainable growth balances environment and development.",[]]]],["Access to Financial Services",[]],["Issue",[["Equal finance access.",[]],["Example: Rural areas lack banks.",[]]]],["Solution",[["Jan Dhan Yojana and microfinance boost financial access.",[]]]],["Infrastructure Inequities",[]],["Issue",[["Equal basic services access.",[]],["Example: Remote areas lack facilities.",[]]]],["Solution",[["PMGSY and Swachh Bharat aim to improve infrastructure.",[]]]],["Conclusion",[["Inclusive growth brings challenges, needing focused solutions. Through these strategies, India can ensure balanced progress, shared by all.",[]]]]]},{"id":"G2|94","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"11. Government Budgeting","p":181,"ch":"1. Indian Economy and issues relating to Planning","items":[["Government Budgeting",[]],["Introduction",[["Government budgeting is a vital tool for allocating resources, ensuring financial stability, and driving economic growth. Effective budgeting requires addressing various aspects to achieve fiscal discipline and meet societal needs.",[]]]],["Revenue Generation",[]],["Challenge",[["Generating sufficient revenue to cover expenditures.",[]],["Example: Balancing tax rates to boost revenue without burdening citizens.",[]]]],["Solution",[["Implementing progressive taxation and widening the tax base to enhance revenue collection.",[]]]],["Expenditure Prioritization",[]],["Challenge",[["Allocating funds to critical sectors effectively.",[]],["Example: Balancing social welfare and infrastructure spending.",[]]]],["Solution",[["Results-oriented budgeting directs funds to priority areas like education and healthcare.",[]]]],["Fiscal Deficit Management",[]],["Challenge",[["Managing the gap between revenue and expenditure.",[]],["Example: Avoiding excessive borrowing to control fiscal deficit.",[]]]],["Solution",[["Prudent fiscal management, reducing non-essential expenditures.",[]]]],["Public Debt Control",[]],["Challenge",[["Managing public debt to prevent over-borrowing.",[]],["Example: Balancing development loans without increasing debt burden.",[]]]],["Solution",[["Monitoring debt-to-GDP ratio and focusing on productive investments.",[]]]],["Allocative Efficiency",[]],["Challenge",[["Efficiently allocating funds to maximize outcomes.",[]],["Example: Optimizing resources for growth-enhancing projects.",[]]]],["Solution",[["Evidence-based budgeting to allocate funds based on project performance.",[]]]],["Inclusive Spending",[]],["Challenge",[["Ensuring budgetary benefits reach marginalized sections.",[]],["Example: Directing funds to uplift rural and disadvantaged communities.",[]]]],["Solution",[["Implementing targeted schemes like MGNREGA and social welfare programs.",[]]]],["Contingency Planning",[]],["Challenge",[["Preparing for unforeseen emergencies.",[]],["Example: Allocating funds for natural disaster relief.",[]]]],["Solution",[["Maintaining a contingency fund for urgent needs.",[]]]],["Transparent Allocation",[]],["Challenge",[["Ensuring transparency in resource allocation.",[]],["Example: Preventing misallocation and corruption in funds distribution.",[]]]],["Solution",[["Implementing open budget initiatives for citizen scrutiny.",[]]]],["Performance Evaluation",[]],["Challenge",[["Evaluating project outcomes and impact.",[]],["Example: Assessing whether allocated funds achieve desired results.",[]]]],["Solution",[["Monitoring and assessing project performance through regular audits.",[]]]],["Long-Term Planning",[]],["Challenge",[["Balancing short-term needs with long-term goals.",[]],["Example: Allocating funds for infrastructure projects with long-lasting benefits.",[]]]],["Solution",[["Creating a multi-year budget framework for strategic planning.",[]]]],["Conclusion",[["Government budgeting requires a delicate balance between revenue generation, expenditure prioritization, and fiscal responsibility. By addressing these challenges, governments can ensure efficient resource utilization and promote sustainable economic development.",[]]]]]},{"id":"G2|95","s":"G2","g":"GS-3 · Block-1 (Economy issues)","t":"12. GST","p":183,"ch":"1. Indian Economy and issues relating to Planning","items":[["Goods and Services Tax (GST): A Comprehensive Analysis",[]],["Introduction",[]],["Definition",[["GST is a comprehensive indirect tax levied on the supply of goods and services across India.",[]],["Example: Tax on goods and services is unified into a single levy.",[]],["",[]]]],["Historical Context",[["Proposed in 2000, implemented on July 1, 2017, after Constitutional Amendment Bill in 2016.",[]],["Overcame decades of discussions and negotiations.",[]]]],["Objective",[]],["Objective",[["Simplify tax structure, eliminate cascading effect, promote ease of doing business.",[]]]],["GST Council Structure",[]],["Composition",[["Headed by the Union Finance Minister, includes state finance ministers.",[]],["Example: Collaborative decision-making involving center and states.",[]]]],["Decision-Making",[["Decides tax rates, exemptions, administrative mechanisms.",[]],["Example: Uniform tax rates determined through consensus.",[]]]],["Vote Powers",[["Centre holds 1/3rd votes, states hold 2/3rd votes for decisions.",[]],["Example: Ensures balanced representation and decision-making.",[]]]],["Balancing Act",[["Ensures common national market without disrupting federal structure.",[]],["Example: Considers states' perspectives to maintain harmonization.",[]]]],["Regular Meetings",[["Conducts meetings to discuss issues, recommend changes.",[]],["Example: Discussions on GST rate revisions during pandemic.",[]],["",[]],["Features of GST",[]],["One Nation, One Tax",[]]]],["Advantage",[["Replaces multiple taxes like VAT, excise, service tax.",[]],["Example: Central excise and state VAT merged into GST.",[]],["Destination-Based Tax",[]]]],["Advantage",[["Tax levied at the place of consumption.",[]],["Example: Goods produced in one state, consumed in another taxed in the consuming state.",[]],["Dual GST System",[]]]],["Advantage",[["Implemented by both central and state governments.",[]],["Example: Central GST (CGST) and State GST (SGST) collected concurrently.",[]],["Input Tax Credit",[]]]],["Advantage",[["Tax paid on inputs deducted from output tax liability.",[]],["Example: Manufacturer deducts input GST from final product's GST.",[]],["Composition Scheme",[]]]],["Advantage",[["For small businesses with reduced compliance.",[]],["Example: Businesses with turnover up to ₹1.5 crore (₹75 lakh for special category states) can opt.",[]],["Online System",[]]]],["Advantage",[["Electronic filing, transparency, reduced corruption.",[]],["Example: GSTN portal for tax filing and returns.",[]],["Benefits of GST",[]],["Simplification and Efficiency",[]]]],["Advantage",[["Streamlined tax structure, reduced tax evasion.",[]],["Example: Multiple taxes replaced with GST.",[]],["Elimination of Cascading Tax",[]]]],["Advantage",[["Tax on tax eliminated, reduces production costs.",[]],["Example: Input tax credit mechanism.",[]],["Enhanced Transparency",[]]]],["Advantage",[["Online filing, real-time tracking, reduces corruption.",[]],["Example: E-way bill system for goods transportation.",[]],["Promotion of Make in India",[]]]],["Advantage",[["Seamless flow of goods across states, encourages manufacturing.",[]],["Example: Encouraging local production due to uniform tax rates.",[]],["Wider Tax Base",[]]]],["Advantage",[["Increased tax compliance, revenue generation.",[]],["Example: Bringing previously untaxed sectors under GST.",[]],["Boost to Digital Economy",[]]]],["Advantage",[["Online tax filing, promotes digital transactions.",[]],["Example: Digital payments for GST.",[]],["Challenges of GST",[]],["Complexity",[]]]],["Challenge",[["Different tax rates for various items.",[]],["Example: Multiple tax slabs: 5%, 12%, 18%, 28%.",[]],["Technology Infrastructure",[]]]],["Challenge",[["Technical glitches in GSTN portal.",[]],["Example: Initial difficulties during
